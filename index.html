        <div class="field" style="flex:0;min-width:180px;"><label>डिफ़ॉल्ट फाइन ₹/दिन</label><input type="number" min="0" step="1" id="feeFineDef" value="${db.feeSettings.finePerDay}"></div>
      </div>
    </div>
    <div class="row no-print" style="align-items:flex-end;">
      <div class="field" style="flex:0;min-width:160px;"><label>कक्षा</label>
        <select id="ruleClsSel">${classNames.length===0?'<option>—</option>':classNames.map(c=>`<option value="${c}" ${c===st.cls?'selected':''}>${c}</option>`).join('')}</select>
      </div>
    </div>
    <div id="ruleBody" style="margin-top:12px;"></div>
  </div>`);

  const commitDefaults = async ()=>{
    const dd = parseInt(wrap.querySelector('#feeDueDayDef').value,10);
    const fd = parseFloat(wrap.querySelector('#feeFineDef').value);
    db.feeSettings.dueDay = (!isNaN(dd) && dd>=1 && dd<=28) ? dd : 10;
    db.feeSettings.finePerDay = (!isNaN(fd) && fd>=0) ? fd : 0;
    const ok = await saveDB();
    if(ok) toast('डिफ़ॉल्ट सेटिंग सेव हो गई');
  };
  wrap.querySelector('#feeDueDayDef').onchange = commitDefaults;
  wrap.querySelector('#feeFineDef').onchange = commitDefaults;

  const ruleBody = wrap.querySelector('#ruleBody');
  if(classNames.length===0){
    ruleBody.appendChild(el(`<div class="empty">अभी कोई कक्षा नहीं बनी है — पहले "कक्षा व छात्र" में जाकर कक्षा बनाएं</div>`));
    return wrap;
  }
  wrap.querySelector('#ruleClsSel').onchange = (e)=>{ st.cls = e.target.value; st.sid = null; render(); };
  ruleBody.appendChild(renderFeeStudentRules(st.cls, st));
  return wrap;
}

// Per-student tuition rule editor: monthly amount, due day/fine override, discount, start month.
function renderFeeStudentRules(cls, st){
  const students = (db.classes[cls] && db.classes[cls].students) || [];
  if(students.length===0){
    return el(`<div class="empty">इस कक्षा में कोई छात्र नहीं है — पहले "कक्षा व छात्र" में जाकर छात्र जोड़ें</div>`);
  }
  if(!st.sid || !students.some(s=>s.id===st.sid)) st.sid = students[0].id;
  const student = students.find(s=>s.id===st.sid);

  if(!db.feeConfig[cls]) db.feeConfig[cls] = {};
  if(!db.feeConfig[cls][st.sid]) db.feeConfig[cls][st.sid] = {monthly:0, dueDay:null, finePerDay:null, discountType:'none', discountValue:0, startMonth: todayStr().slice(0,7)};
  const cfg = db.feeConfig[cls][st.sid];
  if(!db.fees[cls]) db.fees[cls] = {};
  if(!db.fees[cls][st.sid]) db.fees[cls][st.sid] = [];
  const records = db.fees[cls][st.sid];

  const box = el(`<div>
    <div class="row no-print" style="align-items:flex-end;">
      <div class="field" style="min-width:200px;"><label>छात्र चुनें</label>
        <select id="ruleStuSel">${students.map(s=>`<option value="${s.id}" ${s.id===st.sid?'selected':''}>${s.roll} — ${s.name}</option>`).join('')}</select>
      </div>
    </div>
    <div style="margin:6px 0 16px;">
      <h3 style="margin:0 0 2px;font-family:'Noto Serif Devanagari',serif;color:var(--chalk);">${student.name}</h3>
      <p class="section-sub" style="margin:0;">कक्षा: ${cls} · रोल नं.: ${student.roll}</p>
    </div>
    <div class="fee-cfg-box no-print">
      <h4>मासिक ट्यूशन फीस सेटिंग</h4>
      <div class="row" style="margin-bottom:0;">
        <div class="field" style="flex:0;min-width:130px;"><label>मासिक फीस (₹)</label><input type="number" min="0" step="1" id="cfgMonthly" value="${cfg.monthly||''}" placeholder="जैसे: 500"></div>
        <div class="field" style="flex:0;min-width:120px;"><label>देय तारीख (खाली=डिफ़ॉल्ट)</label><input type="number" min="1" max="28" id="cfgDueDay" value="${cfg.dueDay||''}" placeholder="${db.feeSettings.dueDay}"></div>
        <div class="field" style="flex:0;min-width:120px;"><label>फाइन ₹/दिन (खाली=डिफ़ॉल्ट)</label><input type="number" min="0" step="1" id="cfgFine" value="${cfg.finePerDay!=null?cfg.finePerDay:''}" placeholder="${db.feeSettings.finePerDay}"></div>
        <div class="field" style="flex:0;min-width:120px;"><label>छूट (Discount)</label>
          <select id="cfgDiscType">
            <option value="none" ${cfg.discountType==='none'?'selected':''}>कोई छूट नहीं</option>
            <option value="amount" ${cfg.discountType==='amount'?'selected':''}>₹ राशि में</option>
            <option value="percent" ${cfg.discountType==='percent'?'selected':''}>% प्रतिशत में</option>
          </select>
        </div>
        <div class="field" style="flex:0;min-width:100px;"><label>छूट मान</label><input type="number" min="0" step="1" id="cfgDiscVal" value="${cfg.discountValue||''}" placeholder="0"></div>
        <div class="field" style="flex:0;min-width:130px;"><label>शुरुआत माह</label><input type="month" id="cfgStartMonth" value="${cfg.startMonth}"></div>
        <div class="field" style="flex:0;"><button class="primary" id="cfgSaveBtn">सेटिंग सेव करें</button></div>
      </div>
    </div>

    <h4 style="margin:22px 0 6px;font-family:'Noto Serif Devanagari',serif;color:var(--chalk);font-size:.98rem;">अन्य फीस (प्रवेश, परीक्षा, परिवहन आदि)</h4>
    <p class="section-sub no-print" style="margin:0 0 10px;">यहाँ राशि "देय" के रूप में जुड़ेगी — भुगतान बाद में "फीस जमा" टैब में जाकर "जमा करें" से दर्ज करें</p>
    <div class="row no-print" style="align-items:center;margin-bottom:6px;">
      <label style="display:flex;align-items:center;gap:6px;font-size:.85rem;color:var(--muted);cursor:pointer;">
        <input type="checkbox" id="feeApplyAll" style="width:auto;">
        इस कक्षा (${cls}) के सभी छात्रों पर एक साथ लागू करें
      </label>
    </div>
    <div class="row no-print">
      <div class="field" style="flex:0;"><label>दिनांक</label><input type="date" id="feeDate" value="${todayStr()}"></div>
      <div class="field"><label>मद (विवरण)</label><input id="feeParticulars" list="feeParticularsList" placeholder="जैसे: प्रवेश शुल्क">
        <datalist id="feeParticularsList">
          <option value="प्रवेश शुल्क"></option>
          <option value="परीक्षा शुल्क"></option>
          <option value="परिवहन शुल्क"></option>
          <option value="पुस्तक/वर्दी शुल्क"></option>
        </datalist>
      </div>
      <div class="field" style="flex:0;"><label>राशि (₹)</label><input type="number" id="feeAmount" min="0" step="1" placeholder="1500"></div>
      <div class="field" style="flex:0;"><button class="primary" id="feeAddBtn">लागू करें</button></div>
    </div>
    <div class="feeErr" style="color:var(--redpen);font-size:.82rem;margin:-8px 0 10px;"></div>

    <table><thead><tr><th>दिनांक</th><th>मद</th><th class="num">राशि</th><th>स्थिति</th></tr></thead><tbody id="feeRows"></tbody></table>
    <p style="margin-top:12px;font-size:.92rem;text-align:right;"><b>कुल राशि (अन्य फीस — ${student.name}): <span class="mono" id="feeTotal"></span></b> · भुगतान/रसीद के लिए "फीस जमा" टैब खोलें</p>
  </div>`);

  box.querySelector('#ruleStuSel').onchange = (e)=>{ st.sid = e.target.value; render(); };

  box.querySelector('#cfgSaveBtn').onclick = async ()=>{
    const monthly = parseFloat(box.querySelector('#cfgMonthly').value);
    const dueDayVal = box.querySelector('#cfgDueDay').value.trim();
    const fineVal = box.querySelector('#cfgFine').value.trim();
    const discType = box.querySelector('#cfgDiscType').value;
    const discVal = parseFloat(box.querySelector('#cfgDiscVal').value)||0;
    const startMonth = box.querySelector('#cfgStartMonth').value || todayStr().slice(0,7);
    cfg.monthly = (!isNaN(monthly) && monthly>0) ? monthly : 0;
    cfg.dueDay = dueDayVal ? Math.min(28, Math.max(1, parseInt(dueDayVal,10))) : null;
    cfg.finePerDay = fineVal!=='' ? Math.max(0, parseFloat(fineVal)) : null;
    cfg.discountType = discType;
    cfg.discountValue = discVal;
    cfg.startMonth = startMonth;
    // Retroactively apply the new discount to any month that isn't fully paid yet
    // (already-settled months are left untouched so past receipts stay accurate).
    records.forEach(r=>{
      if(r.kind==='tuitionDue'){
        const stt = tuitionDueStatus(cls, st.sid, r);
        if(stt.paid < r.amount){ r.discountType = cfg.discountType; r.discountValue = cfg.discountValue; }
      }
    });
    ensureTuitionDues(cls, st.sid);
    const ok = await saveDB();
    if(ok) toast('ट्यूशन फीस सेटिंग सेव हो गई');
    render();
  };

  // ---- Other (one-off) fee ledger — unchanged style, hardened against silent-save-failure ----
  // When "सभी छात्रों पर लागू करें" is checked, the same entry (date/particulars/amount/mode)
  // is recorded for every student in this class in one go, instead of just the selected one.
  box.querySelector('#feeAddBtn').onclick = async ()=>{
    const btn = box.querySelector('#feeAddBtn');
    const errBox = box.querySelector('.feeErr');
    errBox.textContent = '';
    const date = box.querySelector('#feeDate').value;
    const particulars = box.querySelector('#feeParticulars').value.trim();
    const amountVal = box.querySelector('#feeAmount').value;
    const amount = parseFloat(amountVal);
    const applyAll = box.querySelector('#feeApplyAll').checked;
    if(!date){ errBox.textContent = 'कृपया दिनांक भरें'; return; }
    if(!particulars){ errBox.textContent = 'कृपया मद/विवरण भरें'; return; }
    if(!amountVal || isNaN(amount) || amount<=0){ errBox.textContent = 'कृपया सही राशि भरें'; return; }
    btn.disabled = true; btn.textContent = 'सेव हो रहा है…';

    // Charging a fee no longer marks it paid on the spot — it's recorded as an
    // 'otherCharge' due, exactly like a tuition due, and shows up in "फीस जमा"
    // (छात्र फीस) where it can be collected — partially or fully — with a receipt.
    if(applyAll){
      const addedTo = [];
      students.forEach((s, idx)=>{
        if(!db.fees[cls]) db.fees[cls] = {};
        if(!db.fees[cls][s.id]) db.fees[cls][s.id] = [];
        const rec = {id:'oc'+Date.now()+Math.random().toString(36).slice(2,6)+idx, kind:'otherCharge', date, particulars, amount};
        db.fees[cls][s.id].push(rec);
        addedTo.push({sid:s.id, rec});
      });
      const ok = await saveDB();
      if(!ok){
        // roll back every student's entry so the screen never claims it was recorded when it wasn't
        addedTo.forEach(({sid, rec})=>{
          db.fees[cls][sid] = db.fees[cls][sid].filter(x=>x.id!==rec.id);
        });
        btn.disabled = false; btn.textContent = 'लागू करें';
        return;
      }
      toast(`फीस ${students.length} छात्रों पर लागू हो गई — अब "फीस जमा" टैब से जमा करें ✓`);
      render();
      return;
    }

    const rec = {id:'oc'+Date.now()+Math.random().toString(36).slice(2,6), kind:'otherCharge', date, particulars, amount};
    records.push(rec);
    const ok = await saveDB();
    if(!ok){
      const idx = records.indexOf(rec);
      if(idx>-1) records.splice(idx,1);
      btn.disabled = false; btn.textContent = 'लागू करें';
      return;
    }
    toast('फीस लागू हो गई — अब "फीस जमा" टैब से जमा करें ✓');
    render();
  };

  const rows = box.querySelector('#feeRows');
  let total = 0;
  // Show both legacy already-paid 'other' entries (older data, no due/collect concept)
  // and the newer 'otherCharge' due entries with their current paid/due status.
  const legacyRecords = records.filter(r=>r.kind==='other');
  const chargeRecords = records.filter(r=>r.kind==='otherCharge');
  legacyRecords.slice().sort((a,b)=> a.date<b.date?1:(a.date>b.date?-1:0)).forEach(r=>{
    total += Number(r.amount)||0;
    const tr = el(`<tr><td class="mono">${formatDateDMY(r.date)}</td><td>${r.particulars}</td><td class="num mono">₹${Number(r.amount).toLocaleString('en-IN')}</td><td><span class="fee-badge paid">भुगतान पूर्ण</span></td></tr>`);
    rows.appendChild(tr);
  });
  chargeRecords.slice().sort((a,b)=> a.date<b.date?1:(a.date>b.date?-1:0)).forEach(r=>{
    total += Number(r.amount)||0;
    const s = otherChargeStatus(cls, st.sid, r);
    const badgeText = s.status==='paid' ? 'भुगतान पूर्ण' : 'देय';
    const tr = el(`<tr><td class="mono">${formatDateDMY(r.date)}</td><td>${r.particulars}</td><td class="num mono">₹${Number(r.amount).toLocaleString('en-IN')}</td><td><span class="fee-badge ${s.status}">${badgeText}</span></td></tr>`);
    rows.appendChild(tr);
  });
  if(legacyRecords.length===0 && chargeRecords.length===0){
    rows.appendChild(el(`<tr><td colspan="4" style="text-align:center;color:var(--muted);">अभी तक कोई फीस नहीं लगाई गई है</td></tr>`));
  }
  box.querySelector('#feeTotal').textContent = `₹${total.toLocaleString('en-IN')}`;

  return box;
}

// Whole-class view: every student's total fee deposited + tuition dues status so far
function renderFeeClassSummary(cls, st){
  const students = (db.classes[cls] && db.classes[cls].students) || [];
  const box = el(`<div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;margin-bottom:10px;">
    <h3 style="font-family:'Noto Serif Devanagari',serif;color:var(--chalk);margin:0;">${cls} — फीस सारांश</h3>
    <button class="ghost no-print" id="classSummaryPrintBtn" type="button">🖨️ सारांश प्रिंट करें</button>
  </div>`);
  if(students.length===0){
    box.appendChild(el(`<div class="empty">इस कक्षा में कोई छात्र नहीं है</div>`));
    return box;
  }
  const table = el(`<table><thead><tr><th>रोल नं.</th><th>नाम</th><th class="num">कुल जमा राशि</th><th class="num">कुल बकाया</th><th>अंतिम भुगतान</th><th class="num no-print">कार्रवाई</th></tr></thead><tbody></tbody></table>`);
  const tbody = table.querySelector('tbody');
  let grandTotal = 0, grandDue = 0, anyDueGenerated = false;
  const printRows = [];
  const sorted = students.slice().sort((a,b)=>{
    const ra = parseFloat(a.roll), rb = parseFloat(b.roll);
    if(!isNaN(ra) && !isNaN(rb) && ra!==rb) return ra-rb;
    return String(a.roll).localeCompare(String(b.roll));
  });
  sorted.forEach(s=>{
    if(ensureTuitionDues(cls, s.id)) anyDueGenerated = true;
    const records = (db.fees[cls] && db.fees[cls][s.id]) || [];
    // Actual money collected so far: legacy one-off "other" entries (paid on the spot) +
    // tuitionPayment + otherPayment. 'tuitionDue' and 'otherCharge' are dues, not payments.
    const total = records.filter(r=>r.kind==='other' || r.kind==='tuitionPayment' || r.kind==='otherPayment').reduce((sum,r)=> sum + (Number(r.amount)||0), 0);
    grandTotal += total;
    const tuitionOutstanding = records.filter(r=>r.kind==='tuitionDue').reduce((sum,r)=> sum + tuitionDueStatus(cls, s.id, r).outstanding, 0);
    const chargeOutstanding = records.filter(r=>r.kind==='otherCharge').reduce((sum,r)=> sum + otherChargeStatus(cls, s.id, r).outstanding, 0);
    const outstanding = tuitionOutstanding + chargeOutstanding;
    grandDue += outstanding;
    const paymentDates = records.filter(r=>r.kind==='other' || r.kind==='tuitionPayment' || r.kind==='otherPayment').map(r=>r.date).filter(Boolean);
    const lastDate = paymentDates.length ? paymentDates.sort().slice(-1)[0] : null;
    printRows.push({roll:s.roll, name:s.name, total, outstanding, lastDate});
    const tr = el(`<tr><td class="mono">${s.roll}</td><td>${s.name}</td><td class="num mono">₹${total.toLocaleString('en-IN')}</td><td class="num mono" style="${outstanding>0?'color:var(--redpen);font-weight:700;':''}">₹${outstanding.toLocaleString('en-IN')}</td><td class="mono">${lastDate?formatDateDMY(lastDate):'—'}</td><td class="num no-print"></td></tr>`);
    const actionTd = tr.querySelector('td.num.no-print');
    const viewBtn = el(`<button class="ghost" type="button" style="padding:4px 10px;font-size:.78rem;">विवरण देखें</button>`);
    viewBtn.onclick = ()=>{ st.sid = s.id; st.mode = 'student'; render(); };
    actionTd.appendChild(viewBtn);
    tbody.appendChild(tr);
  });
  box.appendChild(table);
  box.appendChild(el(`<p style="margin-top:14px;font-size:.92rem;text-align:right;"><b>कुल कक्षा जमा राशि: <span class="mono">₹${grandTotal.toLocaleString('en-IN')}</span> · कुल बकाया: <span class="mono" style="color:var(--redpen);">₹${grandDue.toLocaleString('en-IN')}</span></b></p>`));
  box.querySelector('#classSummaryPrintBtn').onclick = ()=> printClassFeeSummary(cls, printRows, grandTotal, grandDue);
  if(anyDueGenerated) saveDB();
  return box;
}

// Single-student view: tuition config + monthly dues ledger + one-off fee ledger
function renderFeeStudentView(cls, st){
  const students = (db.classes[cls] && db.classes[cls].students) || [];
  if(students.length===0){
    return el(`<div class="empty">इस कक्षा में कोई छात्र नहीं है — पहले "कक्षा व छात्र" में जाकर छात्र जोड़ें</div>`);
  }
  if(!st.sid || !students.some(s=>s.id===st.sid)) st.sid = students[0].id;
  const student = students.find(s=>s.id===st.sid);

  if(!db.fees[cls]) db.fees[cls] = {};
  if(!db.fees[cls][st.sid]) db.fees[cls][st.sid] = [];
  const records = db.fees[cls][st.sid];
  if(!db.feeConfig[cls]) db.feeConfig[cls] = {};
  if(!db.feeConfig[cls][st.sid]) db.feeConfig[cls][st.sid] = {monthly:0, dueDay:null, finePerDay:null, discountType:'none', discountValue:0, startMonth: todayStr().slice(0,7)};
  const cfg = db.feeConfig[cls][st.sid];

  // Auto-generate this month's (and any missed past months') tuition due — happens
  // silently in the background so the school never has to remember to "open" a month.
  if(ensureTuitionDues(cls, st.sid)) saveDB();

  // Quick current totals for the header — total deposited so far (tuition + other)
  // and total currently outstanding (tuition dues only; there's no "due" concept for one-off fees).
  const allDues = records.filter(r=>r.kind==='tuitionDue');
  let headerTuitionPaid=0, headerOutstanding=0;
  allDues.forEach(due=>{
    const s = tuitionDueStatus(cls, st.sid, due);
    headerTuitionPaid += s.paid;
    headerOutstanding += s.outstanding;
  });
  const headerOtherPaid = records.filter(r=>r.kind==='other').reduce((sum,r)=> sum+(Number(r.amount)||0), 0);
  const otherCharges = records.filter(r=>r.kind==='otherCharge');
  let headerChargePaid=0, headerChargeOutstanding=0;
  otherCharges.forEach(ch=>{
    const s = otherChargeStatus(cls, st.sid, ch);
    headerChargePaid += s.paid;
    headerChargeOutstanding += s.outstanding;
  });
  const headerTotalPaid = headerTuitionPaid + headerOtherPaid + headerChargePaid;
  headerOutstanding += headerChargeOutstanding;

  const box = el(`<div>
    <div class="row no-print" style="align-items:flex-end;">
      <div class="field" style="min-width:200px;"><label>छात्र चुनें</label>
        <select id="feeStuSel">${students.map(s=>`<option value="${s.id}" ${s.id===st.sid?'selected':''}>${s.roll} — ${s.name}</option>`).join('')}</select>
      </div>
      <div class="field" style="flex:0;"><button class="ghost" id="feeStatementBtn">🖨️ फीस विवरण प्रिंट करें (जमा/बकाया)</button></div>
    </div>

    <div style="margin:6px 0 16px;display:flex;align-items:baseline;justify-content:space-between;flex-wrap:wrap;gap:10px;">
      <div>
        <h3 style="margin:0 0 2px;font-family:'Noto Serif Devanagari',serif;color:var(--chalk);">${student.name}</h3>
        <p class="section-sub" style="margin:0;">कक्षा: ${cls} · रोल नं.: ${student.roll}</p>
      </div>
      <div style="text-align:right;font-size:.88rem;">
        <div>कुल जमा: <b class="mono" style="color:#1E7A4C;">₹${headerTotalPaid.toLocaleString('en-IN')}</b></div>
        <div>कुल बकाया: <b class="mono" style="${headerOutstanding>0?'color:var(--redpen);':''}">₹${headerOutstanding.toLocaleString('en-IN')}</b></div>
      </div>
    </div>

    <div id="tuitionBody"></div>
    <div id="otherChargeBody" style="margin-top:22px;"></div>
  </div>`);

  box.querySelector('#feeStuSel').onchange = (e)=>{ st.sid = e.target.value; st.collectMonth = null; st.collectOther = null; render(); };
  box.querySelector('#feeStatementBtn').onclick = ()=> printFeeStatement(cls, student, cfg, records);

  // ---- Tuition dues table ----
  const tuitionBody = box.querySelector('#tuitionBody');
  const dues = records.filter(r=>r.kind==='tuitionDue').sort((a,b)=> a.month<b.month?1:(a.month>b.month?-1:0));
  if(!cfg.monthly || cfg.monthly<=0){
    tuitionBody.appendChild(el(`<div class="empty">इस छात्र की मासिक ट्यूशन फीस अभी सेट नहीं है — ऊपर राशि भरकर सेव करें</div>`));
  } else if(dues.length===0){
    tuitionBody.appendChild(el(`<div class="empty">अभी कोई माह जनरेट नहीं हुआ</div>`));
  } else {
    const ttable = el(`<table><thead><tr><th>माह</th><th class="num">फीस</th><th class="num">छूट</th><th class="num">फाइन</th><th class="num">जमा</th><th class="num">बकाया</th><th>स्थिति</th><th class="no-print">रसीद</th><th class="num no-print">कार्रवाई</th></tr></thead><tbody></tbody></table>`);
    const tbody = ttable.querySelector('tbody');
    dues.forEach(due=>{
      const s = tuitionDueStatus(cls, st.sid, due);
      const badgeCls = s.status==='paid'?'paid':(s.status==='overdue'?'overdue':'due');
      const badgeText = s.status==='paid'?'भुगतान पूर्ण':(s.status==='overdue'?`देर — ${s.daysLate} दिन`:'देय');
      const tr = el(`<tr><td>${monthLabelHindi(due.month)}</td><td class="num mono">₹${Number(due.amount).toLocaleString('en-IN')}</td><td class="num mono">₹${s.discount.toLocaleString('en-IN')}</td><td class="num mono" style="${s.fine>0?'color:var(--redpen);':''}">₹${s.fine.toLocaleString('en-IN')}</td><td class="num mono">₹${s.paid.toLocaleString('en-IN')}</td><td class="num mono" style="${s.outstanding>0?'font-weight:700;':''}">₹${s.outstanding.toLocaleString('en-IN')}</td><td><span class="fee-badge ${badgeCls}">${badgeText}</span></td><td class="no-print"></td><td class="num no-print"></td></tr>`);
      const tds = tr.querySelectorAll('td.no-print');
      const receiptTd = tds[0];
      const actionTd = tds[1];
      // Receipt column — print button(s) for whatever tuition payment(s) have been
      // collected against this month so far, regardless of whether it's fully paid.
      const monthPayments = records.filter(r=>r.kind==='tuitionPayment' && r.forMonth===due.month)
        .sort((a,b)=> a.date<b.date?1:(a.date>b.date?-1:0));
      if(monthPayments.length){
        monthPayments.forEach((pay,idx)=>{
          const printBtn = el(`<button class="ghost" type="button" style="padding:4px 8px;font-size:.75rem;${idx>0?'margin-top:4px;':''}">🖨️ रसीद</button>`);
          printBtn.onclick = ()=> printFeeReceipt(cls, student, pay);
          receiptTd.appendChild(printBtn);
          if(idx < monthPayments.length-1) receiptTd.appendChild(document.createElement('br'));
        });
      } else {
        receiptTd.appendChild(el(`<span style="color:var(--muted);">—</span>`));
      }
      // Action column — collect button while outstanding, else show the date it was paid on.
      if(s.outstanding>0){
        const collectBtn = el(`<button class="ghost" type="button" style="padding:4px 10px;font-size:.78rem;">जमा करें</button>`);
        collectBtn.onclick = ()=>{ st.collectMonth = (st.collectMonth===due.month) ? null : due.month; render(); };
        actionTd.appendChild(collectBtn);
      } else if(monthPayments.length){
        actionTd.appendChild(el(`<span class="mono" style="color:var(--muted);font-size:.8rem;">${formatDateDMY(monthPayments[0].date)}</span>`));
      } else {
        actionTd.appendChild(el(`<span style="color:var(--muted);">—</span>`));
      }
      tbody.appendChild(tr);

      if(st.collectMonth===due.month && s.outstanding>0){
        const crow = el(`<tr class="fee-collect-row"><td colspan="9"></td></tr>`);
        const cell = crow.querySelector('td');
        const form = el(`<div class="fee-collect-form">
          <input type="hidden" id="collectDate" value="${todayStr()}">
          <div class="field" style="flex:0;"><label>राशि (₹)</label><input type="number" min="0" step="1" id="collectAmount" value="${s.outstanding}"></div>
          <div class="field" style="flex:0;"><label>माध्यम</label>
            <select id="collectMode"><option value="नकद">नकद</option><option value="ऑनलाइन">ऑनलाइन</option><option value="UPI">UPI</option><option value="चेक">चेक</option></select>
          </div>
          <div class="field" style="flex:0;"><label>रसीद क्रमांक (स्वतः)</label><input value="${db.feeReceiptSeq||1}" readonly style="background:#F0EEE6;color:var(--muted);"></div>
          <div class="field" style="flex:0;"><button class="primary" id="collectSaveBtn">पक्का जमा करें</button></div>
          <div class="field" style="flex:0;"><button class="ghost" id="collectCancelBtn" type="button">रद्द करें</button></div>
        </div>`);
        cell.appendChild(form);
        form.querySelector('#collectCancelBtn').onclick = ()=>{ st.collectMonth = null; render(); };
        const saveBtn = form.querySelector('#collectSaveBtn');
        saveBtn.onclick = async ()=>{
          const date = form.querySelector('#collectDate').value;
          const amtVal = form.querySelector('#collectAmount').value;
          const amount = parseFloat(amtVal);
          const mode = form.querySelector('#collectMode').value;
          if(!date || !amtVal || isNaN(amount) || amount<=0){ toast('कृपया सही दिनांक व राशि भरें', 'err'); return; }
          saveBtn.disabled = true; saveBtn.textContent = 'सेव हो रहा है…';
          const receiptNo = String(db.feeReceiptSeq||1);
          const rec = {id:'tp'+Date.now()+Math.random().toString(36).slice(2,6), kind:'tuitionPayment', forMonth:due.month, date, amount, mode, receiptNo};
          records.push(rec);
          db.feeReceiptSeq = (parseInt(db.feeReceiptSeq,10)||1) + 1;
          const ok = await saveDB();
          if(!ok){
            // roll back so the screen never claims a payment was recorded when it wasn't
            const idx = records.indexOf(rec);
            if(idx>-1) records.splice(idx,1);
            db.feeReceiptSeq = (parseInt(db.feeReceiptSeq,10)||1) - 1;
            saveBtn.disabled = false; saveBtn.textContent = 'पक्का जमा करें';
            return;
          }
          toast('फीस जमा हो गई ✓');
          st.collectMonth = null;
          render();
        };
        tbody.appendChild(crow);
      }
    });
    tuitionBody.appendChild(ttable);
  }

  // ---- Other (one-off) charges table — admission/exam/transport/etc. fees applied to this
  // student, either singly or as part of a whole-class charge (from "फीस नियम" tab). Same
  // due/paid/collect pattern as the tuition table above, minus the fine/discount concept.
  const otherChargeBody = box.querySelector('#otherChargeBody');
  if(otherCharges.length){
    otherChargeBody.appendChild(el(`<h4 style="margin:0 0 6px;font-family:'Noto Serif Devanagari',serif;color:var(--chalk);font-size:.95rem;">अन्य फीस (प्रवेश, परीक्षा, परिवहन आदि)</h4>`));
    const otable = el(`<table><thead><tr><th>दिनांक</th><th>मद</th><th class="num">राशि</th><th class="num">जमा</th><th class="num">बकाया</th><th>स्थिति</th><th class="no-print">रसीद</th><th class="num no-print">कार्रवाई</th></tr></thead><tbody></tbody></table>`);
    const otbody = otable.querySelector('tbody');
    otherCharges.slice().sort((a,b)=> a.date<b.date?1:(a.date>b.date?-1:0)).forEach(ch=>{
      const s = otherChargeStatus(cls, st.sid, ch);
      const badgeText = s.status==='paid' ? 'भुगतान पूर्ण' : 'देय';
      const tr = el(`<tr><td class="mono">${formatDateDMY(ch.date)}</td><td>${ch.particulars}</td><td class="num mono">₹${Number(ch.amount).toLocaleString('en-IN')}</td><td class="num mono">₹${s.paid.toLocaleString('en-IN')}</td><td class="num mono" style="${s.outstanding>0?'font-weight:700;':''}">₹${s.outstanding.toLocaleString('en-IN')}</td><td><span class="fee-badge ${s.status}">${badgeText}</span></td><td class="no-print"></td><td class="num no-print"></td></tr>`);
      const tds = tr.querySelectorAll('td.no-print');
      const receiptTd = tds[0];
      const actionTd = tds[1];
      const chargePayments = records.filter(r=>r.kind==='otherPayment' && r.forChargeId===ch.id)
        .sort((a,b)=> a.date<b.date?1:(a.date>b.date?-1:0));
      if(chargePayments.length){
        chargePayments.forEach((pay,idx)=>{
          const printBtn = el(`<button class="ghost" type="button" style="padding:4px 8px;font-size:.75rem;${idx>0?'margin-top:4px;':''}">🖨️ रसीद</button>`);
          printBtn.onclick = ()=> printFeeReceipt(cls, student, pay);
          receiptTd.appendChild(printBtn);
          if(idx < chargePayments.length-1) receiptTd.appendChild(document.createElement('br'));
        });
      } else {
        receiptTd.appendChild(el(`<span style="color:var(--muted);">—</span>`));
      }
      if(s.outstanding>0){
        const collectBtn = el(`<button class="ghost" type="button" style="padding:4px 10px;font-size:.78rem;">जमा करें</button>`);
        collectBtn.onclick = ()=>{ st.collectOther = (st.collectOther===ch.id) ? null : ch.id; render(); };
        actionTd.appendChild(collectBtn);
      } else if(chargePayments.length){
        actionTd.appendChild(el(`<span class="mono" style="color:var(--muted);font-size:.8rem;">${formatDateDMY(chargePayments[0].date)}</span>`));
      } else {
        actionTd.appendChild(el(`<span style="color:var(--muted);">—</span>`));
      }
      otbody.appendChild(tr);

      if(st.collectOther===ch.id && s.outstanding>0){
        const crow = el(`<tr class="fee-collect-row"><td colspan="8"></td></tr>`);
        const cell = crow.querySelector('td');
        const form = el(`<div class="fee-collect-form">
          <input type="hidden" id="ocDate" value="${todayStr()}">
          <div class="field" style="flex:0;"><label>राशि (₹)</label><input type="number" min="0" step="1" id="ocAmount" value="${s.outstanding}"></div>
          <div class="field" style="flex:0;"><label>माध्यम</label>
            <select id="ocMode"><option value="नकद">नकद</option><option value="ऑनलाइन">ऑनलाइन</option><option value="UPI">UPI</option><option value="चेक">चेक</option></select>
          </div>
          <div class="field" style="flex:0;"><label>रसीद क्रमांक (स्वतः)</label><input value="${db.feeReceiptSeq||1}" readonly style="background:#F0EEE6;color:var(--muted);"></div>
          <div class="field" style="flex:0;"><button class="primary" id="ocSaveBtn">पक्का जमा करें</button></div>
          <div class="field" style="flex:0;"><button class="ghost" id="ocCancelBtn" type="button">रद्द करें</button></div>
        </div>`);
        cell.appendChild(form);
        form.querySelector('#ocCancelBtn').onclick = ()=>{ st.collectOther = null; render(); };
        const saveBtn = form.querySelector('#ocSaveBtn');
        saveBtn.onclick = async ()=>{
          const date = form.querySelector('#ocDate').value;
          const amtVal = form.querySelector('#ocAmount').value;
          const amount = parseFloat(amtVal);
          const mode = form.querySelector('#ocMode').value;
          if(!date || !amtVal || isNaN(amount) || amount<=0){ toast('कृपया सही दिनांक व राशि भरें', 'err'); return; }
          saveBtn.disabled = true; saveBtn.textContent = 'सेव हो रहा है…';
          const receiptNo = String(db.feeReceiptSeq||1);
          const rec = {id:'op'+Date.now()+Math.random().toString(36).slice(2,6), kind:'otherPayment', forChargeId:ch.id, date, amount, mode, receiptNo};
          records.push(rec);
          db.feeReceiptSeq = (parseInt(db.feeReceiptSeq,10)||1) + 1;
          const ok = await saveDB();
          if(!ok){
            const idx = records.indexOf(rec);
            if(idx>-1) records.splice(idx,1);
            db.feeReceiptSeq = (parseInt(db.feeReceiptSeq,10)||1) - 1;
            saveBtn.disabled = false; saveBtn.textContent = 'पक्का जमा करें';
            return;
          }
          toast('फीस जमा हो गई ✓');
          st.collectOther = null;
          render();
        };
        otbody.appendChild(crow);
      }
    });
    otherChargeBody.appendChild(otable);
  }

  return box;
}

function renderTeachers(){
  const wrap = el(`<div class="page"><div class="punch"></div>
    <h2 class="section-title">अध्यापक बनाएं</h2>
    <p class="section-sub">हर अध्यापक को एक username व password दें</p>
    <div class="row">
      <div class="field"><label>पूरा नाम</label><input id="tName"></div>
      <div class="field"><label>Username</label><input id="tUser"></div>
      <div class="field"><label>Password</label><input id="tPass"></div>
      <div class="field" style="flex:0;"><button class="primary" id="addTeacherBtn">जोड़ें</button></div>
    </div>
    <table><thead><tr><th>नाम</th><th>Username</th><th>Password</th><th>Assignments</th><th></th></tr></thead>
    <tbody id="teacherRows"></tbody></table></div>`);
  wrap.querySelector('#addTeacherBtn').onclick = async ()=>{
    const name = wrap.querySelector('#tName').value.trim();
    const user = wrap.querySelector('#tUser').value.trim();
    const pass = wrap.querySelector('#tPass').value.trim();
    if(!name||!user||!pass) return;
    if(db.teachers[user]){ alert('यह username पहले से मौजूद है'); return; }
    if(teacherIndex[user] && teacherIndex[user]!==currentSchoolId){ alert('यह username किसी और स्कूल में पहले से उपयोग हो रहा है, कृपया दूसरा username चुनें'); return; }
    db.teachers[user] = {name, password:pass};
    db.assignments[user] = db.assignments[user] || [];
    await saveDB();
    teacherIndex[user] = currentSchoolId;
    await saveTeacherIndex();
    render();
  };
  const rows = wrap.querySelector('#teacherRows');
  const usernames = Object.keys(db.teachers);
  if(usernames.length===0) rows.appendChild(el(`<tr><td colspan="5" style="text-align:center;color:var(--muted);">कोई अध्यापक नहीं जोड़ा गया</td></tr>`));
  usernames.forEach(u=>{
    const t = db.teachers[u];
    const assigns = (db.assignments[u]||[]);
    const tr = el(`<tr><td>${t.name}</td><td class="mono">${u}</td><td class="mono">${t.password}</td>
      <td>${assigns.length ? assigns.map(a=>`${a.cls}/${a.subject}`).join(', ') : '<span style="color:var(--muted);">कोई नहीं</span>'}</td>
      <td style="white-space:nowrap;"><button class="ghost" data-edit-t="${u}">एडिट करें</button> <button class="danger" data-del-t="${u}">हटाएं</button></td></tr>`);
    const editTr = el(`<tr class="teacherEditRow" style="display:none;background:var(--paper2,#fafafa);"><td colspan="5">
      <div class="row">
        <div class="field"><label>पूरा नाम</label><input class="etName" value="${t.name.replace(/"/g,'&quot;')}"></div>
        <div class="field"><label>Username</label><input class="etUser" value="${u.replace(/"/g,'&quot;')}"></div>
        <div class="field"><label>Password</label><input class="etPass" value="${t.password.replace(/"/g,'&quot;')}"></div>
      </div>
      <button class="primary etSave">सेव करें</button> <button class="ghost etCancel">रद्द करें</button>
      <div class="etErr" style="color:var(--redpen);font-size:.82rem;margin-top:4px;"></div>
    </td></tr>`);
    tr.querySelector('[data-edit-t]').onclick = ()=>{
      editTr.style.display = editTr.style.display==='none' ? 'table-row' : 'none';
    };
    editTr.querySelector('.etCancel').onclick = ()=>{ editTr.style.display='none'; };
    editTr.querySelector('.etSave').onclick = async ()=>{
      const newName = editTr.querySelector('.etName').value.trim();
      const newUser = editTr.querySelector('.etUser').value.trim();
      const newPass = editTr.querySelector('.etPass').value.trim();
      const errBox = editTr.querySelector('.etErr');
      errBox.textContent = '';
      if(!newName||!newUser||!newPass){ errBox.textContent = 'कृपया सभी फ़ील्ड भरें'; return; }
      if(newUser!==u){
        if(db.teachers[newUser]){ errBox.textContent = 'यह username पहले से मौजूद है'; return; }
        if(teacherIndex[newUser] && teacherIndex[newUser]!==currentSchoolId){ errBox.textContent = 'यह username किसी और स्कूल में पहले से उपयोग हो रहा है'; return; }
      }
      const assignData = db.assignments[u] || [];
      delete db.teachers[u]; delete db.assignments[u];
      db.teachers[newUser] = {name:newName, password:newPass};
      db.assignments[newUser] = assignData;
      await saveDB();
      if(newUser!==u){ delete teacherIndex[u]; teacherIndex[newUser] = currentSchoolId; await saveTeacherIndex(); }
      render();
    };
    tr.querySelector('[data-del-t]').onclick = async ()=>{
      if(!confirm(`अध्यापक "${t.name}" को हटाना है?`)) return;
      delete db.teachers[u]; delete db.assignments[u];
      await saveDB();
      delete teacherIndex[u];
      await saveTeacherIndex();
      render();
    };
    rows.appendChild(tr);
    rows.appendChild(editTr);
  });
  return wrap;
}

function renderAssign(){
  const wrap = el(`<div class="page"><div class="punch"></div>
    <h2 class="section-title">कक्षा + विषय अध्यापक को असाइन करें</h2>
    <p class="section-sub">विषय का प्रकार चुनें — सामान्य, Theory+Practical वाला (जैसे विज्ञान), या दो प्रश्नपत्र वाला (जैसे हिंदी I/II)</p>
    <div class="row">
      <div class="field"><label>अध्यापक</label><select id="asgTeacher"></select></div>
      <div class="field"><label>कक्षा</label><select id="asgClass"></select></div>
      <div class="field"><label>विषय का नाम</label><input id="asgSubject" placeholder="जैसे: विज्ञान"></div>
    </div>
    <div class="row">
      <div class="field"><label>विषय का प्रकार</label>
        <select id="asgType">
          <option value="single">सामान्य (एक पेपर)</option>
          <option value="practical">Theory + Practical</option>
          <option value="dual">दो प्रश्नपत्र (Paper I / Paper II)</option>
        </select>
      </div>
    </div>
    <div class="row" id="typeFields"></div>
    <button class="primary" id="asgBtn">असाइन करें</button>
    <table style="margin-top:22px;"><thead><tr><th>अध्यापक</th><th>कक्षा</th><th>विषय</th><th>घटक (Components)</th><th></th></tr></thead>
    <tbody id="asgRows"></tbody></table></div>`);

  const teacherSel = wrap.querySelector('#asgTeacher');
  const classSel = wrap.querySelector('#asgClass');
  Object.keys(db.teachers).forEach(u=> teacherSel.appendChild(el(`<option value="${u}">${db.teachers[u].name} (${u})</option>`)));
  Object.keys(db.classes).forEach(c=> classSel.appendChild(el(`<option value="${c}">${c}</option>`)));
  if(Object.keys(db.teachers).length===0 || Object.keys(db.classes).length===0){
    wrap.insertBefore(el(`<div class="note">पहले "अध्यापक" व "कक्षा व छात्र" टैब में डेटा जोड़ें</div>`), wrap.querySelector('.row'));
  }

  const typeSel = wrap.querySelector('#asgType');
  const typeFields = wrap.querySelector('#typeFields');
  // तिमाही, अर्धवार्षिक, वार्षिक (या जो भी परीक्षाएं जोड़ी गई हों) — हर परीक्षा का पूर्णांक अलग-अलग भरा जा सकता है
  const DEFAULT_MAX = {single:[100], practical:[80,20], dual:[50,50]};
  function compGroupsFor(type){
    if(type==='single') return [{key:'m', label:'अधिकतम अंक', dflt:DEFAULT_MAX.single[0]}];
    if(type==='practical') return [
      {key:'th', label:'सिद्धांत (Theory) अधिकतम अंक', dflt:DEFAULT_MAX.practical[0]},
      {key:'pr', label:'प्रयोगात्मक (Practical) अधिकतम अंक', dflt:DEFAULT_MAX.practical[1]}
    ];
    return [
      {key:'p1', label:'प्रथम प्रश्नपत्र (Paper I) अधिकतम अंक', dflt:DEFAULT_MAX.dual[0]},
      {key:'p2', label:'द्वितीय प्रश्नपत्र (Paper II) अधिकतम अंक', dflt:DEFAULT_MAX.dual[1]}
    ];
  }
  function drawTypeFields(){
    const groups = compGroupsFor(typeSel.value);
    typeFields.innerHTML = groups.map(g=>`
      <div class="field-group" style="border:1px solid var(--line,#ccc);border-radius:8px;padding:10px 12px;margin-bottom:10px;width:100%;">
        <div style="font-weight:600;margin-bottom:8px;">${g.label} — परीक्षा अनुसार</div>
        <div class="row">
          ${db.exams.map(ex=>`<div class="field"><label>${ex}</label><input type="number" data-maxgroup="${g.key}" data-exam="${ex}" value="${g.dflt}"></div>`).join('')}
        </div>
      </div>`).join('');
  }
  typeSel.onchange = drawTypeFields;
  drawTypeFields();

  function collectMaxByExam(key){
    const obj = {};
    typeFields.querySelectorAll(`[data-maxgroup="${key}"]`).forEach(inp=>{
      obj[inp.dataset.exam] = parseFloat(inp.value)||0;
    });
    return obj;
  }
  let editing = null; // {u, idx} when editing an existing assignment, else null (add mode)
  const asgBtn = wrap.querySelector('#asgBtn');
  const cancelEditBtn = el(`<button class="ghost" id="asgCancelBtn" style="display:none;margin-left:8px;">रद्द करें</button>`);
  asgBtn.insertAdjacentElement('afterend', cancelEditBtn);
  function exitEditMode(){
    editing = null;
    asgBtn.textContent = 'असाइन करें';
    cancelEditBtn.style.display = 'none';
  }
  cancelEditBtn.onclick = ()=>{
    exitEditMode();
    wrap.querySelector('#asgSubject').value = '';
    typeSel.value = 'single';
    drawTypeFields();
  };
  asgBtn.onclick = async ()=>{
    const t = teacherSel.value, c = classSel.value;
    const subject = wrap.querySelector('#asgSubject').value.trim();
    if(!t||!c||!subject) return;
    const type = typeSel.value;
    let components = [];
    if(type==='single'){
      components = [{name:MAIN_KEY, maxByExam: collectMaxByExam('m')}];
    } else if(type==='practical'){
      components = [{name:'सिद्धांत (Theory)', maxByExam: collectMaxByExam('th')}, {name:'प्रयोगात्मक (Practical)', maxByExam: collectMaxByExam('pr')}];
    } else {
      components = [{name:'प्रथम प्रश्नपत्र (Paper I)', maxByExam: collectMaxByExam('p1')}, {name:'द्वितीय प्रश्नपत्र (Paper II)', maxByExam: collectMaxByExam('p2')}];
    }
    if(editing){
      const {u: oldU, idx: oldIdx} = editing;
      const dupExists = (u,i)=> (db.assignments[u]||[]).some((a,ai)=> a.cls===c && a.subject===subject && !(u===oldU && ai===oldIdx));
      if(dupExists(t)){ alert('यह विषय इस कक्षा के लिए पहले से असाइन है'); return; }
      db.assignments[oldU].splice(oldIdx,1);
      db.assignments[t] = db.assignments[t] || [];
      db.assignments[t].push({cls:c, subject, components});
      exitEditMode();
      await saveDB(); render();
      return;
    }
    db.assignments[t] = db.assignments[t] || [];
    if(db.assignments[t].some(a=>a.cls===c && a.subject===subject)){ alert('यह विषय इस कक्षा के लिए पहले से असाइन है'); return; }
    db.assignments[t].push({cls:c, subject, components});
    await saveDB(); render();
  };

  const rows = wrap.querySelector('#asgRows');
  let any=false;
  // find which teacher/index owns a given class+subject assignment (needed since
  // rows are now grouped/ordered by class+subjectOrder, not by teacher)
  function findOwner(cls, subject){
    for(const u of Object.keys(db.assignments)){
      const idx = (db.assignments[u]||[]).findIndex(x=>x.cls===cls && x.subject===subject);
      if(idx!==-1) return {u, idx};
    }
    return null;
  }
  const clsOrder = Object.keys(db.classes).slice();
  Object.values(db.assignments).flat().forEach(a=>{ if(!clsOrder.includes(a.cls)) clsOrder.push(a.cls); });
  clsOrder.forEach(cls=>{
    const subs = subjectsForClass(cls);
    if(!subs.length) return;
    any = true;
    rows.appendChild(el(`<tr><td colspan="5" style="background:var(--paper-2);font-weight:700;padding-top:14px;">${cls} — विषयों का क्रम (तीर से ऊपर/नीचे करें)</td></tr>`));
    subs.forEach((a, posIdx)=>{
      const owner = findOwner(cls, a.subject);
      if(!owner) return;
      const {u, idx} = owner;
      const compDesc = a.components.map(c=>{
        const label = c.name===MAIN_KEY ? 'कुल' : c.name;
        const byExam = db.exams.map(ex=> `${ex}: ${compMax(c, ex)}`).join(', ');
        return `${label} [${byExam}]`;
      }).join(' + ');
      const isFirst = posIdx===0, isLast = posIdx===subs.length-1;
      const tr = el(`<tr><td>${db.teachers[u]?db.teachers[u].name:u}</td><td>${a.cls}</td><td>${a.subject}</td>
        <td class="mono" style="font-size:.78rem;">${compDesc}</td>
        <td style="white-space:nowrap;">
          <button class="ghost" data-updn="up" ${isFirst?'disabled':''} title="ऊपर ले जाएं" style="padding:4px 8px;">↑</button>
          <button class="ghost" data-updn="down" ${isLast?'disabled':''} title="नीचे ले जाएं" style="padding:4px 8px;">↓</button>
          <button class="ghost" data-edit="${u}::${idx}">एडिट करें</button> <button class="danger" data-rm="${u}::${idx}">हटाएं</button></td></tr>`);
      tr.querySelector('[data-updn="up"]').onclick = ()=> moveSubjectOrder(cls, a.subject, -1);
      tr.querySelector('[data-updn="down"]').onclick = ()=> moveSubjectOrder(cls, a.subject, 1);
      tr.querySelector('[data-edit]').onclick = ()=>{
        editing = {u, idx};
        asgBtn.textContent = 'अपडेट करें';
        cancelEditBtn.style.display = 'inline-block';
        teacherSel.value = u;
        classSel.value = a.cls;
        wrap.querySelector('#asgSubject').value = a.subject;
        const type = a.components.length===1 ? 'single' : (a.components[0].name==='सिद्धांत (Theory)' ? 'practical' : 'dual');
        typeSel.value = type;
        drawTypeFields();
        const keyMap = type==='single' ? ['m'] : (type==='practical' ? ['th','pr'] : ['p1','p2']);
        a.components.forEach((c,ci)=>{
          const key = keyMap[ci];
          db.exams.forEach(ex=>{
            const inp = typeFields.querySelector(`[data-maxgroup="${key}"][data-exam="${ex}"]`);
            if(inp) inp.value = compMax(c, ex);
          });
        });
        wrap.querySelector('.page') && wrap.scrollIntoView({behavior:'smooth', block:'start'});
      };
      tr.querySelector('[data-rm]').onclick = async ()=>{
        db.assignments[u].splice(idx,1);
        await saveDB(); render();
      };
      rows.appendChild(tr);
    });
  });
  if(!any) rows.appendChild(el(`<tr><td colspan="5" style="text-align:center;color:var(--muted);">कोई असाइनमेंट नहीं</td></tr>`));
  return wrap;
}

// ---- shared helper: subjects list for a class (from assignments) ----
// Order shown here (and used everywhere subjects are listed/printed — report
// cards, admit cards, exam schedule, etc.) follows db.subjectOrder[cls] if set
// (see moveSubjectOrder below); any subject not yet present in that list is
// appended at the end, in the order it was first discovered.
function subjectsForClass(cls){
  const subs = [];
  Object.values(db.assignments).flat().forEach(a=>{
    if(a.cls===cls && !subs.some(s=>s.subject===a.subject)) subs.push(a);
  });
  const order = (db.subjectOrder && db.subjectOrder[cls]) || [];
  if(order.length){
    subs.sort((a,b)=>{
      let ia = order.indexOf(a.subject); if(ia===-1) ia = order.length;
      let ib = order.indexOf(b.subject); if(ib===-1) ib = order.length;
      return ia - ib;
    });
  }
  return subs;
}
// Move a subject one position up (dir=-1) or down (dir=+1) within a class's
// subject order, persisting the new order to db.subjectOrder[cls].
async function moveSubjectOrder(cls, subject, dir){
  const subs = subjectsForClass(cls);
  const names = subs.map(s=>s.subject);
  const i = names.indexOf(subject);
  const j = i + dir;
  if(i===-1 || j<0 || j>=names.length) return;
  [names[i], names[j]] = [names[j], names[i]];
  db.subjectOrder = db.subjectOrder || {};
  db.subjectOrder[cls] = names;
  await saveDB();
  render();
}
// A student can be limited to a subset of the class's subjects (e.g. optional/elective
// subjects that not every student in the class takes). s.subjects, if set, is an array of
// subject names to include. If unset/empty, the student gets every subject of the class
// (same behaviour as before this feature existed).
function subjectsForStudent(cls, s){
  const all = subjectsForClass(cls);
  if(!s.subjects || !s.subjects.length) return all;
  return all.filter(a=> s.subjects.includes(a.subject));
}
function componentValue(exam, cls, subject, compName, studentId){
  return (((((db.marks[exam]||{})[cls]||{})[subject]||{})[compName]||{})[studentId]);
}
// A component's max marks can now differ per exam (तिमाही vs अर्धवार्षिक vs वार्षिक आदि).
// New data stores it as c.maxByExam = {examName: value}. Older saved data has a single
// c.max number that applied to every exam — keep that working as a fallback.
function compMax(c, exam){
  if(c.maxByExam){
    if(Object.prototype.hasOwnProperty.call(c.maxByExam, exam)) return c.maxByExam[exam]||0;
    const vals = Object.values(c.maxByExam);
    return vals.length ? (vals[0]||0) : 0; // exam added later than this assignment — best-effort fallback
  }
  return c.max||0;
}
function subjectResult(exam, cls, subject, components, studentId){
  let obtained=0, max=0, any=false;
  components.forEach(c=>{
    const v = componentValue(exam, cls, subject, c.name, studentId);
    if(v!==undefined && v!==null && v!==''){ obtained+=parseFloat(v); max+=compMax(c, exam); any=true; }
  });
  return {obtained, max, any};
}

function fitGrandTotalBoxes(host){
  const REF_WIDTH = 260; // width of a squeezed (side-by-side) box — base font-sizes look right here
  host.querySelectorAll('.grand-total-box').forEach(box=>{
    const label = box.querySelector('.gt-label');
    const summary = box.querySelector('.summary');
    if(!label || !summary) return;
    const width = box.clientWidth;
    let scale = width / REF_WIDTH;
    scale = Math.max(0.75, Math.min(2.3, scale));
    label.style.fontSize = (0.38*scale).toFixed(2) + 'rem';
    summary.style.fontSize = (0.36*scale).toFixed(2) + 'rem';
    summary.querySelectorAll('b').forEach(b=> b.style.fontSize = (0.44*scale).toFixed(2)+'rem');
    box.style.padding = (2*scale).toFixed(1)+'px ' + (4*scale).toFixed(1)+'px';
  });
}
function fitSchoolNames(host){
  host.querySelectorAll('.rc-school-name').forEach(nameEl=>{
    nameEl.style.fontSize = '';
    const container = nameEl.parentElement;
    let fontSize = parseFloat(getComputedStyle(nameEl).fontSize);
    const minFontSize = fontSize * 0.4;
    let guard = 0;
    while(nameEl.scrollWidth > container.clientWidth && fontSize > minFontSize && guard < 40){
      fontSize -= 1;
      nameEl.style.fontSize = fontSize + 'px';
      guard++;
    }
  });
}
function fitReportCardsToPage(host){
  // Shrinks each report card's content so it always fits on a single A4 page,
  // no matter how many exams/subjects it contains, or how long the language's
  // text is (e.g. English exam/subject names are longer than Hindi) —
  // never spills to a 2nd sheet and never gets clipped sideways.
  requestAnimationFrame(()=>{
    fitSchoolNames(host);
    fitGrandTotalBoxes(host);
    host.querySelectorAll('.report-card').forEach(card=>{
      const inner = card.querySelector('.rc-inner');
      if(!inner) return;
      inner.style.transform = 'scale(1)';
      const availH = card.clientHeight;
      const availW = card.clientWidth;
      const neededH = inner.scrollHeight;
      const neededW = inner.scrollWidth;
      const scaleH = neededH > availH && neededH > 0 ? (availH / neededH) : 1;
      const scaleW = neededW > availW && neededW > 0 ? (availW / neededW) : 1;
      const scale = Math.min(scaleH, scaleW) * 0.99;
      if(scale < 1){
        inner.style.transform = `scale(${Math.max(0.4, scale)})`;
      }
    });
  });
}

function examLabel(name, lang){
  if(lang !== 'en') return name;
  const raw = String(name).trim();
  // exact match first (covers the original, un-numbered exam names)
  if(EXAM_NAME_EN[raw]) return EXAM_NAME_EN[raw];
  // handle numbered variants like "तिमाही परीक्षा2", "तिमाही परीक्षा 3", "तिमाही परीक्षा4"
  const m = raw.match(/^(.*?)\s*([0-9]+)$/);
  if(m){
    const base = m[1].trim();
    const num = m[2];
    if(EXAM_NAME_EN[base]) return `${EXAM_NAME_EN[base]} ${num}`;
  }
  return name;
}

function ttNewPeriod(afterIdx){
  const periods = db.timetablePeriods;
  let start = '08:00';
  if(periods.length>0){
    const ref = afterIdx!=null ? periods[afterIdx] : periods[periods.length-1];
    start = ref.end || '08:00';
  }
  const [h,m] = start.split(':').map(Number);
  const endDate = new Date(2000,0,1,h,m+45);
  const end = String(endDate.getHours()).padStart(2,'0')+':'+String(endDate.getMinutes()).padStart(2,'0');
  return {id:'p'+Date.now()+Math.random().toString(36).slice(2,6), label:'घंटा '+(periods.length+1), start, end, isBreak:false};
}
function renderTimetable(){
  let ttLang = 'hi';
  const wrap = el(`<div class="page tt-landscape-print"><div class="punch"></div>
    <h2 class="section-title no-print">टाइम टेबल</h2>
    <p class="section-sub no-print">पहले पीरियड व समय तय करें, फिर हर कक्षा के लिए साप्ताहिक टाइम टेबल बनाएं</p>
    <div class="row no-print">
      <div class="field" style="flex:0;min-width:200px;"><label>भाषा · Language</label><select id="ttLang">
        <option value="hi">हिंदी (Hindi)</option>
        <option value="en">English</option>
      </select></div>
    </div>
    <div class="tt-print-title tt-periods-print-title"><h2>${(db.school&&db.school.name)||''}</h2><div class="tt-periods-print-sub" id="ttPeriodsPrintSub">पीरियड व समय</div></div>
    <div id="ttPeriodsBox" style="margin-bottom:26px;"></div>
    <div id="ttGridBox" style="margin-top:26px;"></div>
    </div>`);
  const ttLangSel = wrap.querySelector('#ttLang');
  const ttPeriodsPrintSub = wrap.querySelector('#ttPeriodsPrintSub');
  ttLangSel.onchange = ()=>{
    ttLang = ttLangSel.value;
    ttPeriodsPrintSub.textContent = TT_LABELS[ttLang].periodsTitle;
    renderPeriods(); renderGrid();
  };

  // ---- Periods editor ----
  const pbox = wrap.querySelector('#ttPeriodsBox');
  function renderPeriods(){
    const TL = TT_LABELS[ttLang];
    pbox.innerHTML = '';
    pbox.appendChild(el(`<h3 class="no-print" style="font-size:1rem;color:var(--chalk);margin:0 0 6px;font-family:'Noto Serif Devanagari',serif;">${TL.periodsTitle}</h3>`));
    if(db.timetablePeriods.length===0){
      pbox.appendChild(el(`<div class="note">अभी कोई पीरियड सेट नहीं है। नीचे बटन से शुरू करें।</div>`));
      const quick = el(`<button class="ghost no-print">⚡ डिफ़ॉल्ट टाइम टेबल बनाएं (8 पीरियड, 45 मिनट प्रत्येक + एक अवकाश)</button>`);
      quick.onclick = ()=>{
        const list = [];
        let cur = {h:8,m:0};
        function fmt(t){ return String(t.h).padStart(2,'0')+':'+String(t.m).padStart(2,'0'); }
        function add(mins){ let total = cur.h*60+cur.m+mins; cur = {h:Math.floor(total/60)%24, m: total%60}; }
        for(let i=1;i<=8;i++){
          const start = fmt(cur); add(45); const end = fmt(cur);
          list.push({id:'p'+Date.now()+i, label:(ttLang==='en'?'Period ':'घंटा ')+i, start, end, isBreak:false});
          if(i===4){ const bs = fmt(cur); add(20); const be = fmt(cur); list.push({id:'p'+Date.now()+'b', label:(ttLang==='en'?'Break':'अवकाश'), start:bs, end:be, isBreak:true}); }
        }
        db.timetablePeriods = list;
        renderPeriods(); renderGrid();
      };
      pbox.appendChild(quick);
    }
    const table = el(`<table class="tt-periods-table"><thead><tr>
      <th style="width:34px;">${TL.col_no}</th><th>${TL.col_name}</th><th>${TL.col_start}</th><th>${TL.col_end}</th><th style="width:70px;">${TL.col_break}</th><th class="no-print" style="width:40px;"></th>
    </tr></thead><tbody></tbody></table>`);
    const tbody = table.querySelector('tbody');
    db.timetablePeriods.forEach((p, idx)=>{
      const tr = el(`<tr class="${p.isBreak?'tt-break-row':''}">
        <td>${idx+1}</td>
        <td><input type="text" value="${p.label.replace(/"/g,'&quot;')}"></td>
        <td class="tt-time"><input type="time" value="${p.start||''}"></td>
        <td class="tt-time"><input type="time" value="${p.end||''}"></td>
        <td style="text-align:center;"><input type="checkbox" ${p.isBreak?'checked':''}></td>
        <td class="no-print"><button class="danger">✕</button></td>
      </tr>`);
      const [nameInp, startInp, endInp, breakInp] = [tr.querySelectorAll('input')[0], tr.querySelectorAll('input')[1], tr.querySelectorAll('input')[2], tr.querySelectorAll('input')[3]];
      nameInp.oninput = ()=>{ p.label = nameInp.value; };
      startInp.oninput = ()=>{ p.start = startInp.value; };
      endInp.oninput = ()=>{ p.end = endInp.value; };
      breakInp.onchange = ()=>{ p.isBreak = breakInp.checked; tr.classList.toggle('tt-break-row', p.isBreak); };
      tr.querySelector('.danger').onclick = ()=>{
        if(!confirm('यह पीरियड हटाएं? इससे जुड़े सभी कक्षाओं के टाइम टेबल सेल भी खाली हो जाएंगे।')) return;
        db.timetablePeriods.splice(idx,1);
        Object.keys(db.timetable).forEach(cls=>{
          TT_DAYS.forEach(d=>{ if(db.timetable[cls][d]) delete db.timetable[cls][d][p.id]; });
        });
        renderPeriods(); renderGrid();
      };
      tbody.appendChild(tr);
    });
    pbox.appendChild(table);
    const btnRow = el(`<div class="tt-toolbar no-print"></div>`);
    const addBtn = el(`<button class="ghost">+ पीरियड जोड़ें</button>`);
    addBtn.onclick = ()=>{ db.timetablePeriods.push(ttNewPeriod()); renderPeriods(); renderGrid(); };
    const saveBtn = el(`<button class="primary">पीरियड सेव करें</button>`);
    const savedMsg = el(`<span class="mono" style="color:var(--chalk);font-size:.82rem;"></span>`);
    saveBtn.onclick = async ()=>{ await saveDB(); savedMsg.textContent = 'सेव हो गया ✓'; setTimeout(()=>savedMsg.textContent='',2000); };
    const periodsPrintBtn = el(`<button class="ghost">🖨️ प्रिंट करें</button>`);
    periodsPrintBtn.onclick = ()=>{
      setPrintOrientation(false);
      document.body.classList.add('tt-print-periods-only');
      window.print();
    };
    btnRow.appendChild(addBtn); btnRow.appendChild(saveBtn); btnRow.appendChild(periodsPrintBtn); btnRow.appendChild(savedMsg);
    pbox.appendChild(btnRow);
  }

  // ---- Check if a subject is already used elsewhere the same day for this class ----
  function findSubjectUsedInDay(cls, day, subject, excludePeriodId){
    const dayObj = (((db.timetable||{})[cls]||{})[day])||{};
    for(const pid of Object.keys(dayObj)){
      if(pid===excludePeriodId) continue;
      if(dayObj[pid] && dayObj[pid].subject===subject) return true;
    }
    return false;
  }

  // ---- Check if a teacher is already teaching another class at the same day+period ----
  function findTeacherConflict(teacherUser, day, periodId, excludeClass){
    const allClasses = Object.keys(db.timetable||{});
    for(const cls of allClasses){
      if(cls===excludeClass) continue;
      const cell = (((db.timetable[cls]||{})[day])||{})[periodId];
      if(cell && cell.teacher && cell.teacher===teacherUser) return cls;
    }
    return null;
  }

  // ---- Class weekly grid ----
  const gbox = wrap.querySelector('#ttGridBox');
  let selectedClass = Object.keys(db.classes)[0] || null;
  function renderGrid(){
    const TL = TT_LABELS[ttLang];
    gbox.innerHTML = '';
    const classNames = Object.keys(db.classes);
    if(classNames.length===0){
      gbox.appendChild(el(`<div class="empty">पहले "कक्षा व छात्र" में कक्षा जोड़ें, फिर यहां टाइम टेबल बनाएं।</div>`));
      return;
    }
    if(!selectedClass || !classNames.includes(selectedClass)) selectedClass = classNames[0];
    gbox.appendChild(el(`<h3 class="no-print" style="font-size:1rem;color:var(--chalk);margin:0 0 10px;font-family:'Noto Serif Devanagari',serif;">${TL.weeklyTitle}</h3>`));
    const toolbar = el(`<div class="tt-toolbar no-print"></div>`);
    const sel = el(`<select style="max-width:180px;"></select>`);
    classNames.forEach(c=> sel.appendChild(el(`<option value="${c}" ${c===selectedClass?'selected':''}>${TL.classWord} ${c}</option>`)));
    sel.onchange = ()=>{ selectedClass = sel.value; renderGrid(); };
    const printBtn = el(`<button class="ghost">🖨️ प्रिंट करें</button>`);
    printBtn.onclick = ()=>{
      setPrintOrientation(true);
      document.body.classList.add('tt-print-grid-only');
      window.print();
    };
    const exportBtn = el(`<button class="ghost">⭳ एक्सेल में एक्सपोर्ट करें</button>`);
    toolbar.appendChild(sel); toolbar.appendChild(printBtn); toolbar.appendChild(exportBtn);
    gbox.appendChild(toolbar);

    if(db.timetablePeriods.length===0){
      gbox.appendChild(el(`<div class="empty">पहले ऊपर पीरियड/समय जोड़ें।</div>`));
      return;
    }

    const subjMap = classSubjectTeacherMap(selectedClass);
    const subjects = Object.keys(subjMap);
    db.timetable[selectedClass] = db.timetable[selectedClass] || {};
    TT_DAYS.forEach(d=> db.timetable[selectedClass][d] = db.timetable[selectedClass][d] || {});

    const printTitle = el(`<div class="tt-print-title tt-grid-print-title"><h2>${db.school.name||''} — ${TL.classWord} ${selectedClass} ${TL.timetableSuffix}</h2></div>`);

    const table = el(`<table class="tt-grid"><thead><tr>
      <th>${TL.col_period}</th>${TT_DAYS.map(d=>`<th>${ttDayLabel(d, ttLang)}</th>`).join('')}
    </tr></thead><tbody></tbody></table>`);
    const tbody = table.querySelector('tbody');
    db.timetablePeriods.forEach(p=>{
      if(p.isBreak){
        const tr = el(`<tr class="tt-breakrow"><td>${p.label}<br><span class="tt-ptime">${p.start||''} - ${p.end||''}</span></td>${TT_DAYS.map(()=>`<td>${p.label}</td>`).join('')}</tr>`);
        tbody.appendChild(tr);
        return;
      }
      const tr = el(`<tr><td class="tt-periodcell"><div class="tt-pname">${p.label}</div><div class="tt-ptime">${p.start||''} - ${p.end||''}</div></td></tr>`);
      TT_DAYS.forEach(d=>{
        const cellVal = db.timetable[selectedClass][d][p.id] || {};
        const td = el(`<td class="tt-cell"></td>`);
        const availSubjects = subjects.filter(s=> s===cellVal.subject || !findSubjectUsedInDay(selectedClass, d, s, p.id));
        const select = el(`<select><option value="">-- ${ttLang==='en'?'Empty':'खाली'} --</option>${availSubjects.map(s=>`<option value="${s}" ${cellVal.subject===s?'selected':''}>${s}</option>`).join('')}</select>`);
        const teacherLine = el(`<span class="tt-teacher">${cellVal.subject && subjMap[cellVal.subject] ? subjMap[cellVal.subject].teacherName : ''}</span>`);
        select.onchange = ()=>{
          const s = select.value;
          if(!s){ delete db.timetable[selectedClass][d][p.id]; teacherLine.textContent = ''; renderGrid(); return; }
          if(findSubjectUsedInDay(selectedClass, d, s, p.id)){
            alert(`⚠️ "${s}" विषय ${d} को इस कक्षा के किसी और पीरियड में पहले से रखा जा चुका है। एक दिन में एक विषय सिर्फ एक बार आ सकता है।`);
            select.value = cellVal.subject || '';
            return;
          }
          const teacherUser = subjMap[s] ? subjMap[s].teacherUser : '';
          const teacherName = subjMap[s] ? subjMap[s].teacherName : '';
          if(teacherUser){
            const conflictCls = findTeacherConflict(teacherUser, d, p.id, selectedClass);
            if(conflictCls){
              alert(`⚠️ ${teacherName} ${d} को ${p.label} (${p.start||''} - ${p.end||''}) में पहले से कक्षा ${conflictCls} में पढ़ा रहे/रही हैं। यह अध्यापक इस समय फ्री नहीं है।`);
              select.value = cellVal.subject || '';
              return;
            }
          }
          db.timetable[selectedClass][d][p.id] = {subject:s, teacher: teacherUser};
          teacherLine.textContent = teacherName;
          renderGrid();
        };
        td.appendChild(select); td.appendChild(teacherLine);
        tr.appendChild(td);
      });
      tbody.appendChild(tr);
    });
    const gridPage = el(`<div class="tt-grid-page"><div class="tt-grid-inner"></div></div>`);
    const gridInner = gridPage.querySelector('.tt-grid-inner');
    gridInner.appendChild(printTitle);
    gridInner.appendChild(table);
    gbox.appendChild(gridPage);

    exportBtn.onclick = ()=>{
      const rows = [[TL.col_period, TL.col_time, ...TT_DAYS.map(d=>ttDayLabel(d, ttLang))]];
      db.timetablePeriods.forEach(p=>{
        if(p.isBreak){ rows.push([p.label, `${p.start||''}-${p.end||''}`, ...TT_DAYS.map(()=>p.label)]); return; }
        const rowVals = TT_DAYS.map(d=>{
          const cv = db.timetable[selectedClass][d][p.id];
          return cv && cv.subject ? `${cv.subject}${subjMap[cv.subject]?(' ('+subjMap[cv.subject].teacherName+')'):''}` : '';
        });
        rows.push([p.label, `${p.start||''}-${p.end||''}`, ...rowVals]);
      });
      const ws = XLSX.utils.aoa_to_sheet(rows);
      const wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, ws, ttLang==='en'?'Timetable':'टाइम टेबल');
      XLSX.writeFile(wb, `${db.school.name||'school'}-timetable-${selectedClass}.xlsx`);
    };

    const btnRow = el(`<div class="tt-toolbar no-print" style="margin-top:14px;"></div>`);
    const saveBtn = el(`<button class="primary">टाइम टेबल सेव करें</button>`);
    const savedMsg = el(`<span class="mono" style="color:var(--chalk);font-size:.82rem;"></span>`);
    saveBtn.onclick = async ()=>{ await saveDB(); savedMsg.textContent = 'सेव हो गया ✓'; setTimeout(()=>savedMsg.textContent='',2000); };
    btnRow.appendChild(saveBtn); btnRow.appendChild(savedMsg);
    gbox.appendChild(btnRow);
  }

  renderPeriods();
  renderGrid();
  return wrap;
}

// ---------- SEATING PLAN ----------
function ensureSeatingPlan(exam){
  db.seatingPlan[exam] = db.seatingPlan[exam] || {rooms:[], seats:{}, classes:[]};
  const p = db.seatingPlan[exam];
  if(!p.rooms) p.rooms = [];
  if(!p.seats) p.seats = {};
  if(!p.classes) p.classes = [];
  return p;
}
function renderSeatingTab(){
  const wrap = el(`<div class="page"><div class="punch"></div>
    <h2 class="section-title">सीटिंग प्लान (Exam Seating Plan)</h2>
    <p class="section-sub">जिस परीक्षा के लिए सीटिंग प्लान बनाना है उसे चुनें, कक्षाएँ व कक्ष तय करें — यही सीट/कक्ष प्रवेश पत्र पर अपने आप दिखेगा</p>
    <div class="row">
      <div class="field" style="max-width:280px;"><label>परीक्षा चुनें</label><select id="stExam"></select></div>
      <div class="field" style="max-width:220px;"><label>भाषा · Language</label><select id="stLang">
        <option value="hi">हिंदी (Hindi)</option>
        <option value="en">English</option>
      </select></div>
    </div>
    <div id="stSeatingHost"></div>
  </div>`);

  const examSel = wrap.querySelector('#stExam');
  const langSel = wrap.querySelector('#stLang');
  db.exams.forEach(ex=> examSel.appendChild(el(`<option value="${ex}">${ex}</option>`)));

  if(Object.keys(db.classes).length===0){
    wrap.insertBefore(el(`<div class="note">पहले "कक्षा व छात्र" टैब में कक्षा व छात्र जोड़ें</div>`), wrap.querySelector('#stSeatingHost'));
  }

  function drawSeating(){
    const exam = examSel.value;
    const host = wrap.querySelector('#stSeatingHost');
    host.innerHTML = '';
    if(!exam) return;
    const plan = ensureSeatingPlan(exam);
    const allClasses = Object.keys(db.classes).filter(c=> ((db.classes[c].students||[]).length)>0);
    if(plan.classes.length===0 && Object.keys(plan.seats).length===0) plan.classes = allClasses.slice();

    const box = el(`<div class="wm-settings">
      <h4>सीटिंग प्लान — ${exam}</h4>
      <p class="section-sub" style="margin-bottom:10px;">जिन कक्षाओं को इस परीक्षा में मिलाकर बैठाना है उन्हें चुनें, कक्ष/क्षमता जोड़ें, फिर प्लान बनाएं — प्रवेश पत्र पर हर छात्र का कक्ष व सीट नंबर इसी प्लान के अनुसार दिखेगा</p>
      <div class="row" id="seatClassRow" style="gap:14px;"></div>
      <div id="seatRoomsBox" style="margin-top:10px;"></div>
      <div class="tt-toolbar" style="margin-top:12px;">
        <button class="ghost" id="genSeatBtn">🎲 सीटिंग प्लान बनाएं / फिर से बनाएं</button>
        <button class="primary" id="saveSeatBtn">सीटिंग प्लान सेव करें</button>
        <button class="ghost" id="printSeatBtn">🖨️ सीटिंग चार्ट प्रिंट करें</button>
        <span id="seatMsg" class="mono" style="font-size:.82rem;"></span>
      </div>
      <div id="seatResultBox" style="margin-top:14px;"></div>
    </div>`);
    host.appendChild(box);

    const classRow = box.querySelector('#seatClassRow');
    if(allClasses.length===0){
      classRow.appendChild(el(`<div class="empty">कोई कक्षा/छात्र नहीं मिले</div>`));
    }
    allClasses.forEach(c=>{
      const lbl = el(`<label style="display:flex;align-items:center;gap:6px;font-size:.85rem;"><input type="checkbox" ${plan.classes.includes(c)?'checked':''}> कक्षा ${c}</label>`);
      const chk = lbl.querySelector('input');
      chk.onchange = ()=>{
        if(chk.checked){ if(!plan.classes.includes(c)) plan.classes.push(c); }
        else { plan.classes = plan.classes.filter(x=>x!==c); }
      };
      classRow.appendChild(lbl);
    });

    const roomsBox = box.querySelector('#seatRoomsBox');
    function renderRooms(){
      roomsBox.innerHTML='';
      const table = el(`<table class="tt-periods-table"><thead><tr><th>कक्ष का नाम</th><th>क्षमता (सीट)</th><th style="width:40px;"></th></tr></thead><tbody></tbody></table>`);
      const tbody = table.querySelector('tbody');
      plan.rooms.forEach((r,idx)=>{
        const tr = el(`<tr>
          <td><input type="text" value="${(r.name||'').replace(/"/g,'&quot;')}"></td>
          <td class="tt-time"><input type="number" min="1" value="${r.capacity||''}" style="width:90px;"></td>
          <td><button class="danger">✕</button></td>
        </tr>`);
        const [nameI, capI] = tr.querySelectorAll('input');
        nameI.oninput = ()=>{ r.name = nameI.value; };
        capI.oninput = ()=>{ r.capacity = parseInt(capI.value)||0; };
        tr.querySelector('.danger').onclick = ()=>{ plan.rooms.splice(idx,1); renderRooms(); };
        tbody.appendChild(tr);
      });
      roomsBox.appendChild(table);
      const addBtn = el(`<button class="ghost" style="margin-top:6px;">+ कक्ष जोड़ें</button>`);
      addBtn.onclick = ()=>{ plan.rooms.push({id:'r'+Date.now()+Math.random().toString(36).slice(2,5), name:'कक्ष '+(plan.rooms.length+1), capacity:30}); renderRooms(); };
      roomsBox.appendChild(addBtn);
      const totalCap = plan.rooms.reduce((s,r)=>s+(r.capacity||0),0);
      roomsBox.appendChild(el(`<div style="font-size:.78rem;color:var(--muted);margin-top:6px;">कुल क्षमता: ${totalCap} सीटें</div>`));
    }
    renderRooms();

    function renderSeatResult(){
      const resBox = box.querySelector('#seatResultBox');
      resBox.innerHTML = '';
      const seatIds = Object.keys(plan.seats);
      if(seatIds.length===0){
        resBox.appendChild(el(`<div class="empty">अभी सीटिंग प्लान नहीं बना — ऊपर "सीटिंग प्लान बनाएं" दबाएं</div>`));
        return;
      }
      const byRoom = {};
      seatIds.forEach(sid=>{
        const seat = plan.seats[sid];
        const stu = ((db.classes[seat.cls]||{}).students||[]).find(s=>s.id===sid);
        byRoom[seat.room] = byRoom[seat.room] || [];
        byRoom[seat.room].push({...seat, sid, name: stu?stu.name:'?', roll: stu?stu.roll:'?'});
      });
      Object.keys(byRoom).forEach(roomName=>{
        const rows = byRoom[roomName].sort((a,b)=>a.seatNo-b.seatNo);
        resBox.appendChild(el(`<div class="seat-room-block">
          <h5>${roomName} (${rows.length} छात्र)</h5>
          <table><thead><tr><th class="num">सीट</th><th>कक्षा</th><th>रोल</th><th>नाम</th></tr></thead>
          <tbody>${rows.map(r=>`<tr><td class="num mono">${r.seatNo}</td><td>${r.cls}</td><td class="mono">${r.roll}</td><td>${r.name}</td></tr>`).join('')}</tbody></table>
        </div>`));
      });
    }
    renderSeatResult();

    box.querySelector('#genSeatBtn').onclick = ()=>{
      if(plan.classes.length===0){ alert('कृपया कम से कम एक कक्षा चुनें'); return; }
      if(plan.rooms.length===0 || plan.rooms.every(r=>!r.capacity)){ alert('कृपया कम से कम एक कक्ष व उसकी क्षमता जोड़ें'); return; }
      const perClass = plan.classes.map(c=>{
        const arr = ((db.classes[c]||{}).students||[]).slice().sort((a,b)=> String(a.roll||'').localeCompare(String(b.roll||''), undefined, {numeric:true}));
        return {cls:c, list:arr};
      });
      const combined = [];
      let more = true;
      while(more){
        more = false;
        perClass.forEach(pc=>{ if(pc.list.length){ combined.push({stu:pc.list.shift(), cls:pc.cls}); more = true; } });
      }
      const seats = {};
      let ri = 0, seatCounter = 1, room = plan.rooms[0], unassigned = 0;
      combined.forEach(item=>{
        while(room && seatCounter>room.capacity){ ri++; room = plan.rooms[ri]; seatCounter=1; }
        if(!room){ unassigned++; return; }
        seats[item.stu.id] = {roomId: room.id, room: room.name, seatNo: seatCounter, cls: item.cls};
        seatCounter++;
      });
      plan.seats = seats;
      renderSeatResult();
      const msg = box.querySelector('#seatMsg');
      if(unassigned>0){ msg.style.color = 'var(--redpen)'; msg.textContent = `⚠ ${unassigned} छात्रों के लिए सीट नहीं मिली — कक्ष/क्षमता बढ़ाएं`; }
      else { msg.style.color = 'var(--chalk)'; msg.textContent = 'प्लान तैयार — अब सेव करें'; }
    };

    box.querySelector('#saveSeatBtn').onclick = async ()=>{
      await saveDB();
      const msg = box.querySelector('#seatMsg');
      msg.style.color = 'var(--chalk)';
      msg.textContent = 'सेव हो गया ✓';
      setTimeout(()=>{ if(msg) msg.textContent=''; }, 2000);
    };

    box.querySelector('#printSeatBtn').onclick = ()=>{
      if(Object.keys(plan.seats).length===0){ alert('पहले सीटिंग प्लान बनाएं'); return; }
      ui.seatingPrintView = {exam, lang: langSel.value || 'hi'};
      render();
    };
  }

  examSel.onchange = drawSeating;
  setTimeout(drawSeating, 0);
  return wrap;
}

        <div class="field" style="flex:0;"><label>कुल (Total) पंक्ति टेक्स्ट रंग</label><input type="color" id="rtsTotalText" value="${db.reportTableStyle.totalRowTextColor}"></div>
        <div class="field" style="flex:0;"><button class="ghost" id="rtsResetBtn">डिफ़ॉल्ट पर रीसेट करें</button></div>

      <div class="row" style="align-items:center;">
        <div class="field" style="flex:0;flex-direction:row;align-items:center;display:flex;gap:6px;">

          <label style="margin:0;" for="rtsShowBorder">टेबल का बॉर्डर दिखाएं (अनचेक करने पर बॉर्डर पूरी तरह हट जाएगा)</label>
        </div>
        <div class="field" style="flex:0;flex-direction:row;align-items:center;display:flex;gap:6px;">
          <input type="checkbox" id="rtsTransparent" ${db.reportTableStyle.transparentRows?'checked':''} style="width:16px;height:16px;">
          <label style="margin:0;" for="rtsTransparent">टेबल की सभी पंक्तियाँ पारदर्शी (Transparent) करें — बैकग्राउंड इमेज पूरी दिखेगी</label>

<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>स्कूल प्रबंधन प्रणाली · School Management System</title>
<!-- App-like install/behaviour on phones: theme colour, standalone (no browser chrome) when added to home screen -->
<meta name="theme-color" content="#2F5D50">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="अध्यापक पैनल">
<link rel="manifest" href='data:application/manifest+json,{"name":"स्कूल प्रबंधन प्रणाली · School Management System","short_name":"SMS","start_url":".","display":"standalone","background_color":"%23F6F3EC","theme_color":"%232F5D50","orientation":"portrait-primary"}'>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Devanagari:wght@500;700&family=Noto+Sans+Devanagari:wght@400;600&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<style>
  :root{
    --paper:#F6F3EC; --paper-2:#FCFAF4; --ink:#21281F;
    --chalk:#2F5D50; --chalk-light:#3E7566;
    --marigold:#D98F2B; --redpen:#B23A32; --line:#D8D2C2; --muted:#6B6456;
  }
  *{box-sizing:border-box;}
  html{overscroll-behavior-y:contain;}
  body{overscroll-behavior-y:contain;overflow-x:hidden;-webkit-tap-highlight-color:transparent;}
  button,a,.tab-btn,.assign-card,input[type=checkbox],input[type=radio]{-webkit-tap-highlight-color:transparent;touch-action:manipulation;-webkit-touch-callout:none;}
  input,select,textarea{-webkit-tap-highlight-color:transparent;}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:'Noto Sans Devanagari','Inter',sans-serif;-webkit-font-smoothing:antialiased;}
  h1,h2,h3,.display{font-family:'Noto Serif Devanagari',serif;letter-spacing:.2px;}
  .mono{font-family:'IBM Plex Mono',monospace;}
  .appbar{position:sticky;top:0;z-index:30;}
  /* When a text field is focused (mobile keyboard about to open), drop the header
     out of sticky mode. Some mobile in-app browsers (e.g. WhatsApp's WebView)
     mis-recalculate sticky positioning while the on-screen keyboard is animating
     open, which makes the header visibly jump/slide up. Falling back to normal
     flow while typing avoids that glitch; it re-becomes sticky as soon as the
     field loses focus. */
  body.kb-open .appbar{position:static;}
  /* Login screen: on phones the green header just eats space above the login
     form, so hide it there and let the login box start right at the top.
     Left untouched on wider (tablet/desktop) screens. */
  @media (max-width:640px){
    body.login-screen .appbar{display:none;}
  }
  header.top{background:var(--chalk);color:var(--paper-2);padding:1.35em 1.75em;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;height:auto;min-height:0;}
  header.top h1{margin:0;font-size:clamp(1.05rem,4.5vw,1.5rem);font-weight:700;line-height:1.3;overflow-wrap:break-word;}
  header.top .tagline{font-size:.82rem;opacity:.8;margin-top:2px;}
  header.top .who{font-size:.85rem;text-align:right;}
  header.top button.logout{background:transparent;border:1px solid rgba(255,255,255,.5);color:var(--paper-2);padding:6px 14px;border-radius:4px;cursor:pointer;font-family:inherit;font-size:.8rem;margin-left:10px;}
  header.top button.logout:hover{background:rgba(255,255,255,.12);}
  /* Teacher panel: keep header focused on the school name, not the app title */
  body.role-teacher header.top h1, body.role-teacher header.top .tagline{display:none;}
  body.role-teacher header.top{justify-content:flex-start;}
  body.role-teacher header.top .who{font-size:1rem;}
  nav.tabs{display:flex;gap:2px;background:var(--chalk-light);padding:0 24px;overflow-x:auto;}
  nav.tabs button{background:transparent;border:none;color:rgba(255,255,255,.75);padding:12px 16px;cursor:pointer;font-family:'Noto Sans Devanagari',sans-serif;font-size:.87rem;font-weight:600;border-bottom:3px solid transparent;white-space:nowrap;}
  nav.tabs button.active{color:#fff;border-bottom-color:var(--marigold);}
  nav.tabs button:hover{color:#fff;}
  main{max-width:1040px;margin:26px auto 60px;padding:0 16px;}
  .page{background:var(--paper-2);border:1px solid var(--line);border-radius:6px;position:relative;padding:28px 28px 28px 56px;box-shadow:0 1px 3px rgba(0,0,0,.04);}
  .page::before{content:"";position:absolute;left:34px;top:0;bottom:0;width:2px;background:var(--redpen);opacity:.55;}
  .page .punch{position:absolute;left:14px;top:36px;width:10px;height:10px;border-radius:50%;background:var(--paper);border:1px solid var(--line);box-shadow:0 90px 0 var(--paper),0 90px 0 1px var(--line),0 180px 0 var(--paper),0 180px 0 1px var(--line),0 270px 0 var(--paper),0 270px 0 1px var(--line);}
  h2.section-title{font-size:1.15rem;margin:0 0 4px;color:var(--chalk);}
  p.section-sub{margin:0 0 20px;color:var(--muted);font-size:.85rem;}
  .row{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:14px;align-items:flex-end;}
  .field{display:flex;flex-direction:column;gap:4px;flex:1;min-width:140px;}
  .field label{font-size:.75rem;color:var(--muted);font-weight:600;}
  input,select{font-family:inherit;font-size:.9rem;padding:8px 10px;border:1px solid var(--line);border-radius:4px;background:#fff;color:var(--ink);}
  input:focus,select:focus{outline:2px solid var(--chalk-light);outline-offset:1px;}
  input.mark-invalid{border-color:var(--redpen);background:#FBEAE8;outline:2px solid var(--redpen);outline-offset:1px;}
  button.primary{background:var(--chalk);color:#fff;border:none;padding:9px 18px;border-radius:4px;font-family:inherit;font-weight:600;cursor:pointer;font-size:.88rem;}
  button.primary:hover{background:var(--chalk-light);}
  button.ghost{background:transparent;border:1px solid var(--chalk);color:var(--chalk);padding:8px 14px;border-radius:4px;cursor:pointer;font-family:inherit;font-size:.85rem;font-weight:600;}
  button.ghost:hover{background:rgba(47,93,80,.08);}
  button.danger{background:transparent;border:1px solid var(--redpen);color:var(--redpen);padding:6px 10px;border-radius:4px;cursor:pointer;font-size:.78rem;}
  button.tab-btn{background:#fff;border:1.5px solid var(--chalk);color:var(--chalk);padding:9px 18px;border-radius:6px;cursor:pointer;font-family:inherit;font-size:.85rem;font-weight:700;transition:background .12s,color .12s,box-shadow .12s;}
  button.tab-btn:hover{background:rgba(47,93,80,.1);}
  button.tab-btn:active{transform:translateY(1px);}
  button.tab-btn.active{background:var(--chalk);color:#fff;box-shadow:0 1px 4px rgba(47,93,80,.35);}
  button.tab-btn.active:hover{background:var(--chalk-light);}
  table{width:100%;border-collapse:collapse;margin-top:10px;font-size:.87rem;}
  th,td{padding:7px 9px;border-bottom:1px solid var(--line);text-align:left;}
  th{color:var(--muted);font-weight:600;font-size:.75rem;text-transform:uppercase;letter-spacing:.03em;}
  td.num, th.num{text-align:center;}
  tr:hover td{background:rgba(47,93,80,.04);}
  /* zebra striping for readability — class timetable, periods & timing, seating plan tables */
  .tt-periods-table tbody tr:nth-child(even) td{background:#F6F3EC;}
  .tt-periods-table thead th{background:#E3EFE9;color:var(--chalk);}
  table.tt-grid tbody tr:nth-child(even) td.tt-cell{background:#F6F3EC;}
  table.tt-grid tbody tr:nth-child(even) td.tt-periodcell{background:#F6F3EC;}
  table.tt-grid td.tt-periodcell{text-align:left;padding:6px 10px;min-width:110px;}
  .seat-room-block table tbody tr:nth-child(even) td{background:#F6F3EC;}
  .seat-chart-page table tbody tr:nth-child(even) td{background:#F6F3EC;}
  .card-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px;margin-top:10px;}
  .assign-card{border:1px solid var(--line);border-radius:6px;padding:16px;background:#fff;cursor:pointer;transition:box-shadow .15s, transform .15s;}
  .assign-card:hover{box-shadow:0 3px 10px rgba(0,0,0,.08);transform:translateY(-1px);}
  .assign-card .cls{font-family:'Noto Serif Devanagari',serif;font-size:1.05rem;color:var(--chalk);}
  .assign-card .sub{color:var(--marigold);font-weight:700;font-size:.85rem;margin-top:2px;}
  .assign-card .meta{color:var(--muted);font-size:.75rem;margin-top:8px;}
  .note{background:#FBF3E4;border:1px solid #EBD9AF;color:#7A5A15;padding:10px 14px;border-radius:5px;font-size:.82rem;margin-bottom:16px;}
  .empty{color:var(--muted);font-size:.85rem;padding:18px 0;text-align:center;}
  .login-box{max-width:380px;margin:0 auto 60px;}
  .role-choice{display:flex;gap:7px;justify-content:center;margin-bottom:26px;}
  .role-choice button{flex:1;padding:14px 6px;border:1px solid var(--line);background:#fff;border-radius:8px;cursor:pointer;font-family:'Noto Serif Devanagari',serif;font-size:1.04rem;color:var(--chalk);display:flex;align-items:center;justify-content:center;gap:8px;white-space:normal;text-align:center;line-height:1.2;}
  .role-choice button:hover{border-color:var(--chalk);background:rgba(47,93,80,.05);}
  .role-choice button.active{background:var(--chalk);border-color:var(--chalk);color:#fff;}
  .role-choice button.active:hover{background:var(--chalk-light);}
  .grade-A1{color:#1E7A4C;font-weight:700;} .grade-A2{color:#3E7566;font-weight:700;}
  .grade-B1{color:var(--marigold);font-weight:700;} .grade-B2{color:#B2762D;font-weight:700;}
  .grade-C{color:var(--redpen);font-weight:700;} .grade-D{color:var(--redpen);font-weight:700;}
  .report-card{width:190mm;height:277mm;overflow:hidden;border:1px solid var(--line);border-radius:6px;padding:13.1mm 14mm 20.4mm;background:#fff;margin:0 auto 22px;box-sizing:border-box;position:relative;page-break-after:always;page-break-inside:avoid;box-shadow:0 2px 10px rgba(0,0,0,.08);}
  .report-card:last-of-type{page-break-after:auto;}
  .pdf-export .report-card{box-shadow:none!important;border:none!important;margin:0 auto!important;}
  .report-card .rc-inner{transform-origin:top center;}
  .report-card .rc-header{text-align:center;border-bottom:3px solid var(--chalk);padding-bottom:10px;margin-bottom:7px;}
  .report-card .rc-header .rc-logo{max-height:56px;max-width:120px;object-fit:contain;margin-bottom:4px;}
  .report-card .rc-header .rc-school-name{font-family:'Noto Serif Devanagari',serif;font-size:3rem;font-weight:700;color:var(--rc-name-color,var(--chalk));letter-spacing:.5px;line-height:1.3;padding-top:6px;white-space:nowrap;max-width:100%;overflow:visible;display:inline-block;}
  .report-card .rc-header .rc-school-addr{font-family:'Noto Sans Devanagari',sans-serif;font-size:1.2rem;color:var(--rc-addr-color,var(--muted));margin-top:-4px;}
  .report-card .rc-header .rc-title{margin-top:8px;font-family:'Noto Serif Devanagari',serif;font-size:1.05rem;font-weight:700;color:#fff;background:var(--marigold);display:inline-block;padding:4px 18px;border-radius:3px;letter-spacing:.5px;}
  .report-card .rc-header .rc-session{margin-top:6px;font-family:'Noto Sans Devanagari',sans-serif;font-size:.85rem;font-weight:600;color:var(--chalk);}
  .report-card h3{margin:0 0 2px;color:var(--chalk);}
  .report-card .roll{color:var(--muted);font-size:.82rem;margin-bottom:12px;}
  .report-card .summary{display:flex;gap:22px;margin-top:10px;font-size:.9rem;flex-wrap:wrap;}
  .report-card .summary div b{display:block;font-family:'IBM Plex Mono',monospace;font-size:1.1rem;}
  .exam-block{margin-top:16px;border-top:1px dashed var(--line);padding-top:14px;}
  .exam-block h4{margin:0 0 6px;color:var(--marigold);font-size:.92rem;font-family:'Noto Serif Devanagari',serif;}
  .annual-block{margin-top:18px;border-top:2px solid var(--chalk);padding-top:14px;}
  .annual-block h4{margin:0 0 6px;color:var(--chalk);font-size:1rem;font-family:'Noto Serif Devanagari',serif;}
  .rc-student-box{border:1px solid var(--ink);border-radius:6px;padding:6px 20px;margin-bottom:7px;background:#FCFAF4;display:grid;grid-template-columns:1fr 1fr;row-gap:4px;column-gap:20px;}
  .rc-student-box .sd-cell{font-size:.9rem;display:flex;align-items:baseline;gap:6px;flex-wrap:nowrap;}
  .rc-student-box .sd-cell .sd-label{color:var(--muted);font-size:.78rem;white-space:nowrap;}
  .rc-student-box .sd-cell .sd-label::after{content:':';}
  .rc-student-box .sd-cell .sd-value{font-family:'Noto Serif Devanagari',serif;font-weight:700;font-size:1.05rem;}
  .rc-signrow{display:flex;justify-content:space-between;gap:14px;margin-top:60px;padding-top:6px;}
  .rc-sign{flex:1;text-align:center;}
  .rc-sign-line{border-top:1px solid var(--ink);margin:0 8px 6px;}
  .rc-sign-label{font-size:.72rem;color:var(--ink);font-weight:600;line-height:1.3;}
  .exam-grid{display:flex;flex-wrap:wrap;gap:10px;margin-top:2px;justify-content:center;}
  .exam-box{border:1px solid var(--line);border-radius:6px;padding:10px;box-sizing:border-box;flex:1 1 calc(33.333% - 7px);min-width:150px;max-width:calc(33.333% - 7px);}
  .exam-box h4{margin:0 0 6px;color:var(--marigold);font-size:.85rem;font-family:'Noto Serif Devanagari',serif;text-align:center;}
  .exam-box table{font-size:.75rem;margin-top:4px;}
  .exam-box th,.exam-box td{padding:4px 5px;}
  .exam-box tbody tr:nth-child(even) td{background:var(--rc-alt-row,rgba(47,93,80,.06));}
  .comp-breakup{font-size:.85em;color:var(--muted);margin-top:1px;font-family:'Noto Sans Devanagari',sans-serif;font-weight:400;}
  .exam-box .summary{display:block;font-size:.75rem;margin-top:3px;}
  .exam-box .summary div{margin-bottom:1px;display:flex;justify-content:space-between;}
  .exam-box .summary div b{font-family:'IBM Plex Mono',monospace;font-size:.75rem;}
  .grand-total-box{border:none;background:transparent;padding:2px 4px;box-sizing:border-box;}
  .exam-grid .grand-total-box{flex:1 1 calc(33.333% - 7px);min-width:230px;}
  .grand-total-box.gtb-standalone{margin-top:7px;width:100%;}
  .grand-total-box .summary{display:flex;gap:54px;flex-wrap:wrap;font-size:.75rem;justify-content:center;}
  .grand-total-box .summary div b{display:block;font-family:'IBM Plex Mono',monospace;font-size:.75rem;}
  .grand-total-box .gt-label{font-family:'Noto Serif Devanagari',serif;font-weight:700;color:var(--chalk);font-size:.75rem;text-align:center;margin-bottom:4px;}
  @media(max-width:700px){.exam-box{flex-basis:100%;max-width:100%;}}
  .rc-combined-scroll{width:100%;overflow-x:auto;-webkit-overflow-scrolling:touch;}
  .rc-combined-table{width:auto;max-width:100%;border-collapse:collapse;margin:10px auto 0;table-layout:auto;}
  .rc-combined-table thead th{background:var(--rc-th-bg,#173A63);color:var(--rc-th-text,#fff);font-family:'Noto Sans Devanagari',sans-serif;font-weight:700;font-size:.7rem;line-height:1.25;padding:6px 5px;border:var(--rc-border-w,1px) solid var(--rc-border,#2C517F);text-align:center;vertical-align:middle;word-break:break-word;}
  .rc-combined-table thead th .rc-maxline{display:block;font-weight:400;font-size:.62rem;opacity:.85;margin-top:2px;white-space:normal;}
  .rc-combined-table thead th.rc-th-sr{width:1%;white-space:nowrap;}
  .rc-combined-table thead th.rc-th-subj{text-align:left;width:1%;min-width:78px;white-space:nowrap;word-break:normal;}
  .rc-combined-table tbody td{border:var(--rc-border-w,1px) solid var(--rc-cell-border,#CBD3E1);padding:6px 6px;font-size:.76rem;text-align:center;color:var(--ink);word-break:break-word;}
  .rc-combined-table tbody tr:nth-child(even) td{background:var(--rc-alt-row,#F6F8FB);}
  .rc-combined-table tbody td.rc-sr-cell{text-align:center;color:var(--muted);white-space:nowrap;}
  .rc-combined-table tbody td.rc-subj-cell{text-align:left;font-weight:600;font-family:'Noto Serif Devanagari',serif;white-space:nowrap;word-break:normal;min-width:78px;}
  .rc-combined-table tbody tr.rc-total-row td{background:var(--rc-total-row,#E7ECF6);font-weight:700;border-top:var(--rc-total-border-w,2px) solid var(--rc-th-bg,#173A63);color:var(--rc-total-text,#21281F);}
  .rc-combined-table tbody tr.rc-total-row td.rc-subj-cell{text-align:left;}
  .exam-tabbar{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap;}
  .exam-tabbar button{background:#fff;border:1px solid var(--line);color:var(--muted);padding:7px 14px;border-radius:16px;cursor:pointer;font-family:inherit;font-size:.82rem;font-weight:600;}
  .exam-tabbar button.active{background:var(--chalk);border-color:var(--chalk);color:#fff;}
  .type-tag{display:inline-block;font-size:.68rem;padding:1px 7px;border-radius:8px;background:rgba(47,93,80,.12);color:var(--chalk);margin-left:6px;}

  /* ---- Admit Card ---- */
  #admitPrintWrap{padding:0 0 30px;}
  .admit-card{
    width:210mm;height:297mm;margin:0 auto 26px;background:#fff;
    border:1px solid var(--line);box-shadow:0 2px 10px rgba(0,0,0,.08);
    padding:12mm 14mm;box-sizing:border-box;
    position:relative;overflow:hidden;page-break-after:always;page-break-inside:avoid;
  }
  .admit-card:last-of-type{page-break-after:auto;}
  .admit-card .ac-inner{transform-origin:top center;}
  .admit-card .ac-watermark{position:absolute;inset:0;z-index:0;pointer-events:none;overflow:hidden;}
  .admit-card .ac-watermark svg{width:100%;height:100%;display:block;}
  .admit-card .ac-header,.admit-card .ac-main,.admit-card .ac-sched,.admit-card .ac-instructions,.admit-card .ac-signatures{position:relative;z-index:1;}
  .admit-card .ac-header{text-align:center;border-bottom:3px solid var(--chalk);padding-bottom:10px;margin-bottom:16px;}
  .admit-card .ac-header .ac-school-name{font-family:'Noto Serif Devanagari',serif;font-size:1.7rem;font-weight:700;color:var(--chalk);letter-spacing:.5px;line-height:1.2;width:100%;}
  .admit-card .ac-header .ac-school-addr{font-family:'Noto Sans Devanagari',sans-serif;font-size:.82rem;color:var(--muted);margin-top:4px;}
  .admit-card .ac-header .ac-admit-title{margin-top:10px;font-family:'Noto Serif Devanagari',serif;font-size:1.15rem;font-weight:700;color:#fff;background:var(--marigold);display:inline-block;padding:5px 22px;border-radius:3px;letter-spacing:.5px;}
  .admit-card .ac-header .ac-exam-sub{display:block;margin-top:6px;font-size:.85rem;color:var(--chalk);font-weight:600;}
  .admit-card .ac-main{display:flex;gap:22px;margin-bottom:20px;}
  .admit-card .ac-photo{width:104px;height:126px;border:1px dashed var(--muted);display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:.72rem;text-align:center;flex-shrink:0;border-radius:4px;overflow:hidden;background:#fff;}
  .admit-card .ac-photo img{width:100%;height:100%;object-fit:cover;}
  .admit-card .ac-details{flex:1;border:1px solid var(--ink);border-radius:6px;padding:10px 16px;display:grid;grid-template-columns:1fr 1fr;row-gap:8px;column-gap:16px;align-content:center;}
  .admit-card .ac-details .sd-cell{font-size:.85rem;display:flex;align-items:baseline;gap:6px;flex-wrap:nowrap;}
  .admit-card .ac-details .sd-cell .sd-label{color:var(--muted);font-size:.72rem;white-space:nowrap;}
  .admit-card .ac-details .sd-cell .sd-label::after{content:':';}
  .admit-card .ac-details .sd-cell .sd-value{font-family:'Noto Serif Devanagari',serif;font-weight:700;font-size:.95rem;}
  .admit-card .ac-sched h4{margin:0 0 8px;color:var(--chalk);font-size:1rem;font-family:'Noto Serif Devanagari',serif;border-bottom:1px solid var(--line);padding-bottom:6px;}
  .admit-card .ac-sched table{width:100%;border-collapse:collapse;font-size:.87rem;}
  .admit-card .ac-sched th,.admit-card .ac-sched td{border:1px solid var(--line);padding:7px 9px;text-align:left;}
  .admit-card .ac-sched th{background:rgba(47,93,80,.08);color:var(--chalk);font-size:.72rem;text-transform:uppercase;letter-spacing:.03em;}
  .admit-card .ac-instructions{margin-top:16px;font-size:.78rem;color:#7A5A15;background:#FBF3E4;border:1px solid #EBD9AF;padding:10px 14px;border-radius:5px;}
  .admit-card .ac-instructions h5{margin:0 0 6px;font-size:.82rem;color:#7A5A15;font-family:'Noto Serif Devanagari',serif;}

// ---------- FIREBASE (cloud/live storage) ----------
const firebaseConfig = {

firebase.initializeApp(firebaseConfig);
const fbDB = firebase.database();

function encodeFbKey(key){ return encodeURIComponent(key).replace(/\./g, '%2E'); }
function decodeFbKey(key){ return decodeURIComponent(key.replace(/%2E/g, '.')); }

// Anonymous auth must succeed before any database read/write is allowed by
// the security rules. All storage calls below wait on this, so login works
// correctly even if a user acts before background init finishes signing in.
let authReadyResolve;
const authReady = new Promise(res=>{ authReadyResolve = res; });

// Drop-in replacement for the old sandboxed window.storage API, now backed by
// Firebase Realtime Database so data is live/cloud-based and shared across all users.
window.storage = {
  async get(key, shared){
    await authReady;
    const snap = await fbDB.ref('data/' + encodeFbKey(key)).get();
    if(!snap.exists()) return null;
    return {key, value: snap.val(), shared: !!shared};
  },
  async set(key, value, shared){
    await authReady;
    await fbDB.ref('data/' + encodeFbKey(key)).set(value);
    return {key, value, shared: !!shared};
  },
  async delete(key, shared){
    await authReady;
    await fbDB.ref('data/' + encodeFbKey(key)).remove();
    return {key, deleted: true, shared: !!shared};
  },
  async list(prefix, shared){
    await authReady;
    const snap = await fbDB.ref('data').get();
    if(!snap.exists()) return {keys: [], prefix, shared: !!shared};
    const allKeys = Object.keys(snap.val()).map(decodeFbKey);
    const filtered = prefix ? allKeys.filter(k=>k.startsWith(prefix)) : allKeys;
    return {keys: filtered, prefix, shared: !!shared};
  }
};

const REGISTRY_KEY = 'schools-registry-v1';

async function loadRegistry(){
  try{ const res = await window.storage.get(REGISTRY_KEY, true); registry = res ? JSON.parse(res.value) : []; }

}

  try{ await window.storage.set(REGISTRY_KEY, JSON.stringify(registry), true); }

}

async function fetchSchoolDB(schoolId){
  try{ const res = await window.storage.get(schoolDbKey(schoolId), true); return res ? JSON.parse(res.value) : null; }
  catch(e){ return null; }
}
async function createSchool(name, address, adminUser, adminPass){
  const id = 's' + Date.now() + Math.random().toString(36).slice(2,7);
  registry.push({id, name, address: address||'', loginUsername: adminUser, loginPassword: adminPass, createdAt: Date.now()});
  await saveRegistry();
  const newDb = emptyDB();
  newDb.school.name = name;
  newDb.school.address = address||'';
  newDb.adminAuth = {username: adminUser, password: adminPass};
  try{ await window.storage.set(schoolDbKey(id), JSON.stringify(newDb), true); }
  catch(e){ console.error('school create failed', e); }

    await saveRegistry();

  Object.keys(teacherIndex).forEach(u=>{ if(teacherIndex[u]===id) delete teacherIndex[u]; });

async function updateSchoolFromSuperAdmin(id, {name, address, loginUsername, loginPassword}){
  const entry = registry.find(s=>s.id===id);
  if(entry){
    entry.name = name;
    entry.address = address;
    entry.loginUsername = loginUsername;
    entry.loginPassword = loginPassword;

async function loadDB(schoolId, presetRawDb){
  // presetRawDb lets a caller that already fetched this school's data (e.g. teacher
  // login verifying the password) hand it over directly instead of us re-fetching
  // the exact same record over the network again — this was doubling login time.
  if(presetRawDb !== undefined){
    db = presetRawDb || emptyDB();
  } else {
    try{ const res = await window.storage.get(schoolDbKey(schoolId), true); db = res ? JSON.parse(res.value) : emptyDB(); }
    catch(e){ db = emptyDB(); }
  }
  if(!db.exams) db.exams = emptyDB().exams;
  if(!db.examSchedule) db.examSchedule = {};
  if(!db.subjectOrder) db.subjectOrder = {};
  if(!db.school) db.school = {name:'हमारा विद्यालय', address:'', session:''};
  if(!db.customInstructions) db.customInstructions = [];
  if(!db.watermark) db.watermark = {enabled:true, style:'rings', color:'#2F5D50', opacity:0.14, text:'', density:6, thickness:'normal', fontSize:100};
  if(db.watermark.density==null) db.watermark.density = 3;
  if(!db.watermark.thickness) db.watermark.thickness = 'normal';
  if(db.watermark.fontSize==null) db.watermark.fontSize = 100;
  if(!db.adminAuth) db.adminAuth = {username:'admin', password:'admin123'};
  if(!db.reportTableStyle) db.reportTableStyle = {headerBg:'#173A63', headerText:'#FFFFFF', borderColor:'#2C517F', altRowColor:'#F6F8FB', totalRowColor:'#E7ECF6', totalRowTextColor:'#21281F', schoolNameColor:'#2F5D50', schoolAddrColor:'#6B6456', transparentRows:false, showBorder:true};
  if(!db.reportTableStyle.schoolNameColor) db.reportTableStyle.schoolNameColor = '#2F5D50';
  if(!db.reportTableStyle.schoolAddrColor) db.reportTableStyle.schoolAddrColor = '#6B6456';
  if(db.reportTableStyle.transparentRows==null) db.reportTableStyle.transparentRows = false;
  if(!db.reportTableStyle.totalRowTextColor) db.reportTableStyle.totalRowTextColor = '#21281F';
  if(db.reportTableStyle.showBorder==null) db.reportTableStyle.showBorder = true;
  if(!db.timetablePeriods) db.timetablePeriods = [];
  if(!db.timetable) db.timetable = {};
  if(!db.seatingPlan) db.seatingPlan = {};
  if(!db.tcRecords) db.tcRecords = {};
  if(!db.attendance) db.attendance = {};
  if(!db.holidays) db.holidays = {};
  if(!db.sundayOverride) db.sundayOverride = {}; // dates a user manually turned a Sunday back into a working day
  if(!db.fees) db.fees = {};
  if(!db.feeReceiptSeq) db.feeReceiptSeq = 1;
  if(!db.feeConfig) db.feeConfig = {};
  if(!db.feeSettings) db.feeSettings = {dueDay: 10, finePerDay: 5};
  if(db.feeSettings.dueDay==null) db.feeSettings.dueDay = 10;
  if(db.feeSettings.finePerDay==null) db.feeSettings.finePerDay = 5;
  currentSchoolId = schoolId;
}
// Small on-screen notice — used mainly so a failed save is never silent (the
// person would otherwise believe an entry like a fee deposit was recorded
// when it never reached the server).
function toast(msg, type){
  const host = document.getElementById('toastHost');
  if(!host){ if(type==='err') alert(msg); return; }
  const t = el(`<div class="toast ${type==='err'?'err':'ok'}"></div>`);
  t.textContent = msg;
  host.appendChild(t);
  setTimeout(()=>{ t.remove(); }, type==='err'?5000:2200);
}
async function saveDB(){
  try{ await window.storage.set(schoolDbKey(currentSchoolId), JSON.stringify(db), true); return true; }
  catch(e){
    console.error('save failed', e);
    toast('⚠️ सेव नहीं हुआ — इंटरनेट कनेक्शन जांचें और दोबारा कोशिश करें', 'err');
    return false;
  }
}
async function exportAllData(){
  const schools = {};
  for(const s of registry){
    const d = await fetchSchoolDB(s.id);
    if(d) schools[s.id] = d;
  }
  const payload = {version:1, exportedAt: Date.now(), registry, teacherIndex, schools};
  const blob = new Blob([JSON.stringify(payload, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `school-report-backup-${new Date().toISOString().slice(0,10)}.json`;
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
}
async function importAllData(file){
  const text = await file.text();
  let payload;
  try{ payload = JSON.parse(text); }
  catch(e){ throw new Error('यह एक मान्य JSON फ़ाइल नहीं है'); }
  if(!payload || !Array.isArray(payload.registry) || typeof payload.schools !== 'object'){
    throw new Error('यह एक मान्य बैकअप फ़ाइल नहीं है');
  }
  registry = payload.registry;
  teacherIndex = payload.teacherIndex || {};
  await saveRegistry();
  await saveTeacherIndex();
  for(const id of Object.keys(payload.schools)){
    try{ await window.storage.set(schoolDbKey(id), JSON.stringify(payload.schools[id]), true); }
    catch(e){ console.error('school import failed for', id, e); }
  }
}

function grade(pct){
  if(pct>=90) return ['A1','grade-A1'];
  if(pct>=75) return ['A2','grade-A2'];
  if(pct>=60) return ['B1','grade-B1'];
  if(pct>=45) return ['B2','grade-B2'];
  if(pct>=33) return ['C','grade-C'];
  return ['D (अनुत्तीर्ण)','grade-D'];
}

function readAndCompressImage(file){
  return new Promise((resolve, reject)=>{
    if(!file){ resolve(null); return; }
    const reader = new FileReader();
    reader.onload = (e)=>{
      const img = new Image();
      img.onload = ()=>{
        const targetW = 180, targetH = 220;
        const canvas = document.createElement('canvas');
        canvas.width = targetW; canvas.height = targetH;
        const ctx = canvas.getContext('2d');
        const scale = Math.max(targetW/img.width, targetH/img.height);
        const sw = targetW/scale, sh = targetH/scale;
        const sx = (img.width-sw)/2, sy = (img.height-sh)/2;
        ctx.drawImage(img, sx, sy, sw, sh, 0, 0, targetW, targetH);
        resolve(canvas.toDataURL('image/jpeg', 0.7));
      };
      img.onerror = ()=> reject(new Error('image load failed'));
      img.src = e.target.result;
    };
    reader.onerror = ()=> reject(new Error('file read failed'));
    reader.readAsDataURL(file);
  });
}

    }

      tabBar.style.display='none';
      app.appendChild(renderSeatingPrintView(ui.seatingPrintView));
      return;
    }
    const allTabs=[['school','मेरा लॉगिन'],['classes','कक्षा व छात्र'],['fees','फीस जमा'],['feerules','फीस नियम'],['exams','परीक्षाएँ'],['teachers','अध्यापक'],['assign','विषय असाइन'],['timetable','टाइम टेबल'],['seating','सीटिंग प्लान'],['admit','प्रवेश पत्र'],['reports','रिपोर्ट कार्ड'],['attendance','उपस्थिति'],['tc','टी.सी.']];

    if(!tabs.some(([key])=> key===ui.tab)) ui.tab = tabs[0][0];
    tabs.forEach(([key,label])=>{

      tabBar.appendChild(b);

    tTabs.push(['assign','📝','परीक्षा के नंबर']);
    tTabs.push(['password','🔑','पासवर्ड बदलें']);
    if(!ui.teacherView || !tTabs.some(([key])=>key===ui.teacherView)) ui.teacherView = 'timetable';
    tTabs.forEach(([key,icon,label])=>{
      const b=el(`<button class="${ui.teacherView===key?'active':''}"><span class="tab-icon" aria-hidden="true">${icon}</span><span class="tab-label">${label}</span></button>`);

function renderExams(){
  const wrap = el(`<div class="page"><div class="punch"></div>

  wrap.querySelector('#addExamBtn').onclick = async ()=>{
    const name = wrap.querySelector('#newExam').value.trim();
    if(!name) return;

    db.exams.push(name);
    await saveDB(); render();
  };
  const rows = wrap.querySelector('#examRows');
  db.exams.forEach((ex,i)=>{
    const tr = el(`<tr><td class="mono">${i+1}</td><td class="examNameCell">${ex}</td><td style="white-space:nowrap;">
      <button class="ghost" data-edit-ex="${i}" title="नाम बदलें" style="padding:4px 9px;">एडिट करें</button>
      <button class="ghost" data-up="${i}" ${i===0?'disabled':''} title="ऊपर ले जाएं" style="padding:4px 9px;">↑</button>
      <button class="ghost" data-down="${i}" ${i===db.exams.length-1?'disabled':''} title="नीचे ले जाएं" style="padding:4px 9px;">↓</button>
      <button class="danger" data-rm="${i}">हटाएं</button>
    </td></tr>`);
    const editTr = el(`<tr class="examEditRow" style="display:none;background:var(--paper2,#fafafa);"><td></td><td colspan="2">
      <div class="row" style="align-items:flex-end;">
        <div class="field"><label>परीक्षा का नाम</label><input class="eexName" value="${ex.replace(/"/g,'&quot;')}"></div>
        <div class="field" style="flex:0;"><button class="primary eexSave">सेव करें</button> <button class="ghost eexCancel">रद्द करें</button></div>
      </div>
      <div class="eexErr" style="color:var(--redpen);font-size:.82rem;"></div>
    </td></tr>`);
    tr.querySelector('[data-edit-ex]').onclick = ()=>{
      editTr.style.display = editTr.style.display==='none' ? 'table-row' : 'none';
    };
    editTr.querySelector('.eexCancel').onclick = ()=>{ editTr.style.display='none'; };
    editTr.querySelector('.eexSave').onclick = async ()=>{
      const newName = editTr.querySelector('.eexName').value.trim();
      const errBox = editTr.querySelector('.eexErr');
      errBox.textContent = '';
      if(!newName){ errBox.textContent = 'कृपया परीक्षा का नाम भरें'; return; }
      if(newName!==ex && db.exams.includes(newName)){ errBox.textContent = 'इस नाम से परीक्षा पहले से मौजूद है'; return; }
      if(newName!==ex){
        db.exams[i] = newName;
        // migrate marks + schedule stored under the old exam name
        if(db.marks && db.marks[ex]!==undefined){ db.marks[newName] = db.marks[ex]; delete db.marks[ex]; }
        if(db.examSchedule && db.examSchedule[ex]!==undefined){ db.examSchedule[newName] = db.examSchedule[ex]; delete db.examSchedule[ex]; }
        // migrate per-exam max-marks keys stored on each subject assignment's components
        Object.values(db.assignments||{}).flat().forEach(a=>{
          (a.components||[]).forEach(c=>{
            if(c.maxByExam && Object.prototype.hasOwnProperty.call(c.maxByExam, ex)){
              c.maxByExam[newName] = c.maxByExam[ex];
              delete c.maxByExam[ex];
            }
          });
        });
      }
      await saveDB(); render();
    };
    tr.querySelector('[data-up]').onclick = async ()=>{
      if(i===0) return;
      [db.exams[i-1], db.exams[i]] = [db.exams[i], db.exams[i-1]];
      await saveDB(); render();
    };
    tr.querySelector('[data-down]').onclick = async ()=>{
      if(i===db.exams.length-1) return;
      [db.exams[i+1], db.exams[i]] = [db.exams[i], db.exams[i+1]];
      await saveDB(); render();
    };
    tr.querySelector('[data-rm]').onclick = async ()=>{
      if(!confirm(`"${ex}" परीक्षा हटाएं? (इसके मार्क्स सुरक्षित रहेंगे पर दिखेंगे नहीं)`)) return;
      db.exams.splice(i,1);
      await saveDB(); render();
    };
    rows.appendChild(tr);
    rows.appendChild(editTr);
  });
  return wrap;
}

function readLogoImage(file){
  return new Promise((resolve, reject)=>{
    if(!file){ resolve(null); return; }
    const reader = new FileReader();
    reader.onload = (e)=>{
      const img = new Image();
      img.onload = ()=>{
        const maxDim = 220;
        const scale = Math.min(1, maxDim/Math.max(img.width, img.height));
        const w = Math.round(img.width*scale), h = Math.round(img.height*scale);
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL('image/png'));
      };
      img.onerror = ()=> reject(new Error('image load failed'));
      img.src = e.target.result;
    };
    reader.onerror = ()=> reject(new Error('file read failed'));
    reader.readAsDataURL(file);
  });
}

// Reads a full-page background image (e.g. for the Admit Card A4 page). Scaled to
// A4 proportions at print-safe resolution (~150dpi -> 1240x1754) and compressed as
// JPEG to keep it lightweight enough to store alongside the rest of the school data.
function readBackgroundImage(file){
  return new Promise((resolve, reject)=>{
    if(!file){ resolve(null); return; }
    const reader = new FileReader();
    reader.onload = (e)=>{
      const img = new Image();
      img.onload = ()=>{
        const maxW = 1240, maxH = 1754;
        const scale = Math.min(1, maxW/img.width, maxH/img.height);
        const w = Math.round(img.width*scale), h = Math.round(img.height*scale);
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        const ctx = canvas.getContext('2d');
        ctx.fillStyle = '#fff';
        ctx.fillRect(0,0,w,h);
        ctx.drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL('image/jpeg', 0.85));
      };
      img.onerror = ()=> reject(new Error('image load failed'));
      img.src = e.target.result;
    };
    reader.onerror = ()=> reject(new Error('file read failed'));
    reader.readAsDataURL(file);
  });
}

        rows.push([cname, s.roll||'', s.name||'', s.dob||'', s.father||s.guardian||'', s.mother||'']);
      });
    });
    const wsData = rows.length>1 ? rows : [STU_COLS];
    const ws = XLSX.utils.aoa_to_sheet(wsData);
    const wb = XLSX.utils.book_new();

        const student = (db.classes[cls] && db.classes[cls].students || []).find(x=>x.id===sid);
        if(student){
          // all checked = no restriction (matches every student's default behaviour)
          student.subjects = (checked.length===boxes.length) ? [] : checked;
        }
        await saveDB(); render();
      };
    });
    listHost.appendChild(section);

  return wrap;

// ---------- ADMIN: FEE DEPOSIT ----------
// Data model notes:
//  db.fees[cls][studentId]  -> array of ledger entries. Two kinds:
//    - kind:'tuitionDue'    auto-generated once per calendar month per student (see ensureTuitionDues)
//                           {id, kind, month:'YYYY-MM', amount, discountType, discountValue}
//    - kind:'tuitionPayment' a payment collected against a specific tuitionDue month
//                           {id, kind, forMonth, date, amount, mode, receiptNo}
//    - (no kind / kind:'other') legacy free-form one-off entries (admission fee, exam fee, etc.)
//                           that were recorded as paid the moment they were entered
//                           {id, date, particulars, amount, mode, receiptNo}
//    - kind:'otherCharge'  a one-off fee CHARGED to a student (or a whole class at once) —
//                           shows up as "due" in the fee list until collected, same as tuition
//                           {id, kind, date, particulars, amount}
//    - kind:'otherPayment' a payment collected against a specific otherCharge
//                           {id, kind, forChargeId, date, amount, mode, receiptNo}
//  db.feeConfig[cls][studentId] -> {monthly, dueDay, finePerDay, discountType, discountValue, startMonth}
//  db.feeSettings -> school-wide defaults {dueDay, finePerDay} used when a student has no override
function monthLabelHindi(monthKey){
  if(!monthKey) return '—';
  const [y,m] = monthKey.split('-').map(Number);
  return `${MONTH_NAMES_HI[m-1]||''} ${y}`;
}
// Generates this student's monthly tuition-due entries, from their configured
// start month up through the current month, if a monthly amount is configured.
// Returns true if any new due entries were created (caller should persist).
function ensureTuitionDues(cls, sid){
  const cfg = (db.feeConfig[cls]||{})[sid];
  if(!cfg || !cfg.monthly || cfg.monthly<=0) return false;
  if(!db.fees[cls]) db.fees[cls] = {};
  if(!db.fees[cls][sid]) db.fees[cls][sid] = [];
  const records = db.fees[cls][sid];
  const startMonth = cfg.startMonth || todayStr().slice(0,7);
  const curMonth = todayStr().slice(0,7);
  let [sy,sm] = startMonth.split('-').map(Number);
  const [cy,cm] = curMonth.split('-').map(Number);
  if(isNaN(sy)||isNaN(sm)) return false;
  let changed = false;
  let guard = 0;
  while((sy<cy || (sy===cy && sm<=cm)) && guard<600){
    guard++;
    const monthKey = sy + '-' + String(sm).padStart(2,'0');
    if(!records.some(r=>r.kind==='tuitionDue' && r.month===monthKey)){
      records.push({id:'td'+Date.now()+Math.random().toString(36).slice(2,6)+guard, kind:'tuitionDue', month:monthKey, amount:cfg.monthly, discountType:cfg.discountType||'none', discountValue:cfg.discountValue||0});
      changed = true;
    }
    sm++; if(sm>12){ sm=1; sy++; }
  }
  return changed;
}
// Computes payable/paid/fine/outstanding for one tuitionDue entry.
// asOfDate lets us ask "what did this look like on a given day" (e.g. when printing
// a receipt for a past payment) instead of always using today's date.
// excludeRecordId lets us leave one specific payment out of the "already paid" total —
// needed when printing a receipt for THAT payment itself, otherwise it counts as already
// paid and the fine it was meant to cover looks like it never existed.
function tuitionDueStatus(cls, sid, due, asOfDate, excludeRecordId){
  const cfg = (db.feeConfig[cls]||{})[sid] || {};
  const dueDay = cfg.dueDay || (db.feeSettings&&db.feeSettings.dueDay) || 10;
  const [y,m] = due.month.split('-').map(Number);
  const lastDayOfMonth = new Date(y, m, 0).getDate();
  const dueDate = new Date(y, m-1, Math.min(dueDay, lastDayOfMonth));
  dueDate.setHours(0,0,0,0);
  const discType = due.discountType || 'none';
  const discVal = Number(due.discountValue)||0;
  const discount = discType==='percent' ? Math.round(due.amount * discVal/100) : (discType==='amount' ? discVal : 0);
  const payable = Math.max(0, Number(due.amount||0) - discount);
  const records = (db.fees[cls]&&db.fees[cls][sid]) || [];
  const paid = records
    .filter(r=>r.kind==='tuitionPayment' && r.forMonth===due.month && r.id!==excludeRecordId)
    .reduce((s,r)=> s+(Number(r.amount)||0), 0);
  const today = asOfDate ? new Date(asOfDate+'T00:00:00') : new Date();
  today.setHours(0,0,0,0);
  const isFullyPaid = paid >= payable;
  let fine = 0, daysLate = 0;
  if(!isFullyPaid && today > dueDate){
    const finePerDay = cfg.finePerDay!=null ? Number(cfg.finePerDay) : ((db.feeSettings&&db.feeSettings.finePerDay)||0);
    daysLate = Math.floor((today - dueDate)/86400000);
    fine = Math.max(0, daysLate) * finePerDay;
  }
  const outstanding = Math.max(0, payable + fine - paid);
  const status = isFullyPaid ? 'paid' : (today>dueDate ? 'overdue' : 'due');
  return {dueDate, discount, payable, paid, fine, daysLate, outstanding, status};
}
// Computes paid/outstanding for one one-off "otherCharge" entry (admission/exam/transport/etc.
// fee applied to a student, either singly or to a whole class at once). Unlike tuitionDue there's
// no due-day/fine concept here — it's simply payable until fully collected.
// excludeRecordId works the same as in tuitionDueStatus (used when printing a receipt for one
// specific payment, so that payment doesn't count itself as "already paid").
function otherChargeStatus(cls, sid, charge, excludeRecordId){
  const payable = Number(charge.amount)||0;
  const records = (db.fees[cls]&&db.fees[cls][sid]) || [];
  const paid = records
    .filter(r=>r.kind==='otherPayment' && r.forChargeId===charge.id && r.id!==excludeRecordId)
    .reduce((s,r)=> s+(Number(r.amount)||0), 0);
  const outstanding = Math.max(0, payable - paid);
  const status = outstanding<=0 ? 'paid' : 'due';
  return {payable, paid, outstanding, status};
}
// Prints a two-copy receipt slip (school copy + student copy) for one payment record.
// For tuition payments this also breaks out the month, monthly fee, discount and any
// late fine so the receipt itself shows how the collected amount was made up.
function printFeeReceipt(cls, student, record){
  const root = document.getElementById('receiptPrintRoot');
  if(!root) return;
  const school = db.school || {};
  let particulars = record.particulars || 'फीस';
  let extraRows = '';
  if(record.kind==='tuitionPayment'){
    particulars = `ट्यूशन फीस — ${monthLabelHindi(record.forMonth)}`;
    const records = (db.fees[cls]&&db.fees[cls][student.id]) || [];
    const due = records.find(r=>r.kind==='tuitionDue' && r.month===record.forMonth);
    if(due){
      // fine as it stood on the day this payment was made — and excluding this very
      // payment from "already paid" so the fine it covered still shows up here.
      const s = tuitionDueStatus(cls, student.id, due, record.date, record.id);
      extraRows += `<div class="receipt-row"><span>मासिक ट्यूशन फीस</span><span class="mono">₹${Number(due.amount).toLocaleString('en-IN')}</span></div>`;
      if(s.discount>0) extraRows += `<div class="receipt-row"><span>छूट</span><span class="mono">− ₹${s.discount.toLocaleString('en-IN')}</span></div>`;
      if(s.fine>0) extraRows += `<div class="receipt-row"><span>विलंब फाइन (${s.daysLate} दिन देर)</span><span class="mono" style="color:var(--redpen);">+ ₹${s.fine.toLocaleString('en-IN')}</span></div>`;
    }
  } else if(record.kind==='otherPayment'){
    const records = (db.fees[cls]&&db.fees[cls][student.id]) || [];
    const charge = records.find(r=>r.kind==='otherCharge' && r.id===record.forChargeId);
    if(charge){
      particulars = charge.particulars;
      const s = otherChargeStatus(cls, student.id, charge, record.id);
      extraRows += `<div class="receipt-row"><span>कुल देय राशि</span><span class="mono">₹${Number(charge.amount).toLocaleString('en-IN')}</span></div>`;
      if(s.outstanding>0) extraRows += `<div class="receipt-row"><span>शेष बकाया</span><span class="mono" style="color:var(--redpen);">₹${s.outstanding.toLocaleString('en-IN')}</span></div>`;
    }
  }
  const copyHtml = (tag)=>`
    <div class="receipt-copy">
      <div class="receipt-tag" style="color:var(--chalk);font-size:1rem;margin-bottom:2px;">फीस रसीद (Fee Receipt)</div>
      <div class="receipt-tag">${tag}</div>
      <div class="receipt-head">
        ${school.logo?`<img src="${school.logo}">`:''}
        <div><div class="rname">${school.name||''}</div><div class="raddr">${school.address||''}${school.session?' · सत्र '+school.session:''}</div></div>
      </div>
      <div class="receipt-row"><span>रसीद क्रमांक</span><span class="mono">${record.receiptNo||'—'}</span></div>
      <div class="receipt-row"><span>भुगतान दिनांक</span><span class="mono">${formatDateDMY(record.date)}</span></div>
      <div class="receipt-row"><span>छात्र का नाम</span><span>${student.name}</span></div>
      <div class="receipt-row"><span>पिता का नाम</span><span>${student.father||student.guardian||'—'}</span></div>
      <div class="receipt-row"><span>कक्षा / रोल नं.</span><span>${cls} / ${student.roll}</span></div>
      <div class="receipt-row"><span>मद (विवरण)</span><span>${particulars}</span></div>
      ${extraRows}
      <div class="receipt-row"><span>भुगतान माध्यम</span><span>${record.mode||'—'}</span></div>
      <div class="receipt-amt">जमा राशि: ₹${Number(record.amount).toLocaleString('en-IN')}</div>
      <div class="receipt-sign"><span>अभिभावक हस्ताक्षर</span><span>कोषाध्यक्ष / प्रधानाचार्य हस्ताक्षर</span></div>
    </div>`;
  root.innerHTML = copyHtml('विद्यालय प्रति (School Copy)') + copyHtml('अभिभावक प्रति (Parent Copy)');
  document.body.classList.add('print-receipt-mode');
  const cleanup = ()=>{ document.body.classList.remove('print-receipt-mode'); root.innerHTML=''; window.removeEventListener('afterprint', cleanup); };
  window.addEventListener('afterprint', cleanup);
  setTimeout(()=> window.print(), 50);
}

// Prints a one-page fee statement for a student: roll no., total deposited so far,
// total outstanding (tuition dues + other), and a month-wise / entry-wise breakup —
// this is the "kitna jama, kitna baaki" summary (not a single-payment receipt).
function printFeeStatement(cls, student, cfg, records){
  const root = document.getElementById('receiptPrintRoot');
  if(!root) return;
  const school = db.school || {};

  const dues = records.filter(r=>r.kind==='tuitionDue').sort((a,b)=> a.month<b.month?1:(a.month>b.month?-1:0));
  let tuitionPayable=0, tuitionPaid=0, tuitionOutstanding=0;
  const dueRows = dues.map(due=>{
    const s = tuitionDueStatus(cls, student.id, due);
    tuitionPayable += s.payable; tuitionPaid += s.paid; tuitionOutstanding += s.outstanding;
    const badgeText = s.status==='paid'?'भुगतान पूर्ण':(s.status==='overdue'?`देर — ${s.daysLate} दिन`:'देय');
    let actionText;
    if(s.outstanding>0){
      actionText = `<span style="color:var(--redpen);font-weight:700;">पेंडिंग</span>`;
    } else {
      const monthPayments = records.filter(r=>r.kind==='tuitionPayment' && r.forMonth===due.month).sort((a,b)=> a.date<b.date?1:(a.date>b.date?-1:0));
      actionText = monthPayments.length ? `<span class="mono">${formatDateDMY(monthPayments[0].date)}</span>` : '—';
    }
    return `<tr><td>${monthLabelHindi(due.month)}</td><td class="num mono">₹${Number(due.amount).toLocaleString('en-IN')}</td><td class="num mono">₹${s.fine.toLocaleString('en-IN')}</td><td class="num mono">₹${s.paid.toLocaleString('en-IN')}</td><td class="num mono">₹${s.outstanding.toLocaleString('en-IN')}</td><td>${badgeText}</td><td>${actionText}</td></tr>`;
  }).join('');

  // "अन्य/भुगतान विवरण" now shows ONLY legacy non-tuition, already-paid fee entries
  // (older data recorded before the due/collect flow existed) — tuition-fee payments are
  // already broken out month-wise above, so they're excluded here to avoid repeating them.
  const otherRecords = records.filter(r=>r.kind==='other');
  const otherOnlyTotal = otherRecords.reduce((s,r)=> s+(Number(r.amount)||0), 0);
  const otherRows = otherRecords.slice().sort((a,b)=> a.date<b.date?1:(a.date>b.date?-1:0)).map(r=>{
    return `<tr><td class="mono">${formatDateDMY(r.date)}</td><td>${r.particulars}</td><td>${r.mode||'—'}</td><td class="mono">${r.receiptNo||'—'}</td><td class="num mono">₹${Number(r.amount).toLocaleString('en-IN')}</td></tr>`;
  }).join('');

  // Other one-off CHARGES (admission/exam/transport/etc.) — these show due/paid status,
  // same as tuition dues, since they may not be fully collected yet.
  const charges = records.filter(r=>r.kind==='otherCharge');
  let chargePayable=0, chargePaid=0, chargeOutstanding=0;
  const chargeRows = charges.slice().sort((a,b)=> a.date<b.date?1:(a.date>b.date?-1:0)).map(ch=>{
    const s = otherChargeStatus(cls, student.id, ch);
    chargePayable += s.payable; chargePaid += s.paid; chargeOutstanding += s.outstanding;
    const badgeText = s.status==='paid' ? 'भुगतान पूर्ण' : 'देय';
    let actionText;
    if(s.outstanding>0){
      actionText = `<span style="color:var(--redpen);font-weight:700;">पेंडिंग</span>`;
    } else {
      const chargePayments = records.filter(r=>r.kind==='otherPayment' && r.forChargeId===ch.id).sort((a,b)=> a.date<b.date?1:(a.date>b.date?-1:0));
      actionText = chargePayments.length ? `<span class="mono">${formatDateDMY(chargePayments[0].date)}</span>` : '—';
    }
    return `<tr><td class="mono">${formatDateDMY(ch.date)}</td><td>${ch.particulars}</td><td class="num mono">₹${Number(ch.amount).toLocaleString('en-IN')}</td><td class="num mono">₹${s.paid.toLocaleString('en-IN')}</td><td class="num mono">₹${s.outstanding.toLocaleString('en-IN')}</td><td>${badgeText}</td><td>${actionText}</td></tr>`;
  }).join('');

  const grandPaid = tuitionPaid + otherOnlyTotal + chargePaid;
  const grandOutstanding = tuitionOutstanding + chargeOutstanding;

  const html = `
    <div class="receipt-copy" style="width:190mm;">
      <div class="receipt-tag">फीस विवरण (Fee Statement)</div>
      <div class="receipt-head">
        ${school.logo?`<img src="${school.logo}">`:''}
        <div><div class="rname">${school.name||''}</div><div class="raddr">${school.address||''}${school.session?' · सत्र '+school.session:''}</div></div>
      </div>
      <div class="receipt-row"><span>दिनांक</span><span class="mono">${formatDateDMY(todayStr())}</span></div>
      <div class="receipt-row"><span>छात्र का नाम</span><span>${student.name}</span></div>
      <div class="receipt-row"><span>कक्षा / रोल नं.</span><span>${cls} / ${student.roll}</span></div>
      ${cfg && cfg.monthly ? `<div class="receipt-row"><span>मासिक ट्यूशन फीस</span><span class="mono">₹${Number(cfg.monthly).toLocaleString('en-IN')}</span></div>` : ''}
      <div class="receipt-row"><span>कुल जमा राशि (अब तक)</span><span class="mono">₹${grandPaid.toLocaleString('en-IN')}</span></div>
      <div class="receipt-row"><span>कुल बकाया राशि</span><span class="mono" style="${grandOutstanding>0?'color:var(--redpen);font-weight:700;':''}">₹${grandOutstanding.toLocaleString('en-IN')}</span></div>

      ${dues.length ? `<h4 style="margin:14px 0 4px;font-family:'Noto Serif Devanagari',serif;color:var(--chalk);font-size:.92rem;">ट्यूशन फीस — माहवार विवरण</h4>
      <table style="width:100%;border-collapse:collapse;font-size:.78rem;"><thead><tr><th style="text-align:left;border-bottom:1px solid var(--line);padding:4px;">माह</th><th style="border-bottom:1px solid var(--line);padding:4px;">फीस</th><th style="border-bottom:1px solid var(--line);padding:4px;">फाइन</th><th style="border-bottom:1px solid var(--line);padding:4px;">जमा</th><th style="border-bottom:1px solid var(--line);padding:4px;">बकाया</th><th style="text-align:left;border-bottom:1px solid var(--line);padding:4px;">स्थिति</th><th style="text-align:left;border-bottom:1px solid var(--line);padding:4px;">कार्रवाई</th></tr></thead><tbody>${dueRows}</tbody></table>` : ''}

      ${charges.length ? `<h4 style="margin:14px 0 4px;font-family:'Noto Serif Devanagari',serif;color:var(--chalk);font-size:.92rem;">अन्य फीस (प्रवेश, परीक्षा, परिवहन आदि)</h4>
      <table style="width:100%;border-collapse:collapse;font-size:.78rem;"><thead><tr><th style="text-align:left;border-bottom:1px solid var(--line);padding:4px;">दिनांक</th><th style="text-align:left;border-bottom:1px solid var(--line);padding:4px;">मद</th><th style="border-bottom:1px solid var(--line);padding:4px;">राशि</th><th style="border-bottom:1px solid var(--line);padding:4px;">जमा</th><th style="border-bottom:1px solid var(--line);padding:4px;">बकाया</th><th style="text-align:left;border-bottom:1px solid var(--line);padding:4px;">स्थिति</th><th style="text-align:left;border-bottom:1px solid var(--line);padding:4px;">कार्रवाई</th></tr></thead><tbody>${chargeRows}</tbody></table>` : ''}

      ${otherRecords.length ? `<h4 style="margin:14px 0 4px;font-family:'Noto Serif Devanagari',serif;color:var(--chalk);font-size:.92rem;">अन्य पुराने भुगतान</h4>
      <table style="width:100%;border-collapse:collapse;font-size:.78rem;"><thead><tr><th style="text-align:left;border-bottom:1px solid var(--line);padding:4px;">दिनांक</th><th style="text-align:left;border-bottom:1px solid var(--line);padding:4px;">मद</th><th style="text-align:left;border-bottom:1px solid var(--line);padding:4px;">माध्यम</th><th style="text-align:left;border-bottom:1px solid var(--line);padding:4px;">रसीद नं.</th><th style="border-bottom:1px solid var(--line);padding:4px;">राशि</th></tr></thead><tbody>${otherRows}</tbody></table>` : ''}

      <div class="receipt-sign"><span>अभिभावक हस्ताक्षर</span><span>कोषाध्यक्ष / प्रधानाचार्य हस्ताक्षर</span></div>

  document.body.classList.add('print-receipt-mode');

function renderFees(){
  const classNames = Object.keys(db.classes);
  if(!ui.feeAdmin) ui.feeAdmin = {cls: classNames[0]||null, sid:null, mode:'student', collectMonth:null};
  const st = ui.feeAdmin;
  if(st.cls===null || !classNames.includes(st.cls)) st.cls = classNames[0]||null;

  const wrap = el(`<div class="page"><div class="punch"></div>

    <div class="row no-print" style="align-items:flex-end;">
      <div class="field" style="flex:0;min-width:160px;"><label>कक्षा</label>

      </div>
      <div class="field" style="flex:0;"><button class="tab-btn ${st.mode==='student'?'active':''}" id="feeModeStudent" type="button">छात्र फीस</button></div>
      <div class="field" style="flex:0;"><button class="tab-btn ${st.mode==='summary'?'active':''}" id="feeModeSummary" type="button">कक्षा सारांश</button></div>
      <div class="field" style="flex:0;"><button class="tab-btn ${st.mode==='range'?'active':''}" id="feeModeRange" type="button">तारीख अनुसार रिपोर्ट</button></div>
    </div>
    <div id="feeBody" style="margin-top:12px;"></div>
  </div>`);

  const body = wrap.querySelector('#feeBody');
  if(classNames.length===0){
    body.appendChild(el(`<div class="empty">अभी कोई कक्षा नहीं बनी है — पहले "कक्षा व छात्र" में जाकर कक्षा बनाएं</div>`));
    return wrap;
  }

  wrap.querySelector('#feeClsSel').onchange = (e)=>{ st.cls = e.target.value; st.sid = null; render(); };
  wrap.querySelector('#feeModeStudent').onclick = ()=>{ st.mode='student'; render(); };
  wrap.querySelector('#feeModeSummary').onclick = ()=>{ st.mode='summary'; render(); };
  wrap.querySelector('#feeModeRange').onclick = ()=>{ st.mode='range'; render(); };

  if(st.mode==='summary') body.appendChild(renderFeeClassSummary(st.cls, st));
  else if(st.mode==='range') body.appendChild(renderFeeDateRangeReport(st));
  else body.appendChild(renderFeeStudentView(st.cls, st));
  return wrap;
}

// ---------- FEE: date-range collection report (poori school, kisi bhi date se kisi bhi date tak) ----------
function renderFeeDateRangeReport(st){
  if(!st.rangeFrom) st.rangeFrom = todayStr().slice(0,8)+'01'; // is mahine ki 1 tareekh
  if(!st.rangeTo) st.rangeTo = todayStr();

  const box = el(`<div>
    <div class="row no-print" style="align-items:flex-end;">
      <div class="field" style="flex:0;min-width:160px;"><label>तारीख से (From)</label><input type="date" id="rangeFrom" value="${st.rangeFrom}"></div>
      <div class="field" style="flex:0;min-width:160px;"><label>तारीख तक (To)</label><input type="date" id="rangeTo" value="${st.rangeTo}"></div>
      <div class="field" style="flex:0;min-width:160px;"><label>कक्षा (वैकल्पिक)</label>
        <select id="rangeCls"><option value="">— सभी कक्षाएँ —</option>${Object.keys(db.classes).map(c=>`<option value="${c}" ${st.rangeCls===c?'selected':''}>${c}</option>`).join('')}</select>
      </div>
      <div class="field" style="flex:0;"><button class="ghost" id="rangePrintBtn" type="button">🖨️ रिपोर्ट प्रिंट करें</button></div>
    </div>
    <div id="rangeResult" style="margin-top:14px;"></div>
  </div>`);

  box.querySelector('#rangeFrom').onchange = (e)=>{ st.rangeFrom = e.target.value; render(); };
  box.querySelector('#rangeTo').onchange = (e)=>{ st.rangeTo = e.target.value; render(); };
  box.querySelector('#rangeCls').onchange = (e)=>{ st.rangeCls = e.target.value||null; render(); };

  const from = st.rangeFrom, to = st.rangeTo;
  const resultHost = box.querySelector('#rangeResult');

  if(from && to && from > to){
    resultHost.appendChild(el(`<div class="empty">"तारीख से" वाली तारीख "तारीख तक" वाली तारीख से पहले होनी चाहिए</div>`));
    return box;
  }

  // Saari classes/students ke fee records me se date-range ke andar wali payments chunna
  const classNames = st.rangeCls ? [st.rangeCls] : Object.keys(db.classes);
  const rows = [];
  let grandTotal = 0;
  classNames.forEach(cls=>{
    const students = (db.classes[cls] && db.classes[cls].students) || [];
    students.forEach(s=>{
      const records = (db.fees[cls] && db.fees[cls][s.id]) || [];
      records.filter(r=> (r.kind==='other' || r.kind==='tuitionPayment' || r.kind==='otherPayment') && r.date && (!from || r.date>=from) && (!to || r.date<=to))
        .forEach(r=>{
          const amt = Number(r.amount)||0;
          grandTotal += amt;
          rows.push({date:r.date, cls, roll:s.roll, name:s.name, amt, note: r.note || r.month || r.label || ''});
        });
    });
  });
  rows.sort((a,b)=> a.date===b.date ? 0 : (a.date<b.date?-1:1));

  resultHost.appendChild(el(`<p style="margin:0 0 10px;font-size:.92rem;"><b>${formatDateDMY(from)} से ${formatDateDMY(to)} तक कुल जमा फीस: <span class="mono" style="color:var(--pine);font-size:1.15em;">₹${grandTotal.toLocaleString('en-IN')}</span></b> · कुल भुगतान: ${rows.length}</p>`));

  if(rows.length===0){
    resultHost.appendChild(el(`<div class="empty">इस अवधि में कोई फीस जमा नहीं हुई</div>`));
  } else {
    const table = el(`<table><thead><tr><th>दिनांक</th><th>कक्षा</th><th>रोल नं.</th><th>छात्र का नाम</th><th class="num">राशि</th></tr></thead><tbody></tbody></table>`);
    const tbody = table.querySelector('tbody');
    rows.forEach(r=>{
      tbody.appendChild(el(`<tr><td class="mono">${formatDateDMY(r.date)}</td><td>${r.cls}</td><td class="mono">${r.roll}</td><td>${r.name}</td><td class="num mono">₹${r.amt.toLocaleString('en-IN')}</td></tr>`));
    });
    resultHost.appendChild(table);
  }

  box.querySelector('#rangePrintBtn').onclick = ()=> printFeeDateRangeReport(from, to, st.rangeCls, rows, grandTotal);
  return box;
}

      <div class="receipt-sign"><span>तैयार किया</span><span>कोषाध्यक्ष / प्रधानाचार्य हस्ताक्षर</span></div>
    </div>`;

  root.innerHTML = html;
  document.body.classList.add('print-receipt-mode');
  const cleanup = ()=>{ document.body.classList.remove('print-receipt-mode'); root.innerHTML=''; window.removeEventListener('afterprint', cleanup); };

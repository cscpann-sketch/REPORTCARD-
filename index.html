    <div id="repHost"></div></div>`);

  const classSel = wrap.querySelector('#repClass');
  const examSel = wrap.querySelector('#repExam');
  const langSel = wrap.querySelector('#repLang');
  const sessionInp = wrap.querySelector('#repSession');
  Object.keys(db.classes).forEach(c=> classSel.appendChild(el(`<option value="${c}">${c}</option>`)));
  db.exams.forEach(ex=> examSel.appendChild(el(`<option value="${ex}">${ex}</option>`)));
  examSel.appendChild(el(`<option value="__all__">— सभी परीक्षाएँ + वार्षिक परिणाम (एक साथ) —</option>`));
  wrap.querySelector('#printBtn').onclick = ()=> window.print();

  // ---- table colour/design customization ----
  const repHost = wrap.querySelector('#repHost');
  const RTS_DEFAULTS = {headerBg:'#173A63', headerText:'#FFFFFF', borderColor:'#2C517F', altRowColor:'#F6F8FB', totalRowColor:'#E7ECF6', totalRowTextColor:'#21281F', schoolNameColor:'#2F5D50', schoolAddrColor:'#6B6456'};
  const rtsInputs = {
    headerBg: wrap.querySelector('#rtsHeaderBg'), headerText: wrap.querySelector('#rtsHeaderText'),
    borderColor: wrap.querySelector('#rtsBorder'), altRowColor: wrap.querySelector('#rtsAltRow'),
    totalRowColor: wrap.querySelector('#rtsTotalRow'), totalRowTextColor: wrap.querySelector('#rtsTotalText'),
    schoolNameColor: wrap.querySelector('#rtsNameColor'), schoolAddrColor: wrap.querySelector('#rtsAddrColor')
  };
  function applyTableStyle(){
    const transparent = !!db.reportTableStyle.transparentRows;
    const showBorder = db.reportTableStyle.showBorder !== false;
    repHost.style.setProperty('--rc-th-bg', transparent ? 'transparent' : db.reportTableStyle.headerBg);
    repHost.style.setProperty('--rc-th-text', db.reportTableStyle.headerText);
    repHost.style.setProperty('--rc-border', db.reportTableStyle.borderColor);
    repHost.style.setProperty('--rc-cell-border', db.reportTableStyle.borderColor);
    repHost.style.setProperty('--rc-alt-row', transparent ? 'transparent' : db.reportTableStyle.altRowColor);
    repHost.style.setProperty('--rc-total-row', transparent ? 'transparent' : db.reportTableStyle.totalRowColor);
    repHost.style.setProperty('--rc-total-text', db.reportTableStyle.totalRowTextColor);
    repHost.style.setProperty('--rc-name-color', db.reportTableStyle.schoolNameColor);
    repHost.style.setProperty('--rc-addr-color', db.reportTableStyle.schoolAddrColor);
    repHost.style.setProperty('--rc-border-w', showBorder ? '1px' : '0px');
    repHost.style.setProperty('--rc-total-border-w', showBorder ? '2px' : '0px');
    [rtsInputs.headerBg, rtsInputs.altRowColor, rtsInputs.totalRowColor].forEach(inp=>{ inp.disabled = transparent; });
    rtsInputs.borderColor.disabled = !showBorder;
  }
  applyTableStyle();
  Object.entries(rtsInputs).forEach(([key, inp])=>{
    inp.addEventListener('input', ()=>{
      db.reportTableStyle[key] = inp.value;
      applyTableStyle();
    });
    inp.addEventListener('change', async ()=>{ await saveDB(); });
  });
  wrap.querySelector('#rtsTransparent').addEventListener('change', async (e)=>{
    db.reportTableStyle.transparentRows = e.target.checked;
    applyTableStyle();
    await saveDB();
  });
  wrap.querySelector('#rtsShowBorder').addEventListener('change', async (e)=>{
    db.reportTableStyle.showBorder = e.target.checked;
    applyTableStyle();
    await saveDB();
  });
  wrap.querySelector('#rtsResetBtn').onclick = async ()=>{
    db.reportTableStyle = {...RTS_DEFAULTS, transparentRows:false, showBorder:true};
    Object.entries(rtsInputs).forEach(([key, inp])=>{ inp.value = db.reportTableStyle[key]; });
    wrap.querySelector('#rtsTransparent').checked = false;
    wrap.querySelector('#rtsShowBorder').checked = true;
    applyTableStyle();
    await saveDB();
  };
  wrap.querySelector('#repBgImage').addEventListener('change', async (e)=>{
    const file = e.target.files && e.target.files[0];
    if(!file) return;
    try{
      const dataUrl = await readBackgroundImage(file);
      db.reportBgImage = dataUrl;
      await saveDB();
      render();
    }catch(err){ console.error('background image processing failed', err); }
  });
  const repBgRemoveBtn = wrap.querySelector('#repBgRemove');
  if(repBgRemoveBtn){
    repBgRemoveBtn.onclick = async ()=>{
      delete db.reportBgImage;
      await saveDB();
      render();
    };
  }
  wrap.querySelector('#pdfBtn').onclick = async ()=>{
    const host = wrap.querySelector('#repHost');
    if(!host.querySelector('.report-card')){ alert('कोई रिपोर्ट कार्ड उपलब्ध नहीं है'); return; }
    const btn = wrap.querySelector('#pdfBtn');
    const origText = btn.textContent;
    btn.disabled = true; btn.textContent = 'PDF बन रहा है…';
    host.classList.add('pdf-export');
    try{
      const cls = classSel.value, examChoice = examSel.value;
      const examLabel = examChoice==='__all__' ? 'सभी-परीक्षाएँ' : examChoice;
      await html2pdf().set({
        margin:0,
        filename: `report-card-${cls}-${examLabel}.pdf`,
        image:{type:'jpeg', quality:0.98},
        html2canvas:{scale:2, useCORS:true},
        jsPDF:{unit:'mm', format:'a4', orientation:'portrait'},
        pagebreak:{mode:['css','avoid-all']}
      }).from(host).save();
    }catch(e){
      console.error('report card PDF export failed', e);
      alert('PDF बनाने में समस्या आई, कृपया पुनः प्रयास करें');
    } finally {
      host.classList.remove('pdf-export');
      btn.disabled = false; btn.textContent = origText;
    }
  };

  function shortCompLabel(name){
    if(name===MAIN_KEY) return name;
    const m = name.match(/^(.*?)\s*\(/);
    return m ? m[1].trim() : name;
  }
  function subjectTableRows(exam, cls, subjects, sid){
    return subjects.map((sub,i)=>{
      const r = subjectResult(exam, cls, sub.subject, sub.components, sid);
      let breakup = '';
      if(sub.components.length > 1){
        breakup = `<div class="comp-breakup">${sub.components.map(c=>{
          const v = componentValue(exam, cls, sub.subject, c.name, sid);
          const shown = (v!==undefined && v!==null && v!=='') ? v : '—';
          return `${shortCompLabel(c.name)}: ${shown}`;
        }).join(' · ')}</div>`;
      }
      return `<tr><td class="rc-subj-cell">${sub.subject}${breakup}</td><td class="mono">${r.any? r.obtained : '—'}</td><td class="mono">${r.any? r.max : '—'}</td></tr>`;
    }).join('');
  }
  function subjectConfiguredMax(sub, exam){
    return sub.components.reduce((s,c)=> s + compMax(c, exam), 0);
  }
  // Each exam column gets its own max-marks label now (तिमाही का पूर्णांक अलग, अर्धवार्षिक/वार्षिक का अलग हो सकता है)
  function examHeaderMax(subjects, exam){
    if(subjects.length===0) return null;
    const first = subjectConfiguredMax(subjects[0], exam);
    const allSame = subjects.every(sub=> subjectConfiguredMax(sub, exam)===first);
    return allSame ? first : null;
  }
  function combinedTableHTML(cls, subjects, sid, exams, lang){
    const L = RC_LABELS[lang];
    const examCols = exams.map(ex=>{
      const headerMax = examHeaderMax(subjects, ex);
      return `<th>${examLabel(ex, lang)}${headerMax!=null? `<span class="rc-maxline">(${L.maxFull}: ${headerMax})</span>` : ''}</th>`;
    }).join('');
    const bodyRows = subjects.map((sub,i)=>{
      const cells = exams.map(ex=>{
        const r = subjectResult(ex, cls, sub.subject, sub.components, sid);
        return `<td class="mono">${r.any? r.obtained : '—'}</td>`;
      }).join('');
      return `<tr><td class="rc-subj-cell">${sub.subject}</td>${cells}</tr>`;
    }).join('');
    const totalCells = exams.map(ex=>{
      let obt=0, max=0;
      subjects.forEach(sub=>{
        const r = subjectResult(ex, cls, sub.subject, sub.components, sid);
        if(r.any) obt += r.obtained;
        max += subjectConfiguredMax(sub, ex);
      });
      return `<td class="mono">${max>0? `${obt} / ${max}` : '—'}</td>`;
    }).join('');
    return `<div class="rc-combined-scroll"><table class="rc-combined-table">
      <thead><tr><th class="rc-th-subj">${L.subject}</th>${examCols}</tr></thead>
      <tbody>${bodyRows}<tr class="rc-total-row"><td class="rc-subj-cell">${L.total}</td>${totalCells}</tr></tbody>
    </table></div>`;
  }

  function draw(){
    const cls = classSel.value;
    const examChoice = examSel.value;
    const lang = langSel.value || 'hi';
    const L = RC_LABELS[lang];
    const host = wrap.querySelector('#repHost');
    host.innerHTML='';
    if(!cls){ host.appendChild(el(`<div class="empty">कोई कक्षा उपलब्ध नहीं</div>`)); return; }
    const students = db.classes[cls].students;
    const subjects = subjectsForClass(cls);
    if(students.length===0){ host.appendChild(el(`<div class="empty">इस कक्षा में कोई छात्र नहीं है</div>`)); return; }
    if(subjects.length===0){ host.appendChild(el(`<div class="empty">इस कक्षा के लिए कोई विषय असाइन नहीं है</div>`)); return; }

    const schoolName = (db.school && db.school.name) ? db.school.name : L.defaultSchool;
    const schoolAddr = (db.school && db.school.address) ? db.school.address : '';
    const schoolLogo = (db.school && db.school.logo) ? db.school.logo : '';
    const schoolSession = sessionInp.value.trim();
    students.forEach(s=>{
      const bgStyle = db.reportBgImage ? ` style="background-image:url('${db.reportBgImage}');background-size:cover;background-position:center;background-repeat:no-repeat;"` : '';
      const card = el(`<div class="report-card"${bgStyle}></div>`);
      const inner = el(`<div class="rc-inner"></div>`);
      card.appendChild(inner);
      inner.appendChild(el(`<div class="rc-header">
        ${schoolLogo?`<img class="rc-logo" src="${schoolLogo}">`:''}
        <div class="rc-school-name">${schoolName}</div>
        ${schoolAddr?`<div class="rc-school-addr">${schoolAddr}</div>`:''}
        <div class="rc-title">${L.title}</div>
        ${schoolSession?`<div class="rc-session">${L.session}: ${schoolSession}</div>`:''}
      </div>`));
      inner.appendChild(el(`<div class="rc-student-box">
        <div class="sd-cell"><span class="sd-label">${L.name}</span><span class="sd-value">${s.name}</span></div>
        <div class="sd-cell"><span class="sd-label">${L.father}</span><span class="sd-value">${s.father || s.guardian || '—'}</span></div>
        <div class="sd-cell"><span class="sd-label">${L.dob}</span><span class="sd-value">${s.dob ? formatDateDMY(s.dob) : '—'}</span></div>
        <div class="sd-cell"><span class="sd-label">${L.mother}</span><span class="sd-value">${s.mother || '—'}</span></div>
        <div class="sd-cell"><span class="sd-label">${L.cls}</span><span class="sd-value">${cls}</span></div>
        <div class="sd-cell"><span class="sd-label">${L.roll}</span><span class="sd-value">${s.roll}</span></div>
      </div>`));

      const mySubjects = subjectsForStudent(cls, s);
      if(examChoice==='__all__'){
        let grandObt=0, grandMax=0;
        db.exams.forEach(exam=>{
          mySubjects.forEach(sub=>{
            const r = subjectResult(exam, cls, sub.subject, sub.components, s.id);
            if(r.any){ grandObt+=r.obtained; grandMax+=r.max; }
          });
        });
        inner.appendChild(el(combinedTableHTML(cls, mySubjects, s.id, db.exams, lang)));
        const gpct = grandMax>0 ? (grandObt/grandMax*100) : 0;
        const [ggr, ggrClass] = grade(gpct);
        inner.appendChild(el(`<div class="grand-total-box gtb-standalone">
          <div class="gt-label">${L.annualResult}</div>
          <div class="summary"><div>${L.totalObtained} <b>${grandObt} / ${grandMax}</b></div>
          <div>${L.totalPercentage} <b>${grandMax>0?gpct.toFixed(1):'0.0'}%</b></div>
          <div>${L.finalGrade} <b class="${ggrClass}">${grandMax>0?ggr:'—'}</b></div></div>
        </div>`));
      } else {
        const exam = examChoice;
        let total=0,maxTotal=0;
        mySubjects.forEach(sub=>{
          const r = subjectResult(exam, cls, sub.subject, sub.components, s.id);
          if(r.any){ total+=r.obtained; maxTotal+=r.max; }
        });
        const pct = maxTotal>0 ? (total/maxTotal*100) : 0;
        const [gr, grClass] = grade(pct);
        inner.appendChild(el(`<table class="rc-combined-table"><thead><tr><th class="rc-th-subj">${L.subject}</th><th>${L.obtainedFull}</th><th>${L.maxFull}</th></tr></thead>
          <tbody>${subjectTableRows(exam, cls, mySubjects, s.id)}
          <tr class="rc-total-row"><td class="rc-subj-cell">${L.total}</td><td class="mono">${total}</td><td class="mono">${maxTotal}</td></tr>
          </tbody></table>`));
        inner.appendChild(el(`<div class="grand-total-box gtb-standalone">
          <div class="gt-label">${L.grandTotal}</div>
          <div class="summary"><div>${L.totalMarks} <b>${total} / ${maxTotal}</b></div>
          <div>${L.percentage} <b>${maxTotal>0?pct.toFixed(1):'0.0'}%</b></div>
          <div>${L.grade} <b class="${grClass}">${maxTotal>0?gr:'—'}</b></div></div>
        </div>`));
      }
      inner.appendChild(el(`<div class="rc-signrow">
        <div class="rc-sign"><div class="rc-sign-line"></div><div class="rc-sign-label">${L.parentSign}</div></div>
        <div class="rc-sign"><div class="rc-sign-line"></div><div class="rc-sign-label">${L.teacherSign}</div></div>
        <div class="rc-sign"><div class="rc-sign-line"></div><div class="rc-sign-label">${L.principalSign}</div></div>
      </div>`));
      host.appendChild(card);
    });
    fitReportCardsToPage(host);
  }
  classSel.onchange = draw; examSel.onchange = draw; langSel.onchange = draw;
  sessionInp.addEventListener('input', ()=>{
    draw();
    db.school.session = sessionInp.value.trim();
    saveDB();
  });
  setTimeout(draw, 0);
  return wrap;
}

    <h2 class="section-title no-print">टी.सी. (स्थानांतरण प्रमाण पत्र)</h2>
    <p class="section-sub no-print">कक्षा व छात्र चुनें, विवरण भरें, सेव करें — फिर प्रिंट या PDF डाउनलोड करें</p>
    <div class="row no-print">
      <div class="field"><label>कक्षा चुनें</label><select id="tcClass"></select></div>
      <div class="field"><label>छात्र चुनें</label><select id="tcStudent"></select></div>

      // one A4 page — that extra sliver was spilling onto a near-blank 2nd page.
      cardEl.style.margin = '0';

      await html2pdf().set({
        margin:0,
        filename: `TC-${(s&&s.name)||'student'}.pdf`,

        html2canvas:{scale:2, useCORS:true},
        jsPDF:{unit:'mm', format:'a4', orientation:'portrait'},
        pagebreak:{mode:['css','avoid-all']}
      }).from(cardEl).save();
      cardEl.style.margin = prevMargin;
      cardEl.style.minHeight = prevMinHeight;
    }catch(e){
      console.error('TC PDF export failed', e);
      alert('PDF बनाने में समस्या आई, कृपया पुनः प्रयास करें');

// ---- Shrink TC school-name font-size until it fits inside the header width ----
// Always measured against the guaranteed PRINT-time width (not the on-screen
// card, which is wider at 210mm) so the name never gets clipped by the
// tc-card border when actually printed / saved as PDF — this matters because
// on many mobile browsers the print stylesheet doesn't reliably finish
// reflowing before window.print() actually starts, so measuring the live
// page's clientWidth at that moment is unsafe. Instead we measure against a
// hidden probe element sized to the exact print target in real px, which is
// deterministic and works the same on every device, every time.
// Top-level (not nested in renderTC) so both the TC builder and the
// beforeprint handler further below can call the exact same logic.
// 154mm = 210mm A4 width − 2×8mm @page margin − 2×16mm .tc-card padding − 2×4mm .tc-header padding
const TC_NAME_PRINT_TARGET_MM = 154;
function fitSchoolNameTC(nameEl){
  if(!nameEl) return;
  const targetPx = TC_NAME_PRINT_TARGET_MM * 96 / 25.4; // CSS spec: 1mm = 96/25.4px, exact & device-independent
  let probe = document.getElementById('__tcNameProbe');
  if(!probe){
    probe = document.createElement('span');
    probe.id = '__tcNameProbe';
    probe.style.cssText = 'position:absolute;left:-9999px;top:-9999px;visibility:hidden;white-space:nowrap;font-family:"Noto Serif Devanagari",serif;font-weight:700;letter-spacing:.5px;';
    document.body.appendChild(probe);
  }
  probe.textContent = nameEl.textContent;
  let size = 1.75; // rem, matches default CSS — starting/ceiling size
  let guard = 0;
  probe.style.fontSize = size + 'rem';
  while(probe.getBoundingClientRect().width > targetPx && size > 0.5 && guard < 80){
    size -= 0.02;
    probe.style.fontSize = size + 'rem';
    guard++;
  }
  nameEl.style.fontSize = size + 'rem';
}

// ---------- ADMIT CARD helpers ----------
function hindiDay(dateStr){
  if(!dateStr) return '—';
  const days = ['रविवार','सोमवार','मंगलवार','बुधवार','गुरुवार','शुक्रवार','शनिवार'];
  const d = new Date(dateStr+'T00:00:00');
  if(isNaN(d)) return '—';
  return days[d.getDay()];
}
function formatDateDMY(dateStr){
  if(!dateStr) return '—';
  const d = new Date(dateStr+'T00:00:00');
  if(isNaN(d)) return '—';
  const dd = String(d.getDate()).padStart(2,'0');
  const mm = String(d.getMonth()+1).padStart(2,'0');
  return `${dd}/${mm}/${d.getFullYear()}`;
}
function formatTime12(t){
  if(!t) return '—';
  const parts = t.split(':');
  const h = parseInt(parts[0],10), m = parseInt(parts[1],10);
  const period = h>=12 ? 'PM':'AM';
  let hh = h%12; if(hh===0) hh=12;
  return `${hh}:${String(m).padStart(2,'0')} ${period}`;
}

        <input type="checkbox" id="acSelectAll" checked> सभी चुनें
      </label>
      <div style="flex:1;"></div>
      <button class="ghost" id="acPrintBtn">चयनित छात्रों के प्रवेश पत्र बनाएं</button>
    </div>`);
    host.appendChild(controls);
    const listBox = el(`<div id="acStuList" style="margin-top:10px;"></div>`);
    host.appendChild(listBox);
    students.forEach(s=>{
      const row = el(`<label class="stu-pick-row">
        <input type="checkbox" class="acStuChk" data-sid="${s.id}" checked>
        <span class="mono roll">${s.roll}</span><span>${s.name}</span>
      </label>`);
      listBox.appendChild(row);
    });
    host.querySelector('#acSelectAll').onchange = (e)=>{
      listBox.querySelectorAll('.acStuChk').forEach(chk=> chk.checked = e.target.checked);
    };
    host.querySelector('#acPrintBtn').onclick = ()=>{
      const selectedIds = Array.from(listBox.querySelectorAll('.acStuChk:checked')).map(c=>c.dataset.sid);
      if(selectedIds.length===0){ alert('कृपया कम से कम एक छात्र चुनें'); return; }
      ui.admitPrintView = {cls, exam, ids: selectedIds, lang: langSel.value || 'hi'};
      render();
    };
  }

  classSel.onchange = ()=>{ drawSchedule(); drawStudents(); };
  examSel.onchange = ()=>{ drawSchedule(); drawStudents(); };
  setTimeout(()=>{ drawSchedule(); drawStudents(); }, 0);
  return wrap;
}

// Builds the admit-card watermark SVG. Covers the full A4 page (210mm x 297mm, used
// here as viewBox units) so it works as a true full-page watermark, not just a small
// centered patch. `settings` = {style, color, opacity, text}. `uid` must be unique per
// card instance (e.g. student id) so multiple admit cards printed together never share
// SVG element ids — shared ids across repeated <svg> blocks is what caused the
// watermark to silently fail to render/print correctly before.
function buildWatermarkSVG(schoolName, settings, uid){
  settings = settings || {};
  const name = ((settings.text && settings.text.trim()) || schoolName || 'विद्यालय').trim();
  const color = settings.color || '#2F5D50';
  const baseOpacity = (settings.opacity!=null) ? settings.opacity : 0.14;
  const style = settings.style || 'rings';
  const density = Math.min(10, Math.max(1, settings.density!=null ? settings.density : 6));
  const thickness = settings.thickness || 'normal';
  const sizeMult = (settings.fontSize!=null ? settings.fontSize : 100)/100; // text size scale (50%–200%)
  const idp = 'wm' + String(uid).replace(/[^a-zA-Z0-9]/g,'') + '_';

  // Thickness → font-weight (only 500/700 are actually loaded for this font, so
  // "bold" is reinforced with an SVG stroke around the glyphs — this is what makes
  // the watermark visibly thicker/thinner in both screen and print reliably).
  const thicknessMap = {
    thin:   {weight:500, stroke:0.05},
    normal: {weight:700, stroke:0.30},
    bold:   {weight:700, stroke:0.85}
  };
  const tk = thicknessMap[thickness] || thicknessMap.normal;
  const strokeAttr = tk.stroke>0 ? `stroke="${color}" stroke-width="${tk.stroke}"` : '';

  // Density → how tightly the pattern repeats/how many rings or turns it has.
  // 1 = बहुत विरल (sparse), 5 = बहुत घना (dense).
  // density is now 1–10 (doubled range/resolution). t=0 → sparsest, t=1 → densest —
  // and the densest end is calibrated roughly 2x tighter than the old 1–5 scale.
  const dt = (density-1)/9;
  const spacingMult = 1.6 - dt*1.3;   // 1→1.6 (wide gaps), 10→0.3 (very tight/dense)
  const ringCount = 4 + Math.round(dt*14); // 1→4 rings, 10→18 rings
  const spiralTurns = 2 + dt*10;       // 1→2, 10→12 turns

  const W = 210, H = 297, cx = W/2, cy = H/2;
  const cornerR = Math.sqrt(cx*cx + cy*cy); // ≈182mm
  const FONT = "'Noto Serif Devanagari',serif";

  function ringsStyle(){
    let defs = '', texts = '';
    for(let i=0;i<ringCount;i++){
      const t = i/(ringCount-1);
      const r = 14 + t*(cornerR-14);
      const size = (6 + t*11)*sizeMult;
      const op = baseOpacity * (1 - t*0.45);
      const id = `${idp}r${i}`;
      defs += `<path id="${id}" d="M ${cx-r},${cy} a ${r},${r} 0 1,1 ${r*2},0 a ${r},${r} 0 1,1 -${r*2},0" fill="none"/>`;
      const circumference = 2*Math.PI*r;
      const approxCharWidth = size*0.6;
      const unit = name + '   •   ';
      const oneRepeatLen = unit.length * approxCharWidth;
      const repeats = Math.max(2, Math.round(circumference / oneRepeatLen));
      const repeatedText = Array(repeats).fill(name).join('   •   ') + '   •   ';
      texts += `<text style="font-size:${size}px;font-family:${FONT};font-weight:${tk.weight};letter-spacing:1px;" fill="${color}" fill-opacity="${op.toFixed(3)}" ${strokeAttr} stroke-opacity="${(op*0.9).toFixed(3)}">
        <textPath href="#${id}" startOffset="0">${repeatedText}</textPath>
      </text>`;
    }
    return `<defs>${defs}</defs>${texts}`;
  }

  function spiralStyle(){
    const maxTheta = spiralTurns * 2 * Math.PI;
    const a = 6;
    const b = (cornerR - a) / maxTheta;
    const pts = [];
    const steps = 260;
    for(let i=0;i<=steps;i++){
      const theta = (i/steps) * maxTheta;
      const r = a + b*theta;
      pts.push(`${(cx + r*Math.cos(theta)).toFixed(2)},${(cy + r*Math.sin(theta)).toFixed(2)}`);
    }
    const id = `${idp}spiral`;
    const pathD = 'M ' + pts.join(' L ');
    const segCount = 4 + density; // denser = more growing text segments along the spiral
    let texts = '';
    for(let i=0;i<segCount;i++){
      const t = i/(segCount-1);
      const offsetPct = (2 + t*88).toFixed(1) + '%';
      const size = (6 + t*8)*sizeMult;
      const op = baseOpacity * (1 - i*(0.5/segCount));
      texts += `<text style="font-size:${size}px;font-family:${FONT};font-weight:${tk.weight};letter-spacing:1px;" fill="${color}" fill-opacity="${Math.max(op,0.03).toFixed(3)}" ${strokeAttr} stroke-opacity="${Math.max(op*0.9,0.03).toFixed(3)}">
        <textPath href="#${id}" startOffset="${offsetPct}">${(name+'   •   ').repeat(6)}</textPath>
      </text>`;
    }
    return `<defs><path id="${id}" d="${pathD}" fill="none"/></defs>${texts}`;
  }

  function singleStyle(){
    const size = 22*sizeMult;
    return `<g transform="rotate(-32 ${cx} ${cy})">
      <text x="${cx}" y="${cy}" text-anchor="middle" dominant-baseline="middle"
        style="font-size:${size}px;font-family:${FONT};font-weight:${tk.weight};letter-spacing:2px;"
        fill="${color}" fill-opacity="${baseOpacity}" ${strokeAttr} stroke-opacity="${baseOpacity*0.9}">${name}</text>
    </g>`;
  }

  function diagonalStyle(){
    const stepX = 60*spacingMult, stepY = 50*spacingMult, size = 9*sizeMult;
    let texts = '';
    for(let y=-stepY; y<=H+stepY; y+=stepY){
      for(let x=-stepX; x<=W+stepX; x+=stepX){
        texts += `<text x="${x}" y="${y}" transform="rotate(-30 ${x} ${y})" text-anchor="middle"
          style="font-size:${size}px;font-family:${FONT};font-weight:${tk.weight};letter-spacing:.5px;"
          fill="${color}" fill-opacity="${baseOpacity}" ${strokeAttr} stroke-opacity="${baseOpacity*0.9}">${name}</text>`;
      }
    }
    return texts;
  }

  function gridStyle(){
    const stepX = 55*spacingMult, stepY = 40*spacingMult, size = 8.5*sizeMult;
    let texts = '';
    for(let y=stepY/2; y<=H; y+=stepY){
      for(let x=stepX/2; x<=W; x+=stepX){
        texts += `<text x="${x}" y="${y}" text-anchor="middle"
          style="font-size:${size}px;font-family:${FONT};font-weight:${tk.weight};letter-spacing:.5px;"
          fill="${color}" fill-opacity="${baseOpacity}" ${strokeAttr} stroke-opacity="${baseOpacity*0.9}">${name}</text>`;
      }
    }
    return texts;
  }

  // सीधी क्षैतिज पंक्तियाँ — no rotation, one continuous repeated line of text
  // across the full width of the page, stacked in rows top to bottom.
  function horizontalStyle(){
    const stepY = 34*spacingMult, size = 9.5*sizeMult;
    const approxCharWidth = size*0.6;
    const unit = name + '   •   ';
    const repeats = Math.max(3, Math.ceil((W+2*unit.length*approxCharWidth) / (unit.length*approxCharWidth)));
    const line = Array(repeats).fill(name).join('   •   ') + '   •   ';
    let texts = '';
    for(let y=stepY/2; y<=H; y+=stepY){
      texts += `<text x="${-unit.length*approxCharWidth}" y="${y}"
        style="font-size:${size}px;font-family:${FONT};font-weight:${tk.weight};letter-spacing:.5px;"
        fill="${color}" fill-opacity="${baseOpacity}" ${strokeAttr} stroke-opacity="${baseOpacity*0.9}">${line}</text>`;
    }
    return texts;
  }

  // सीधी ऊर्ध्वाधर पट्टियाँ — same idea rotated 90°, running top-to-bottom in columns.
  function verticalStyle(){
    const stepX = 34*spacingMult, size = 9.5*sizeMult;
    const approxCharWidth = size*0.6;
    const unit = name + '   •   ';
    const repeats = Math.max(3, Math.ceil((H+2*unit.length*approxCharWidth) / (unit.length*approxCharWidth)));
    const line = Array(repeats).fill(name).join('   •   ') + '   •   ';
    let texts = '';
    for(let x=stepX/2; x<=W; x+=stepX){
      texts += `<text x="${x}" y="${-unit.length*approxCharWidth}" transform="rotate(90 ${x} 0)"
        style="font-size:${size}px;font-family:${FONT};font-weight:${tk.weight};letter-spacing:.5px;"
        fill="${color}" fill-opacity="${baseOpacity}" ${strokeAttr} stroke-opacity="${baseOpacity*0.9}">${line}</text>`;
    }
    return texts;
  }

  let inner;
  switch(style){
    case 'spiral': inner = spiralStyle(); break;
    case 'single': inner = singleStyle(); break;
    case 'diagonal': inner = diagonalStyle(); break;
    case 'grid': inner = gridStyle(); break;
    case 'horizontal': inner = horizontalStyle(); break;
    case 'vertical': inner = verticalStyle(); break;
    case 'rings':
    default: inner = ringsStyle(); break;
  }

  return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">${inner}</svg>`;
}

    const inner = el(`<div class="ac-inner"></div>`);
    card.appendChild(inner);
    inner.appendChild(el(`<div class="ac-header">
      <div class="ac-school-name">${schoolName}</div>
      ${schoolAddr?`<div class="ac-school-addr">${schoolAddr}</div>`:''}
      <div class="ac-admit-title">${L.admitTitle}</div>
      <div class="ac-exam-sub">${examLabel(exam, lang)}</div>

    inner.appendChild(el(`<div class="ac-main">
      <div class="ac-photo">${s.photo ? `<img src="${s.photo}">` : L.studentPhoto}</div>
      <div class="ac-details">
        <div class="sd-cell"><span class="sd-label">${L.name}</span><span class="sd-value">${s.name}</span></div>
        <div class="sd-cell"><span class="sd-label">${L.father}</span><span class="sd-value">${s.father || s.guardian || L.na}</span></div>
        <div class="sd-cell"><span class="sd-label">${L.dob}</span><span class="sd-value">${s.dob ? formatDateDMY(s.dob) : L.na}</span></div>

        <div class="sd-cell"><span class="sd-label">${L.cls}</span><span class="sd-value">${cls}</span></div>
        <div class="sd-cell"><span class="sd-label">${L.roll}</span><span class="sd-value">${s.roll}</span></div>
        <div class="sd-cell"><span class="sd-label">${L.room}</span><span class="sd-value" style="color:var(--redpen);">${seatMap[s.id]?seatMap[s.id].room:L.na}</span></div>
        <div class="sd-cell"><span class="sd-label">${L.seat}</span><span class="sd-value" style="color:var(--redpen);">${seatMap[s.id]?seatMap[s.id].seatNo:L.na}</span></div>

    const schedRows = sortedSubjects.map((sub,i)=>{

    </div>`));
    wrap.appendChild(card);
  });
  fitAdmitCardsToPage(wrap);
  return wrap;
}

function fitAdmitCardsToPage(host){
  // Shrinks each admit card's content so it always fits on a single A4 page,
  // no matter how many exam subjects, how long the instructions list is, or
  // how long the school name/address is — never spills onto a 2nd sheet and
  // never overlaps/clips at the page boundary during print.
  requestAnimationFrame(()=>{
    host.querySelectorAll('.admit-card').forEach(card=>{
      const inner = card.querySelector('.ac-inner');
      if(!inner) return;
      inner.style.transform = 'scale(1)';
      const availH = card.clientHeight;
      const availW = card.clientWidth;
      const neededH = inner.scrollHeight;
      const neededW = inner.scrollWidth;
      const scaleH = neededH > availH && neededH > 0 ? (availH / neededH) : 1;
      const scaleW = neededW > availW && neededW > 0 ? (availW / neededW) : 1;
      const scale = Math.min(scaleH, scaleW) * 0.99;
      if(scale < 1){
        inner.style.transform = `scale(${Math.max(0.4, scale)})`;
      }
    });
  });
}

function renderTeacherTab(){

    const justSavedMsg = ui.justSavedMsg || null;

    // पूरी हो चुकी परीक्षा को टीचर के पैनल की परीक्षा-सूची (टैब) से हटा दिया जाता है।
    function examFullyDone(ex){
      if(students.length===0) return false;
      return students.every(s=> components.every(c=>{
        const v = componentValue(ex, cls, subject, c.name, s.id);
        return v!==undefined && v!==null && v!=='';
      }));
    }
    const availableExams = db.exams.filter(ex=> !examFullyDone(ex));
    if(!ui.examTab || examFullyDone(ui.examTab)){
      ui.examTab = availableExams[0] || null;
    }
    const exam = ui.examTab;

    if(!exam){
      // इस विषय की सभी परीक्षाओं के अंक भरे जा चुके हैं — अब भरने के लिए कोई परीक्षा शेष नहीं
      const doneWrap = el(`<div class="page"><div class="punch"></div>
        <button class="ghost no-print" id="backBtn" style="margin-bottom:16px;">← वापस मेरी कक्षाओं में</button>
        <h2 class="section-title">${cls} — ${subject}</h2>
        ${justSavedMsg?`<div class="note" style="color:var(--chalk);margin-bottom:10px;">${justSavedMsg}</div>`:''}
        <div class="empty">इस विषय की सभी परीक्षाओं के अंक भर दिए गए हैं। भरने के लिए अभी कोई परीक्षा शेष नहीं है।</div>
      </div>`);
      doneWrap.querySelector('#backBtn').onclick = ()=>{ ui.teacherTab=null; ui.examTab=null; render(); };
      return doneWrap;
    }

    const wrap = el(`<div class="page"><div class="punch"></div>
      <button class="ghost no-print" id="backBtn" style="margin-bottom:16px;">← वापस मेरी कक्षाओं में</button>
      <h2 class="section-title">${cls} — ${subject}</h2>
      <p class="section-sub">परीक्षा चुनें, फिर हर छात्र के अंक भरकर सेव करें (सभी छात्रों के अंक भरते ही वह परीक्षा सूची से अपने-आप हट जाएगी)</p>
      ${justSavedMsg?`<div class="note" style="color:var(--chalk);margin-bottom:10px;">${justSavedMsg}</div>`:''}
      <div class="exam-tabbar no-print" id="examTabbar"></div>
      <div class="note" id="fillSummary" style="display:flex;align-items:center;gap:14px;flex-wrap:wrap;"></div>
      <table><thead><tr><th>रोल नं.</th><th>नाम</th>
        ${components.map(c=>`<th class="num">${c.name===MAIN_KEY?'अंक':c.name} (${compMax(c, exam)})</th>`).join('')}
        ${components.length>1?'<th class="num">कुल</th>':''}
        <th class="num">स्थिति</th>
      </tr></thead><tbody id="markRows"></tbody></table>
      <button class="primary" id="saveMarks" style="margin-top:14px;">अंक सेव करें</button>
      <span id="savedMsg" style="margin-left:10px;color:var(--chalk);font-size:.85rem;"></span>
      <div id="markErr" style="color:var(--redpen);font-size:.85rem;margin-top:8px;"></div>
    </div>`);

    wrap.querySelector('#backBtn').onclick = ()=>{ ui.teacherTab=null; ui.examTab=null; render(); };

    const examTabbar = wrap.querySelector('#examTabbar');
    availableExams.forEach(ex=>{
      const b = el(`<button class="${ex===exam?'active':''}">${ex}</button>`);
      b.onclick = ()=>{ ui.examTab = ex; render(); };
      examTabbar.appendChild(b);
    });

    const rows = wrap.querySelector('#markRows');
    if(students.length===0){
      rows.appendChild(el(`<tr><td colspan="${3+components.length+(components.length>1?1:0)}" style="text-align:center;color:var(--muted);">इस कक्षा में कोई छात्र नहीं है</td></tr>`));
    }
    const summaryBox = wrap.querySelector('#fillSummary');
    function updateSummary(){
      if(students.length===0){ summaryBox.style.display='none'; return; }
      summaryBox.style.display='flex';
      const rowEls = Array.from(rows.querySelectorAll('tr[data-status]'));
      const done = rowEls.filter(r=>r.dataset.status==='done').length;
      const partial = rowEls.filter(r=>r.dataset.status==='partial').length;
      const pending = rowEls.filter(r=>r.dataset.status==='pending').length;
      summaryBox.innerHTML = `<b style="color:var(--chalk);">${done}/${students.length}</b> छात्रों के अंक पूरे भरे`
        + (partial? ` · <b style="color:var(--marigold);">${partial}</b> आंशिक` : '')
        + (pending? ` · <b style="color:var(--redpen);">${pending}</b> बाकी` : '');
    }
    students.forEach(s=>{
      const tr = el(`<tr></tr>`);
      tr.appendChild(el(`<td class="mono">${s.roll}</td>`));
      tr.appendChild(el(`<td>${s.name}</td>`));
      const inputs = [];
      components.forEach(c=>{
        const existing = componentValue(exam, cls, subject, c.name, s.id);
        const td = el(`<td class="num"><input type="number" min="0" max="${compMax(c, exam)}" style="width:80px;text-align:center;" data-comp="${c.name}" data-sid="${s.id}" value="${existing ?? ''}"></td>`);
        inputs.push(td.querySelector('input'));
        tr.appendChild(td);
      });
      let totalCell = null;
      if(components.length>1){
        totalCell = el(`<td class="num mono" data-total-for="${s.id}">—</td>`);
        tr.appendChild(totalCell);
      }
      const statusCell = el(`<td class="num"><span class="type-tag" data-status-badge></span></td>`);
      tr.appendChild(statusCell);
      const badge = statusCell.querySelector('[data-status-badge]');
      function recomputeTotal(){
        let sum=0, any=false;
        inputs.forEach(inp=>{ if(inp.value!==''){ sum+=parseFloat(inp.value)||0; any=true; } });
        if(totalCell) totalCell.textContent = any ? sum : '—';
      }
      function refreshStatus(){
        const filled = inputs.filter(inp=>inp.value.trim()!=='').length;
        let status, label, bg, color;
        if(filled===0){ status='pending'; label='बाकी'; bg='rgba(178,58,50,.12)'; color='var(--redpen)'; }
        else if(filled===inputs.length){ status='done'; label='भरा ✓'; bg='rgba(47,93,80,.14)'; color='var(--chalk)'; }
        else { status='partial'; label='आंशिक'; bg='rgba(217,143,43,.16)'; color='var(--marigold)'; }
        tr.dataset.status = status;
        badge.textContent = label;
        badge.style.background = bg;
        badge.style.color = color;
        updateSummary();
      }
      function validateInput(inp){
        const compMax = parseFloat(inp.max);
        const v = inp.value.trim();
        let bad = false;
        if(v!==''){
          const num = parseFloat(v);
          if(isNaN(num) || num>compMax || num<0) bad = true;
        }
        inp.classList.toggle('mark-invalid', bad);
        return !bad;
      }
      inputs.forEach(inp=> inp.addEventListener('input', ()=>{ recomputeTotal(); validateInput(inp); refreshStatus(); }));
      inputs.forEach(inp=> validateInput(inp));
      recomputeTotal();
      refreshStatus();
      rows.appendChild(tr);
    });
    updateSummary();

    wrap.querySelector('#saveMarks').onclick = async ()=>{
      const errBox = wrap.querySelector('#markErr');
      errBox.textContent = '';
      const allInputs = Array.from(rows.querySelectorAll('input[data-comp]'));
      let firstBad = null;
      const badList = [];
      allInputs.forEach(inp=>{
        const comp = inp.dataset.comp, sid = inp.dataset.sid;
        const thisMax = compMax(components.find(c=>c.name===comp), exam);
        const v = inp.value.trim();
        let bad = false;
        if(v!==''){
          const num = parseFloat(v);
          if(isNaN(num) || num>thisMax || num<0) bad = true;
        }
        inp.classList.toggle('mark-invalid', bad);
        if(bad){
          if(!firstBad) firstBad = inp;
          const tr = inp.closest('tr');
          const rollTd = tr ? tr.querySelector('td.mono') : null;
          badList.push(`रोल ${rollTd?rollTd.textContent:'?'} — ${comp==='मुख्य'?'अंक':comp} (अधिकतम ${compMax})`);
        }
      });
      if(firstBad){
        errBox.textContent = 'ये अंक अधिकतम सीमा से ज़्यादा हैं, कृपया ठीक करें: ' + badList.join('; ');
        firstBad.focus();
        firstBad.scrollIntoView({behavior:'smooth', block:'center'});
        return;
      }
      db.marks[exam] = db.marks[exam] || {};
      db.marks[exam][cls] = db.marks[exam][cls] || {};
      db.marks[exam][cls][subject] = db.marks[exam][cls][subject] || {};
      components.forEach(c=>{
        db.marks[exam][cls][subject][c.name] = db.marks[exam][cls][subject][c.name] || {};
      });
      allInputs.forEach(inp=>{
        const comp = inp.dataset.comp, sid = inp.dataset.sid;
        const v = inp.value.trim();
        if(v===''){ delete db.marks[exam][cls][subject][comp][sid]; }
        else {
          db.marks[exam][cls][subject][comp][sid] = parseFloat(v);
        }
      });
      await saveDB();
      if(examFullyDone(exam)){
        // इस परीक्षा के सभी छात्रों के अंक भर दिए गए — यह परीक्षा अब सूची से हट जाएगी
        ui.examTab = null;
        ui.justSavedMsg = 'सेव हो गया ✓ — सभी छात्रों के अंक भर दिए गए, यह परीक्षा अब सूची से हट गई है';
        render();
        return;
      }
      wrap.querySelector('#savedMsg').textContent = 'सेव हो गया ✓';
      setTimeout(()=>{ const m=wrap.querySelector('#savedMsg'); if(m) m.textContent=''; }, 2000);
    };
    return wrap;
  }

  const wrap = el(`<div class="page"><div class="punch"></div>
    <h2 class="section-title no-print">मेरी कक्षाएँ व विषय</h2>
    <p class="section-sub no-print">जिस कक्षा/विषय पर क्लिक करेंगे, वहाँ परीक्षा चुनकर अंक भर सकते हैं</p>
    <div class="card-grid no-print" id="assignGrid"></div></div>`);

  const grid = wrap.querySelector('#assignGrid');
  if(assigns.length===0){
    grid.appendChild(el(`<div class="empty">आपको अभी कोई कक्षा/विषय असाइन नहीं हुआ है। एडमिन से संपर्क करें।</div>`));
  }
  let visibleCount = 0;
  assigns.forEach(a=>{
    const students = ((db.classes[a.cls]||{}).students||[]);
    const studentCount = students.length;
    const typeLabel = a.components.length===1 ? '' : (a.components[0].name.includes('Practical')||a.components[1] && a.components[1].name.includes('Practical') ? '<span class="type-tag">Theory+Practical</span>' : '<span class="type-tag">दो प्रश्नपत्र</span>');
    let allExamsDone = false;
    // कार्ड में सिर्फ वे परीक्षाएँ दिखाई जाती हैं जो अभी पूरी तरह नहीं भरी गई हैं —
    // जो परीक्षा पूरी हो चुकी है (हरा) उसे इस सूची से हटा दिया जाता है।
    const examStatusLine = studentCount>0 ? db.exams.map(ex=>{
      const done = students.filter(s=> subjectResult(ex, a.cls, a.subject, a.components, s.id).any
        && a.components.every(c=>{ const v=componentValue(ex,a.cls,a.subject,c.name,s.id); return v!==undefined && v!==null && v!==''; })
      ).length;
      if(done===studentCount) return null; // पूरी हो चुकी परीक्षा — मत दिखाओ
      const color = done===0 ? 'var(--redpen)' : 'var(--marigold)';
      return `<span style="color:${color};">${ex}: ${done}/${studentCount}</span>`;
    }).filter(Boolean).join(' · ') : '';
    // इस कक्षा/विषय की हर परीक्षा में हर छात्र के अंक भर चुके हों, तो यह पूरा कार्ड ही
    // टीचर के पैनल से गायब कर दिया जाता है — अब टीचर के पास इसे बदलने का कोई रास्ता नहीं रहता।
    if(studentCount>0 && db.exams.length>0){
      allExamsDone = db.exams.every(ex=>
        students.every(s=> a.components.every(c=>{
          const v = componentValue(ex, a.cls, a.subject, c.name, s.id);
          return v!==undefined && v!==null && v!=='';
        }))
      );
    }
    if(allExamsDone) return; // पूरी तरह भर चुका कार्ड — दिखाना नहीं है
    visibleCount++;
    const card = el(`<div class="assign-card">
      <div class="cls">कक्षा ${a.cls}</div>
      <div class="sub">${a.subject} ${typeLabel}</div>
      <div class="meta">${studentCount} छात्र · घटक: ${a.components.map(c=>c.name===MAIN_KEY?'—':c.name).filter(Boolean).join(', ')||'सामान्य'}</div>
      ${examStatusLine? `<div class="meta" style="margin-top:6px;font-weight:600;">${examStatusLine}</div>` : ''}
    </div>`);
    card.onclick = ()=>{ ui.teacherTab = a; ui.examTab = null; render(); };
    grid.appendChild(card);
  });
  if(assigns.length>0 && visibleCount===0){
    grid.appendChild(el(`<div class="empty">आपकी सभी कक्षाओं/विषयों की सभी परीक्षाओं के अंक भर दिए गए हैं। अभी भरने के लिए कुछ शेष नहीं है।</div>`));
  }
  return wrap;
}

function currentTTDay(){
  const day = new Date().getDay(); // 0=Sun..6=Sat
  return day===0 ? null : TT_DAYS[day-1]; // TT_DAYS = Mon..Sat; Sunday has no timetable day
}
function renderTeacherTimetable(){
  const u = session.username;
  const assigns = db.assignments[u] || [];
  const wrap = el(`<div class="page tt-landscape-print"><div class="punch"></div>
    <div id="myTTBox"></div></div>`);
  const box = wrap.querySelector('#myTTBox');
  const ttHead = el(`<div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;margin-bottom:10px;"></div>`);
  ttHead.appendChild(el(`<h2 class="section-title no-print" style="margin:0;">मेरा टाइम टेबल</h2>`));
  const myTTPrintBtn = el(`<button class="ghost no-print">🖨️ प्रिंट करें</button>`);
  ttHead.appendChild(myTTPrintBtn);
  box.appendChild(ttHead);
  if((db.timetablePeriods||[]).length===0 || assigns.length===0){
    box.appendChild(el(`<div class="empty">अभी आपके लिए कोई टाइम टेबल उपलब्ध नहीं है।</div>`));
    return wrap;
  }

  if(!ui.teacherTT) ui.teacherTT = {mode:'day', day: currentTTDay() || TT_DAYS[0]};
  const st = ui.teacherTT;
  const todayDay = currentTTDay();

  // Day switcher — mobile-app style "today's schedule" toggle: just Today / Full week
  const dayRow = el(`<div class="row no-print" style="gap:6px;margin-bottom:14px;flex-wrap:wrap;"></div>`);
  const todayBtn = el(`<button type="button" class="ghost" style="padding:8px 14px;font-size:.82rem;${st.mode==='day'?'background:var(--chalk);color:#fff;border-color:var(--chalk);':''}">📌 आज</button>`);
  todayBtn.onclick = ()=>{ st.mode='day'; st.day = currentTTDay() || TT_DAYS[0]; render(); };
  dayRow.appendChild(todayBtn);
  const weekBtn = el(`<button type="button" class="ghost" style="padding:8px 14px;font-size:.82rem;${st.mode==='week'?'background:var(--chalk);color:#fff;border-color:var(--chalk);':''}">📅 पूरा सप्ताह</button>`);
  weekBtn.onclick = ()=>{ st.mode='week'; render(); };
  dayRow.appendChild(weekBtn);
  box.appendChild(dayRow);

  myTTPrintBtn.onclick = ()=>{ setPrintOrientation(st.mode==='week'); window.print(); };

  if(st.mode==='day'){
    if(!todayDay && !TT_DAYS.includes(st.day)) st.day = TT_DAYS[0];
    const day = st.day;
    const rows = [];
    let anyRow = false;
    db.timetablePeriods.forEach(p=>{
      if(p.isBreak){ rows.push({period:p, isBreak:true}); return; }
      let text = null;
      Object.keys(db.timetable||{}).forEach(cls=>{
        const cell = (((db.timetable[cls]||{})[day])||{})[p.id];
        if(cell && cell.teacher===u){ text = {subject:cell.subject, cls}; anyRow = true; }
      });
      rows.push({period:p, isBreak:false, entry:text});
    });
    const isToday = day === todayDay;
    const nowD = new Date();
    const nowStr = String(nowD.getHours()).padStart(2,'0')+':'+String(nowD.getMinutes()).padStart(2,'0');
    let nextAssigned = false;
    const listBox = el(`<div style="max-width:520px;"></div>`);
    listBox.appendChild(el(`<h3 style="font-family:'Noto Serif Devanagari',serif;color:var(--chalk);margin:0 0 12px;">${day}${day===todayDay?' — आज':''} का टाइम टेबल</h3>`));
    if(!anyRow){
      listBox.appendChild(el(`<div class="empty">${day} को आपके नाम कोई पीरियड टाइम टेबल में नहीं है।</div>`));
    } else {
      rows.forEach(r=>{
        if(r.isBreak){
          listBox.appendChild(el(`<div style="display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 14px;margin-bottom:8px;background:#F6F3EC;border:1px dashed var(--line);border-radius:8px;">
            <div style="font-size:.85rem;color:var(--muted);">${r.period.label}</div>
            <div class="mono" style="font-size:.78rem;color:var(--muted);">${r.period.start||''} - ${r.period.end||''}</div>
          </div>`));
          return;
        }
        const has = !!r.entry;
        // Highlight today's row by time: बीता हुआ पीरियड (red), अभी चालू (green), अगला पीरियड (yellow)
        let timeState = null;
        if(isToday && r.period.start && r.period.end){
          if(r.period.end <= nowStr) timeState = 'past';
          else if(r.period.start <= nowStr) timeState = 'current';
          else if(!nextAssigned){ timeState = 'next'; nextAssigned = true; }
        }
        const timeColors = {
          past:    {bg:'#FBEAE8', border:'var(--redpen)',  tag:'बीत गया',      tagColor:'var(--redpen)'},
          current: {bg:'#E3F1E9', border:'#1E7A4C',         tag:'अभी चल रहा है', tagColor:'#1E7A4C'},
          next:    {bg:'#FBF3E4', border:'#B2762D',         tag:'अगला',          tagColor:'#B2762D'}
        };
        const tc = timeState ? timeColors[timeState] : null;
        const rowBg = tc ? tc.bg : '#fff';
        const rowBorderColor = tc ? tc.border : (has?'var(--chalk)':'var(--line)');
        listBox.appendChild(el(`<div style="display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 16px;margin-bottom:8px;background:${rowBg};border:1px solid var(--line);border-radius:8px;border-left:4px solid ${rowBorderColor};${(!has && !tc)?'opacity:.55;':''}">
          <div>
            <div style="font-weight:700;color:${has?'var(--chalk)':'var(--muted)'};">${has? r.entry.subject : '— खाली —'}</div>
            ${has?`<div style="font-size:.8rem;color:var(--muted);margin-top:2px;">कक्षा ${r.entry.cls}</div>`:''}
            ${tc?`<div style="font-size:.75rem;font-weight:700;color:${tc.tagColor};margin-top:4px;">${tc.tag}</div>`:''}
          </div>
          <div style="text-align:right;">
            <div style="font-size:.85rem;color:var(--ink);">${r.period.label}</div>
            <div class="mono" style="font-size:.78rem;color:var(--muted);">${r.period.start||''} - ${r.period.end||''}</div>
          </div>
        </div>`));
      });
    }
    box.appendChild(listBox);
    return wrap;
  }

  // ---- week mode: original full-grid view ----
  const table = el(`<table class="tt-grid"><thead><tr><th>पीरियड</th>${TT_DAYS.map(d=>`<th>${d}</th>`).join('')}</tr></thead><tbody></tbody></table>`);
  const tbody = table.querySelector('tbody');
  let anyRow = false;
  db.timetablePeriods.forEach(p=>{
    if(p.isBreak){
      tbody.appendChild(el(`<tr class="tt-breakrow"><td>${p.label}<br><span class="tt-ptime">${p.start||''} - ${p.end||''}</span></td>${TT_DAYS.map(()=>`<td>${p.label}</td>`).join('')}</tr>`));
      return;
    }
    const tds = TT_DAYS.map(d=>{
      let text = '';
      Object.keys(db.timetable||{}).forEach(cls=>{
        const cell = (((db.timetable[cls]||{})[d])||{})[p.id];
        if(cell && cell.teacher===u){ text = `${cell.subject}<br><span class="tt-teacher">कक्षा ${cls}</span>`; anyRow = true; }
      });
      return `<td class="tt-periodcell" style="text-align:center;">${text||'—'}</td>`;
    }).join('');
    tbody.appendChild(el(`<tr><td class="tt-periodcell"><div class="tt-pname">${p.label}</div><div class="tt-ptime">${p.start||''} - ${p.end||''}</div></td>${tds}</tr>`));
  });
  if(anyRow){ box.appendChild(table); }
  else { box.appendChild(el(`<div class="empty">इस सप्ताह आपके नाम कोई पीरियड टाइम टेबल में नहीं है।</div>`)); }
  return wrap;
}

// ---------- ATTENDANCE (helpers shared by teacher + admin) ----------
const MONTH_NAMES_HI = ['जनवरी','फरवरी','मार्च','अप्रैल','मई','जून','जुलाई','अगस्त','सितंबर','अक्टूबर','नवंबर','दिसंबर'];
const SUNDAY_HOLIDAY_LABEL = 'साप्ताहिक अवकाश (रविवार)';
function todayStr(){ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function isSundayDate(dateStr){
  if(!dateStr) return false;
  const [y,m,d] = dateStr.split('-').map(Number);
  if(!y||!m||!d) return false;
  return new Date(y, m-1, d).getDay()===0;
}
// Auto-declares every Sunday in a given class + month as a holiday, unless the
// user has explicitly turned that particular Sunday back into a working day
// (tracked in db.sundayOverride). Mutates db.holidays[cls] in place and
// returns true if it changed anything (so the caller can persist once).
function ensureSundayHolidays(cls, ym){
  if(!db.holidays) db.holidays = {};
  if(!db.holidays[cls]) db.holidays[cls] = {};
  if(!db.sundayOverride) db.sundayOverride = {};
  const overrideSet = db.sundayOverride[cls] || {};
  const holidaySet = db.holidays[cls];
  const [y,m] = ym.split('-').map(Number);
  if(!y||!m) return false;
  const daysInMonth = new Date(y, m, 0).getDate();
  let changed = false;
  for(let d=1; d<=daysInMonth; d++){
    if(new Date(y, m-1, d).getDay()!==0) continue; // only Sundays
    const ds = `${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    if(!holidaySet[ds] && !overrideSet[ds]){
      holidaySet[ds] = SUNDAY_HOLIDAY_LABEL;
      changed = true;
    }
  }
  return changed;
}
// Session-level cache so we don't recompute/re-save the same class+month
// combination on every re-render — only the first time it's needed.
const _sundayEnsuredCache = new Set();
function ensureSundayHolidaysCached(cls, ym){
  if(!cls || !ym) return;
  const key = cls+'|'+ym;
  if(_sundayEnsuredCache.has(key)) return;
  _sundayEnsuredCache.add(key);
  if(ensureSundayHolidays(cls, ym)) saveDB();
}
function attendanceDatesForClassMonth(cls, ym){
  ensureSundayHolidaysCached(cls, ym);
  const holidaySet = (db.holidays && db.holidays[cls]) || {};
  return Object.keys((db.attendance[cls]||{})).filter(d=>d.startsWith(ym) && !holidaySet[d]).sort();
}
function attendanceHolidayCountForMonth(cls, ym){
  ensureSundayHolidaysCached(cls, ym);
  const holidaySet = (db.holidays && db.holidays[cls]) || {};
  return Object.keys(holidaySet).filter(d=>d.startsWith(ym)).length;
}
function attendanceHolidayListForMonth(cls, ym){
  ensureSundayHolidaysCached(cls, ym);
  const holidaySet = (db.holidays && db.holidays[cls]) || {};
  return Object.keys(holidaySet).filter(d=>d.startsWith(ym)).sort()
    .map(d=> ({date:d, reason: holidaySet[d]!==true ? holidaySet[d] : ''}));
}
function attendanceMonthlyStats(cls, ym){
  const dates = attendanceDatesForClassMonth(cls, ym);
  const students = (db.classes[cls]||{}).students||[];
  const stats = students.map(s=>{
    let present=0, absent=0;
    dates.forEach(d=>{
      const rec = (db.attendance[cls][d]||{})[s.id];
      if(rec==='P') present++; else if(rec==='A') absent++;
    });
    return {student:s, present, absent, total: dates.length};
  });
  return {dates, stats};
}
function attendanceHolidayCountForYear(cls, year){
  const months = Array.from({length:12},(_,i)=> `${year}-${String(i+1).padStart(2,'0')}`);
  return months.reduce((sum,ym)=> sum + attendanceHolidayCountForMonth(cls, ym), 0);
}
function attendanceHolidayListForYear(cls, year){
  const months = Array.from({length:12},(_,i)=> `${year}-${String(i+1).padStart(2,'0')}`);
  let list = [];
  months.forEach(ym=>{ list = list.concat(attendanceHolidayListForMonth(cls, ym)); });
  return list.sort((a,b)=> a.date.localeCompare(b.date));
}
function attendanceYearlyStats(cls, year){
  const students = (db.classes[cls]||{}).students||[];
  const months = Array.from({length:12},(_,i)=> String(i+1).padStart(2,'0'));
  return students.map(s=>{
    const row = {student:s, months:{}, totalPresent:0, totalDays:0};
    months.forEach(m=>{
      const ym = `${year}-${m}`;
      const dates = attendanceDatesForClassMonth(cls, ym);
      let present=0;
      dates.forEach(d=>{ if(((db.attendance[cls][d]||{})[s.id])==='P') present++; });
      row.months[m] = {present, total: dates.length};
      row.totalPresent += present; row.totalDays += dates.length;
    });
    return row;
  });
}

// ---------- TEACHER: MARK / VIEW ATTENDANCE (class teacher only) ----------
function renderTeacherAttendance(myClasses){
  if(!ui.attTeacher) ui.attTeacher = {cls: myClasses[0], mode:'mark', date: todayStr(), ym: todayStr().slice(0,7), cursor:0, marks:{}, forFlow:{cls:null,date:null}};
  const st = ui.attTeacher;
  if(!myClasses.includes(st.cls)) st.cls = myClasses[0];
  const cls = st.cls;
  const students = ((db.classes[cls]||{}).students||[]).slice().sort((a,b)=> (parseFloat(a.roll)||0)-(parseFloat(b.roll)||0) || String(a.roll).localeCompare(String(b.roll)));

  const wrap = el(`<div class="page"><div class="punch"></div>
    <div class="row" style="align-items:flex-start;justify-content:space-between;flex-wrap:wrap;">
      <div><h2 class="section-title" style="margin-bottom:2px;">कक्षा उपस्थिति</h2>
      <p class="section-sub" style="margin:0;">कक्षा ${cls} की उपस्थिति यहाँ भरें और मासिक रिपोर्ट देखें</p></div>
    </div>
    <div class="row no-print" style="margin-top:10px;align-items:flex-end;">
      ${myClasses.length>1?`<div class="field" style="flex:0;min-width:140px;"><label>कक्षा</label><select id="attClsSel">${myClasses.map(c=>`<option value="${c}" ${c===cls?'selected':''}>${c}</option>`).join('')}</select></div>`:''}
      <div class="field" style="flex:0;"><button class="ghost" id="attModeMark" style="${st.mode==='mark'?'background:rgba(47,93,80,.1);':''}">उपस्थिति भरें</button></div>
      <div class="field" style="flex:0;"><button class="ghost" id="attModeReport" style="${st.mode==='report'?'background:rgba(47,93,80,.1);':''}">मासिक रिपोर्ट</button></div>
    </div>
    <div id="attBody" style="margin-top:16px;"></div>
  </div>`);

  const clsSel = wrap.querySelector('#attClsSel');
  if(clsSel) clsSel.onchange = ()=>{ st.cls = clsSel.value; render(); };
  wrap.querySelector('#attModeMark').onclick = ()=>{ st.mode='mark'; render(); };
  wrap.querySelector('#attModeReport').onclick = ()=>{ st.mode='report'; render(); };

  const body = wrap.querySelector('#attBody');

  if(st.mode==='mark'){
    if(students.length===0){
      body.appendChild(el(`<div class="empty">इस कक्षा में कोई छात्र नहीं है</div>`));
      return wrap;
    }

    if(!db.holidays[cls]) db.holidays[cls] = {};
    ensureSundayHolidaysCached(cls, st.date.slice(0,7));
    const holidaySet = db.holidays[cls];
    const isHoliday = !!holidaySet[st.date];
    const isSunday = isSundayDate(st.date);

    // Date picker + holiday toggle — always visible above the flow
    const existingReason = isHoliday && holidaySet[st.date]!==true ? holidaySet[st.date] : '';
    const controlRow = el(`<div class="row no-print" style="align-items:flex-end;">
      <div class="field" style="flex:0;"><label>दिनांक${isSunday?' (रविवार)':''}</label><input type="date" id="attDate" value="${st.date}"></div>
      ${!isHoliday ? `<div class="field" style="flex:1;min-width:200px;"><label>अवकाश का कारण</label><input type="text" id="attHolidayReason" placeholder="जैसे: त्योहार, राष्ट्रीय अवकाश, बारिश आदि"></div>` : ''}
      <div class="field" style="flex:0;">
        <button class="ghost" id="attHolidayBtn" type="button" style="${isHoliday?'background:rgba(178,58,50,.12);border-color:var(--redpen);color:var(--redpen);':''}">${isHoliday?(isSunday?'🏖️ रविवार को कार्यदिवस बनाएँ':'🏖️ अवकाश हटाएँ'):'🏖️ आज अवकाश घोषित करें'}</button>
      </div>
    </div>`);
    body.appendChild(controlRow);

    controlRow.querySelector('#attDate').onchange = (e)=>{ st.date = e.target.value; render(); };
    controlRow.querySelector('#attHolidayBtn').onclick = async ()=>{
      if(isHoliday){
        delete holidaySet[st.date];
        if(isSunday){
          // remember this particular Sunday was turned into a working day so it
          // doesn't automatically flip back to a holiday on next render/month view
          if(!db.sundayOverride) db.sundayOverride = {};
          if(!db.sundayOverride[cls]) db.sundayOverride[cls] = {};
          db.sundayOverride[cls][st.date] = true;
        }
      } else {
        const reasonEl = controlRow.querySelector('#attHolidayReason');
        const reason = reasonEl ? reasonEl.value.trim() : '';
        holidaySet[st.date] = reason || true;
        if(db.sundayOverride && db.sundayOverride[cls]) delete db.sundayOverride[cls][st.date];
        if(db.attendance[cls]) delete db.attendance[cls][st.date];
        st.forFlow = {cls:null, date:null}; // force a clean start next time this date is opened
      }
      await saveDB();
      render();
    };

    if(isHoliday){
      body.appendChild(el(`<div class="note" style="margin-top:14px;">🏖️ <b>${st.date}</b> को कक्षा ${cls} के लिए अवकाश घोषित किया गया है${existingReason ? ` — <b>कारण:</b> ${existingReason}` : ''}। इस दिन के लिए उपस्थिति दर्ज नहीं की जाएगी।</div>`));
      return wrap;
    }

    const existing = (db.attendance[cls]||{})[st.date] || null;

    // Fresh class/date combo → (re)initialise the one-by-one flow.
    // If attendance for this date was already saved, jump straight to the review summary.
    if(st.forFlow.cls!==cls || st.forFlow.date!==st.date){
      st.forFlow = {cls, date: st.date};
      st.marks = existing ? {...existing} : {};
      st.cursor = existing ? students.length : 0;
    }

    const box = el(`<div style="margin-top:14px;"></div>`);
    body.appendChild(box);

    async function persistAttendance(){
      db.attendance[cls] = db.attendance[cls] || {};
      db.attendance[cls][st.date] = {...st.marks};
      await saveDB();
    }

    if(st.cursor < students.length){
      // ---- one-student-at-a-time card: mark करते ही अगला बच्चा अपने-आप आ जाता है ----
      const current = students[st.cursor];
      const pct = Math.round((st.cursor/students.length)*100);
      const card = el(`<div style="max-width:420px;margin:6px auto 0;text-align:center;">
        <div class="section-sub" style="margin-bottom:6px;">${st.cursor+1} / ${students.length} छात्र</div>
        <div style="height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-bottom:22px;">
          <div style="height:100%;width:${pct}%;background:var(--chalk-light);"></div>
        </div>
        <div style="border:1px solid var(--line);border-radius:10px;padding:32px 20px;background:#fff;">
          <div class="mono" style="color:var(--muted);font-size:.85rem;">रोल नं. ${current.roll}</div>
          <div style="font-family:'Noto Serif Devanagari',serif;font-size:1.7rem;color:var(--chalk);margin-top:6px;">${current.name}</div>
        </div>
        <div style="display:flex;gap:12px;margin-top:20px;">
          <button type="button" id="attP" style="flex:1;padding:16px;border:none;border-radius:8px;background:rgba(47,93,80,.14);color:var(--chalk);font-weight:700;font-size:1rem;cursor:pointer;">✓ हाज़िर</button>
          <button type="button" id="attA" style="flex:1;padding:16px;border:none;border-radius:8px;background:rgba(178,58,50,.12);color:var(--redpen);font-weight:700;font-size:1rem;cursor:pointer;">✕ अनुपस्थित</button>
        </div>
        <div style="margin-top:14px;display:flex;justify-content:space-between;">
          <button type="button" id="attBack" class="ghost" style="${st.cursor===0?'visibility:hidden;':''}">◀ पिछला छात्र</button>
          <button type="button" id="attFillRest" class="ghost">बाकी सभी को हाज़िर करें ▶</button>
        </div>
      </div>`);
      box.appendChild(card);

      const advance = (mark)=>{ st.marks[current.id] = mark; persistAttendance(); st.cursor++; render(); };
      card.querySelector('#attP').onclick = ()=> advance('P');
      card.querySelector('#attA').onclick = ()=> advance('A');
      card.querySelector('#attBack').onclick = ()=>{ if(st.cursor>0){ st.cursor--; render(); } };
      card.querySelector('#attFillRest').onclick = ()=>{
        for(let i=st.cursor;i<students.length;i++){ if(!(students[i].id in st.marks)) st.marks[students[i].id]='P'; }
        st.cursor = students.length;
        persistAttendance();
        render();
      };
    } else {
      // ---- सभी बच्चे हो गए → सारांश दिखाएँ, ज़रूरत पड़े तो सुधार करें, फिर सेव करें ----
      const summary = el(`<div>
        <h3 style="font-family:'Noto Serif Devanagari',serif;color:var(--chalk);margin:4px 0 10px;">सारांश — ${st.date}</h3>
        <table><thead><tr><th>रोल नं.</th><th>नाम</th><th class="num">उपस्थिति</th></tr></thead><tbody id="attSumRows"></tbody></table>
        <div style="margin-top:14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;">
          <button class="ghost" id="attRedo" type="button">🔁 फिर से एक-एक कर भरें</button>
          <span id="attSavedMsg" style="color:var(--chalk);font-size:.85rem;">✓ स्वतः सेव हो गया</span>
        </div>
      </div>`);
      box.appendChild(summary);

      const savedMsgEl = summary.querySelector('#attSavedMsg');
      let savedMsgTimer = null;
      function flashSaved(text){
        if(!savedMsgEl) return;
        savedMsgEl.textContent = text;
        if(savedMsgTimer) clearTimeout(savedMsgTimer);
        if(text!=='✓ स्वतः सेव हो गया'){
          savedMsgTimer = setTimeout(()=>{ savedMsgEl.textContent = '✓ स्वतः सेव हो गया'; }, 1200);
        }
      }

      const sumRows = summary.querySelector('#attSumRows');
      function paintSumRow(tr, sid){
        const btn = tr.querySelector('.attToggle');
        const isP = st.marks[sid]==='P';
        btn.textContent = isP ? 'हाज़िर ✓' : 'अनुपस्थित ✕';
        btn.style.background = isP ? 'rgba(47,93,80,.14)' : 'rgba(178,58,50,.12)';
        btn.style.color = isP ? 'var(--chalk)' : 'var(--redpen)';
        btn.style.border = 'none'; btn.style.borderRadius='4px'; btn.style.padding='6px 16px'; btn.style.cursor='pointer'; btn.style.fontWeight='600'; btn.style.fontSize='.82rem';
        // पूरी row भी हाज़िर=हरी, अनुपस्थित=लाल रंग से हाइलाइट
        tr.style.background = isP ? '#E3F1E9' : '#FBEAE8';
        tr.querySelector('td:first-child').style.borderLeft = `4px solid ${isP?'#1E7A4C':'var(--redpen)'}`;
      }
      let defaultsAdded = false;
      students.forEach(s=>{
        if(!(s.id in st.marks)){ st.marks[s.id] = 'P'; defaultsAdded = true; }
        const tr = el(`<tr><td class="mono">${s.roll}</td><td>${s.name}</td><td class="num"><button type="button" class="attToggle" data-sid="${s.id}"></button></td></tr>`);
        sumRows.appendChild(tr);
        paintSumRow(tr, s.id);
        tr.querySelector('.attToggle').onclick = async ()=>{
          st.marks[s.id] = st.marks[s.id]==='P' ? 'A' : 'P';
          paintSumRow(tr, s.id);
          flashSaved('सेव हो रहा है…');
          await persistAttendance();
          flashSaved('✓ सेव हो गया');
        };
      });
      if(defaultsAdded) persistAttendance();

      summary.querySelector('#attRedo').onclick = ()=>{ st.cursor = 0; render(); };
    }
  } else {
    body.appendChild(renderAttendanceMonthlyReport(cls, st, ()=>render()));
  }
  return wrap;
}

// Shared monthly report table (used by both teacher + admin views)
function renderAttendanceMonthlyReport(cls, st, onChange){
  const {dates, stats} = attendanceMonthlyStats(cls, st.ym);
  const [yearStr, monStr] = st.ym.split('-');
  const monthLabel = MONTH_NAMES_HI[parseInt(monStr,10)-1] || monStr;
  const box = el(`<div>
    <div class="row no-print" style="align-items:flex-end;">
      <div class="field" style="flex:0;"><label>माह/वर्ष</label><input type="month" id="attYm" value="${st.ym}"></div>
      <div class="field" style="flex:0;"><button class="ghost" id="attPrintBtn">🖨️ प्रिंट करें</button></div>
    </div>
    <h3 style="font-family:'Noto Serif Devanagari',serif;color:var(--chalk);margin:14px 0 6px;">${cls} — ${monthLabel} ${yearStr} उपस्थिति रिपोर्ट</h3>

    ${attendanceHolidayListForMonth(cls, st.ym).length>0 ? `<div class="note" style="margin-bottom:14px;"><b>🏖️ इस माह के अवकाश:</b><div style="column-count:3;column-gap:24px;margin-top:8px;">${attendanceHolidayListForMonth(cls, st.ym).map(h=>`<div style="break-inside:avoid;padding:2px 0;">${h.date}${h.reason?` — ${h.reason}`:''}</div>`).join('')}</div></div>` : ''}
    <table><thead><tr><th>रोल नं.</th><th>नाम</th><th class="num">उपस्थित दिन</th><th class="num">अनुपस्थित दिन</th><th class="num">कुल दिन</th><th class="num">%</th></tr></thead><tbody>
    ${stats.length===0 ? `<tr><td colspan="6" style="text-align:center;color:var(--muted);">कोई छात्र नहीं</td></tr>` :
      stats.map(r=>`<tr><td class="mono">${r.student.roll}</td><td>${r.student.name}</td><td class="num">${r.present}</td><td class="num">${r.absent}</td><td class="num">${r.total}</td><td class="num">${r.total? Math.round(r.present/r.total*100)+'%':'—'}</td></tr>`).join('')}

  box.querySelector('#attPrintBtn').onclick = ()=>{ window.print(); };

    ${attendanceHolidayListForYear(cls, st.year).length>0 ? `<h3 style="font-family:'Noto Serif Devanagari',serif;color:var(--chalk);margin:0 0 6px;">${cls} — वर्ष ${st.year} उपस्थिति रिपोर्ट</h3>` : ''}
    <div style="overflow-x:auto;page-break-before:auto;">
    <table style="min-width:900px;"><thead><tr><th>रोल नं.</th><th>नाम</th>${months.map(m=>`<th class="num">${MONTH_NAMES_HI[parseInt(m,10)-1].slice(0,3)}</th>`).join('')}<th class="num">कुल उपस्थित</th><th class="num">कुल दिन</th></tr></thead><tbody>
    ${rows.length===0 ? `<tr><td colspan="${4+months.length}" style="text-align:center;color:var(--muted);">कोई छात्र नहीं</td></tr>` :
      rows.map(r=>`<tr><td class="mono">${r.student.roll}</td><td>${r.student.name}</td>${months.map(m=> `<td class="num">${r.months[m].total? r.months[m].present+'/'+r.months[m].total : '—'}</td>`).join('')}<td class="num" style="font-weight:700;">${r.totalPresent}</td><td class="num">${r.totalDays}</td></tr>`).join('')}

}

// ---------- ADMIN: ATTENDANCE REPORTS (view + print, all classes) ----------
function renderAttendanceAdmin(){
  const classNames = Object.keys(db.classes);
  if(!ui.attAdmin) ui.attAdmin = {cls: classNames[0]||null, mode:'monthly', ym: todayStr().slice(0,7), year: new Date().getFullYear()};
  const st = ui.attAdmin;
  if(st.cls===null || !classNames.includes(st.cls)) st.cls = classNames[0]||null;

  const wrap = el(`<div class="page"><div class="punch"></div>
    <h2 class="section-title no-print" style="margin-bottom:2px;">उपस्थिति रिपोर्ट</h2>
    <p class="section-sub no-print" style="margin:0 0 12px;">किसी भी कक्षा की माह-वार या वर्ष-वार उपस्थिति देखें और प्रिंट करें</p>
    <div class="row no-print" style="align-items:flex-end;">
      <div class="field" style="flex:0;min-width:140px;"><label>कक्षा</label><select id="attAdminCls">${classNames.length===0?'<option>—</option>':classNames.map(c=>`<option value="${c}" ${c===st.cls?'selected':''}>${c}${db.classes[c].classTeacher?' ('+ (db.teachers[db.classes[c].classTeacher]?db.teachers[db.classes[c].classTeacher].name:db.classes[c].classTeacher) +')':''}</option>`).join('')}</select></div>
      <div class="field" style="flex:0;"><button class="ghost" id="attAdminMonthly" style="${st.mode==='monthly'?'background:rgba(47,93,80,.1);':''}">मासिक रिपोर्ट</button></div>
      <div class="field" style="flex:0;"><button class="ghost" id="attAdminYearly" style="${st.mode==='yearly'?'background:rgba(47,93,80,.1);':''}">वार्षिक रिपोर्ट</button></div>
      <div class="field" style="flex:0;"><button class="ghost" id="attAdminHolidays" style="${st.mode==='holidays'?'background:rgba(47,93,80,.1);':''}">🏖️ अवकाश प्रबंधन</button></div>
    </div>
    <div id="attAdminBody" style="margin-top:12px;"></div>
  </div>`);

  if(classNames.length===0){
    wrap.querySelector('#attAdminBody').appendChild(el(`<div class="empty">अभी कोई कक्षा नहीं बनी है</div>`));
    return wrap;
  }
  wrap.querySelector('#attAdminCls').onchange = (e)=>{ st.cls = e.target.value; render(); };
  wrap.querySelector('#attAdminMonthly').onclick = ()=>{ st.mode='monthly'; render(); };
  wrap.querySelector('#attAdminYearly').onclick = ()=>{ st.mode='yearly'; render(); };
  wrap.querySelector('#attAdminHolidays').onclick = ()=>{ st.mode='holidays'; render(); };

  const body = wrap.querySelector('#attAdminBody');
  if(st.mode==='monthly') body.appendChild(renderAttendanceMonthlyReport(st.cls, st, ()=>render()));
  else if(st.mode==='yearly') body.appendChild(renderAttendanceYearlyReport(st.cls, st, ()=>render()));
  else body.appendChild(renderAttendanceHolidayAdmin(classNames, st, ()=>render()));
  return wrap;
}

// ---------- ADMIN: HOLIDAY MANAGEMENT (school can declare/remove holidays for one or all classes) ----------
function renderAttendanceHolidayAdmin(classNames, st, onChange){
  if(!st.holDate) st.holDate = todayStr();
  if(!st.holAll) st.holAll = false;
  const cls = st.cls;
  if(!db.holidays[cls]) db.holidays[cls] = {};
  ensureSundayHolidaysCached(cls, st.holDate.slice(0,7));
  const holidaySet = db.holidays[cls];
  const isHoliday = !!holidaySet[st.holDate];
  const isSunday = isSundayDate(st.holDate);
  const existingReason = isHoliday && holidaySet[st.holDate]!==true ? holidaySet[st.holDate] : '';

  const box = el(`<div>
    <p class="section-sub" style="margin:0 0 14px;">यहाँ से आप किसी भी दिन को कक्षा ${cls} (या चाहें तो सभी कक्षाओं) के लिए अवकाश घोषित कर सकते हैं। हर महीने के सभी <b>रविवार</b> पहले से ही स्वतः अवकाश मान लिए जाते हैं — उनके लिए अलग से कुछ करने की ज़रूरत नहीं।</p>
    <div class="row no-print" style="align-items:flex-end;">
      <div class="field" style="flex:0;"><label>दिनांक${isSunday?' (रविवार)':''}</label><input type="date" id="holDate" value="${st.holDate}"></div>
      ${!isHoliday ? `<div class="field" style="flex:1;min-width:200px;"><label>अवकाश का कारण</label><input type="text" id="holReason" placeholder="जैसे: त्योहार, राष्ट्रीय अवकाश, बारिश आदि"></div>` : ''}
      <div class="field" style="flex:0;">
        <button class="ghost" id="holBtn" type="button" style="${isHoliday?'background:rgba(178,58,50,.12);border-color:var(--redpen);color:var(--redpen);':''}">${isHoliday?(isSunday?'🏖️ रविवार को कार्यदिवस बनाएँ':'🏖️ अवकाश हटाएँ'):'🏖️ अवकाश घोषित करें'}</button>
      </div>
    </div>
    ${!isHoliday ? `<label style="display:flex;align-items:center;gap:8px;font-size:.85rem;color:var(--muted);margin:2px 0 4px;"><input type="checkbox" id="holAll" ${st.holAll?'checked':''}> सभी कक्षाओं के लिए यह अवकाश लागू करें (जैसे त्योहार / विद्यालय-व्यापी छुट्टी)</label>` : ''}
    ${isHoliday && existingReason ? `<p class="section-sub" style="margin:2px 0 4px;"><b>कारण:</b> ${existingReason}</p>` : ''}
    <div class="row no-print" style="align-items:flex-end;margin-top:16px;">
      <div class="field" style="flex:0;"><label>माह देखें</label><input type="month" id="holYm" value="${st.ym}"></div>
    </div>
    <div id="holList" style="margin-top:10px;"></div>
  </div>`);

  box.querySelector('#holDate').onchange = (e)=>{ st.holDate = e.target.value; onChange(); };
  const holAllEl = box.querySelector('#holAll');
  if(holAllEl) holAllEl.onchange = (e)=>{ st.holAll = e.target.checked; };

  box.querySelector('#holBtn').onclick = async ()=>{
    const targets = (!isHoliday && st.holAll) ? classNames : [cls];
    if(isHoliday){
      // removing a holiday only ever applies to the currently selected class
      delete holidaySet[st.holDate];
      if(isSunday){
        if(!db.sundayOverride) db.sundayOverride = {};
        if(!db.sundayOverride[cls]) db.sundayOverride[cls] = {};
        db.sundayOverride[cls][st.holDate] = true;
      }
    } else {
      const reasonEl = box.querySelector('#holReason');
      const reason = reasonEl ? reasonEl.value.trim() : '';
      targets.forEach(c=>{
        if(!db.holidays[c]) db.holidays[c] = {};
        db.holidays[c][st.holDate] = reason || true;
        if(db.sundayOverride && db.sundayOverride[c]) delete db.sundayOverride[c][st.holDate];
        if(db.attendance[c]) delete db.attendance[c][st.holDate];
      });
    }
    await saveDB();
    onChange();
  };

  const listHost = box.querySelector('#holList');
  box.querySelector('#holYm').onchange = (e)=>{ st.ym = e.target.value; onChange(); };
  const items = attendanceHolidayListForMonth(cls, st.ym);
  const [yearStr, monStr] = st.ym.split('-');
  const monthLabel = MONTH_NAMES_HI[parseInt(monStr,10)-1] || monStr;
  listHost.appendChild(el(`<h3 style="font-family:'Noto Serif Devanagari',serif;color:var(--chalk);margin:6px 0 8px;">${cls} — ${monthLabel} ${yearStr} के अवकाश</h3>`));
  if(items.length===0){
    listHost.appendChild(el(`<div class="empty">इस माह में कोई अवकाश दर्ज नहीं है</div>`));
  } else {
    const table = el(`<table><thead><tr><th>दिनांक</th><th>कारण</th><th class="num">कार्रवाई</th></tr></thead><tbody></tbody></table>`);
    const tbody = table.querySelector('tbody');
    items.forEach(h=>{
      const sunday = isSundayDate(h.date);
      const tr = el(`<tr><td class="mono">${h.date}${sunday?' <span style="color:var(--muted);font-size:.78rem;">(रविवार)</span>':''}</td><td>${h.reason||'—'}</td><td class="num"></td></tr>`);
      const actionTd = tr.querySelector('td.num');
      const delBtn = el(`<button class="danger" type="button">हटाएँ</button>`);
      delBtn.onclick = async ()=>{
        delete db.holidays[cls][h.date];
        if(sunday){
          if(!db.sundayOverride) db.sundayOverride = {};
          if(!db.sundayOverride[cls]) db.sundayOverride[cls] = {};
          db.sundayOverride[cls][h.date] = true;
        }
        await saveDB();
        onChange();
      };
      actionTd.appendChild(delBtn);
      tbody.appendChild(tr);
    });
    listHost.appendChild(table);
  }
  return box;
}

// ---------- INIT ----------
function setPrintOrientation(landscape, topMarginMm){
  // Switches the single @page rule between portrait/landscape via an injected
  // <style> tag right before printing. This replaces the old CSS "page: name"
  // named-page approach, which could produce an extra blank page when
  // transitioning into a differently-oriented named page.
  let styleEl = document.getElementById('dynPageOrientation');
  if(!styleEl){
    styleEl = document.createElement('style');
    styleEl.id = 'dynPageOrientation';
    document.head.appendChild(styleEl);
  }
  const top = topMarginMm!=null ? topMarginMm : (landscape ? 1.6 : 1.92);
  styleEl.textContent = landscape ? `@page{ size:A4 landscape; margin:${top}mm 8mm 1.6mm; }` : `@page{ size:A4; margin:${top}mm 8mm 1.6mm; }`;
}
// The TC card is a fixed 210mm wide on screen, but @media print resets it to
// width:100% of the (narrower, ~190mm) printable area. Any school-name font-size
// that was shrunk-to-fit at screen width can therefore still overflow past the
// card's decorative border once print layout actually applies. Re-run the fit
// right before printing, when the print-time width is the one in effect, so it
// always matches the width that's really being printed on.
function fitSchoolNamesForPrint(){
  document.querySelectorAll('.tc-school-name').forEach(nameEl=>{
    if(typeof fitSchoolNameTC === 'function') fitSchoolNameTC(nameEl);
  });
  if(typeof fitSchoolNames === 'function') fitSchoolNames(document);
}
window.addEventListener('beforeprint', fitSchoolNamesForPrint);
window.addEventListener('afterprint', ()=>{
  document.body.classList.remove('tt-print-periods-only','tt-print-grid-only');
  setPrintOrientation(false);
});
// Toggle a body class while any text field is focused, so the sticky header
// (see body.kb-open .appbar rule above) drops out of sticky mode while the
// on-screen keyboard is open/animating. Uses event delegation on document so
// it keeps working even though the login form and every other screen are
// re-rendered dynamically.
document.addEventListener('focusin', (e)=>{
  if(e.target && e.target.matches && e.target.matches('input,select,textarea')){
    document.body.classList.add('kb-open');
  }
});
document.addEventListener('focusout', (e)=>{
  if(e.target && e.target.matches && e.target.matches('input,select,textarea')){
    document.body.classList.remove('kb-open');
  }
});
(async function init(){
  render(); // show the UI (login screen) immediately, no blank/loading wait
  try{ await firebase.auth().signInAnonymously(); }
  catch(e){ console.error('firebase anonymous sign-in failed', e); }
  authReadyResolve();
  await Promise.all([loadRegistry(), loadTeacherIndex()]); // run together instead of one-after-the-other
  // school/teacher/superadmin login handlers each fetch fresh registry/teacherIndex
  // on submit, so we don't need to re-render here.
})();
</script>
